gregación de funciones ofrece varios beneficios clave para una institución bancaria Detección temprana: facilita la detección temprana de irregularidades y fraudes, ya que varias\", \"p\": 3, \"term\": \"Beneficios de la segregación de funciones\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Para abordar la mitigación de fraudes internos en el control de acceso a sistemas, es importante comprender las causas subyacentes que pueden llevar a estos actos fraudulentos en instituciones»\", \"o\": [\"3.3. Control de acceso a datos\", \"Ejemplos de segregación de funciones\", \"Causas de fraudes internos en instituciones bancarias\", \"Fraude de préstamos ficticios\"], \"k\": 2, \"e\": \"Pág. 17. El material identifica «Causas de fraudes internos en instituciones bancarias» con esta descripción: Para abordar la mitigación de fraudes internos en el control de acceso a sistemas, es importante comprender las causas subyacentes que pueden llevar a estos actos fraudulentos en instituciones\", \"p\": 17, \"term\": \"Causas de fraudes internos en instituciones bancarias\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Estos procedimientos garantizan que los registros financieros sean precisos y reflejen con precisión las transacciones bancarias»\", \"o\": [\"Registro y documentación adecuada de ajustes\", \"Descontento laboral\", \"Planificación\", \"Pasos para implementar la segregación de funciones\"], \"k\": 0, \"e\": \"Pág. 9. El material identifica «Registro y documentación adecuada de ajustes» con esta descripción: Estos procedimientos garantizan que los registros financieros sean precisos y reflejen con precisión las transacciones bancarias\", \"p\": 9, \"term\": \"Registro y documentación adecuada de ajustes\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La institución bancaria debe establecer un canal de denuncias confidenciales accesible y seguro, que permita a los denunciantes reportar de manera anónima o confidencial.»\", \"o\": [\"Establecimiento de un canal de denuncias confidenciales\", \"Detección temprana\", \"Tipos de auditorías internas\", \"Revelación no autorizada de datos de clientes\"], \"k\": 0, \"e\": \"Pág. 23. El material identifica «Establecimiento de un canal de denuncias confidenciales» con esta descripción: La institución bancaria debe establecer un canal de denuncias confidenciales accesible y seguro, que permita a los denunciantes reportar de manera anónima o confidencial.\", \"p\": 23, \"term\": \"Establecimiento de un canal de denuncias confidenciales\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «En el contexto de las instituciones bancarias, existen varios tipos de control de acceso, cada uno enfocado en áreas específicas»\", \"o\": [\"Seguimiento\", \"3. Tipos de control de acceso\", \"Causas de fraudes internos en instituciones bancarias\", \"3.3. Control de acceso a datos\"], \"k\": 1, \"e\": \"Pág. 16. El material identifica «3. Tipos de control de acceso» con esta descripción: En el contexto de las instituciones bancarias, existen varios tipos de control de acceso, cada uno enfocado en áreas específicas\", \"p\": 16, \"term\": \"3. Tipos de control de acceso\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «A continuación, presentamos dos ejemplos de cómo funciona la segregación de funciones en una»\", \"o\": [\"Adaptación\", \"Manipulación de transacciones\", \"Autenticación multifactor (MFA)\", \"Ejemplos de segregación de funciones\"], \"k\": 3, \"e\": \"Pág. 4. El material identifica «Ejemplos de segregación de funciones» con esta descripción: A continuación, presentamos dos ejemplos de cómo funciona la segregación de funciones en una\", \"p\": 4, \"term\": \"Ejemplos de segregación de funciones\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «evalúan la efectividad de los controles internos existentes y sugieren mejoras para fortalecer la prevención de fraudes»\", \"o\": [\"3.1. Control de acceso físico\", \"Evaluación de controles\", \"Concepto de segregación de funciones\", \"Registro y documentación adecuada de ajustes\"], \"k\": 1, \"e\": \"Pág. 12. El material identifica «Evaluación de controles» con esta descripción: evalúan la efectividad de los controles internos existentes y sugieren mejoras para fortalecer la prevención de fraudes\", \"p\": 12, \"term\": \"Evaluación de controles\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «En este caso, un empleado del departamento de préstamos aprueba préstamos ficticios a nombres de personas inexistentes o a cuentas fantasmas.»\", \"o\": [\"Beneficios de las políticas y procedimientos internos\", \"Fraude de préstamos ficticios\", \"Especialización\", \"Tipos de funciones\"], \"k\": 1, \"e\": \"Pág. 13. El material identifica «Fraude de préstamos ficticios» con esta descripción: En este caso, un empleado del departamento de préstamos aprueba préstamos ficticios a nombres de personas inexistentes o a cuentas fantasmas.\", \"p\": 13, \"term\": \"Fraude de préstamos ficticios\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «establecer un plan de auditoría que identifique áreas de riesgo, objetivos de auditoría y recursos necesarios»\", \"o\": [\"Pasos para implementar la segregación de funciones\", \"Autenticación multifactor (MFA)\", \"Independencia\", \"Planificación\"], \"k\": 3, \"e\": \"Pág. 15. El material identifica «Planificación» con esta descripción: establecer un plan de auditoría que identifique áreas de riesgo, objetivos de auditoría y recursos necesarios\", \"p\": 15, \"term\": \"Planificación\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Un ejecutivo financiero manipula los informes financieros de la institución bancaria para ocultar pérdidas y presentar una imagen financiera falsamente positiva.»\", \"o\": [\"Autenticación multifactor (MFA)\", \"Manipulación de información financiera\", \"Revisión continua\", \"Causas de fraudes internos en instituciones bancarias\"], \"k\": 1, \"e\": \"Pág. 14. El material identifica «Manipulación de información financiera» con esta descripción: Un ejecutivo financiero manipula los informes financieros de la institución bancaria para ocultar pérdidas y presentar una imagen financiera falsamente positiva.\", \"p\": 14, \"term\": \"Manipulación de información financiera\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La falta de controles internos adecuados o la ausencia de segregación de funciones puede crear oportunidades tentadoras para cometer fraudes internos sin ser detectados»\", \"o\": [\"Confidencialidad\", \"Establecimiento de un canal de denuncias confidenciales\", \"Oportunidad\", \"Detección temprana\"], \"k\": 2, \"e\": \"Pág. 3. El material identifica «Oportunidad» con esta descripción: La falta de controles internos adecuados o la ausencia de segregación de funciones puede crear oportunidades tentadoras para cometer fraudes internos sin ser detectados\", \"p\": 3, \"term\": \"Oportunidad\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Las denuncias confidenciales deben ser investigadas de manera seria y objetiva.»\", \"o\": [\"Tipos de denuncias confidenciales\", \"Políticas de control de acceso\", \"Investigaciones internas\", \"Beneficios de las políticas y procedimientos internos\"], \"k\": 2, \"e\": \"Pág. 24. El material identifica «Investigaciones internas» con esta descripción: Las denuncias confidenciales deben ser investigadas de manera seria y objetiva.\", \"p\": 24, \"term\": \"Investigaciones internas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Estas denuncias se relacionan con actividades fraudulentas cometidas por empleados o partes internas autorizadas.»\", \"o\": [\"Motivaciones financieras\", \"Revelación no autorizada de datos de clientes\", \"Denuncias de fraude\", \"Seguimiento\"], \"k\": 2, \"e\": \"Pág. 21. El material identifica «Denuncias de fraude» con esta descripción: Estas denuncias se relacionan con actividades fraudulentas cometidas por empleados o partes internas autorizadas.\", \"p\": 21, \"term\": \"Denuncias de fraude\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El control de acceso lógico se centra en regular el acceso a sistemas informáticos y aplicaciones en línea.»\", \"o\": [\"Registro y documentación adecuada de ajustes\", \"Autenticación multifactor (MFA)\", \"3.2. Control de acceso lógico\", \"Procesos de seguimiento de préstamos\"], \"k\": 2, \"e\": \"Pág. 16. El material identifica «3.2. Control de acceso lógico» con esta descripción: El control de acceso lógico se centra en regular el acceso a sistemas informáticos y aplicaciones en línea.\", \"p\": 16, \"term\": \"3.2. Control de acceso lógico\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «se requiere personal especializado en auditorías internas para comprender los riesgos financieros y operativos específicos de la banca»\", \"o\": [\"Establecimiento de un canal de denuncias confidenciales\", \"Seguimiento\", \"Pruebas y auditorías\", \"Especialización\"], \"k\": 3, \"e\": \"Pág. 14. El material identifica «Especialización» con esta descripción: se requiere personal especializado en auditorías internas para comprender los riesgos financieros y operativos específicos de la banca\", \"p\": 14, \"term\": \"Especialización\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «realizar pruebas de seguridad y auditorías regulares para evaluar la efectividad de los controles»\", \"o\": [\"Suplantación de identidad (phishing)\", \"Concepto de segregación de funciones\", \"Concepto de políticas y procedimientos internos\", \"Pruebas y auditorías\"], \"k\": 3, \"e\": \"Pág. 20. El material identifica «Pruebas y auditorías» con esta descripción: realizar pruebas de seguridad y auditorías regulares para evaluar la efectividad de los controles\", \"p\": 20, \"term\": \"Pruebas y auditorías\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Estas denuncias se refieren a situaciones de acoso laboral, que pueden incluir acoso sexual, acoso psicológico o intimidación en el lugar de trabajo»\", \"o\": [\"Evaluación de controles\", \"Adaptación\", \"Desafíos y consideraciones en auditorías internas\", \"Denuncias de acoso laboral\"], \"k\": 3, \"e\": \"Pág. 21. El material identifica «Denuncias de acoso laboral» con esta descripción: Estas denuncias se refieren a situaciones de acoso laboral, que pueden incluir acoso sexual, acoso psicológico o intimidación en el lugar de trabajo\", \"p\": 21, \"term\": \"Denuncias de acoso laboral\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Las políticas y procedimientos internos son un conjunto de reglas, directrices y procesos diseñados para regular y estandarizar las operaciones de una institución bancaria.»\", \"o\": [\"Conciencia del personal\", \"Pasos para implementar la segregación de funciones\", \"Concepto de políticas y procedimientos internos\", \"Adaptación\"], \"k\": 2, \"e\": \"Pág. 6. El material identifica «Concepto de políticas y procedimientos internos» con esta descripción: Las políticas y procedimientos internos son un conjunto de reglas, directrices y procesos diseñados para regular y estandarizar las operaciones de una institución bancaria.\", \"p\": 6, \"term\": \"Concepto de políticas y procedimientos internos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La realización de auditorías internas efectivas en la mitigación de fraudes internos conlleva desafíos y consideraciones importantes»\", \"o\": [\"Investigaciones internas\", \"Concepto de auditorías internas\", \"Uso inadecuado de credenciales\", \"Desafíos y consideraciones en auditorías internas\"], \"k\": 3, \"e\": \"Pág. 14. El material identifica «Desafíos y consideraciones en auditorías internas» con esta descripción: La realización de auditorías internas efectivas en la mitigación de fraudes internos conlleva desafíos y consideraciones importantes\", \"p\": 14, \"term\": \"Desafíos y consideraciones en auditorías internas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La implementación de políticas y procedimientos internos sólidos ofrece varios beneficios clave para»\", \"o\": [\"Evaluación continua\", \"Autenticación multifactor (MFA)\", \"3. Tipos de control de acceso\", \"Beneficios de las políticas y procedimientos internos\"], \"k\": 3, \"e\": \"Pág. 8. El material identifica «Beneficios de las políticas y procedimientos internos» con esta descripción: La implementación de políticas y procedimientos internos sólidos ofrece varios beneficios clave para\", \"p\": 8, \"term\": \"Beneficios de las políticas y procedimientos internos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Esta función implica la aprobación o autorización de transacciones financieras.»\", \"o\": [\"Beneficios de la segregación de funciones\", \"Tipos de auditorías internas\", \"Tipos de funciones\", \"Función de autorización\"], \"k\": 3, \"e\": \"Pág. 2. El material identifica «Función de autorización» con esta descripción: Esta función implica la aprobación o autorización de transacciones financieras.\", \"p\": 2, \"term\": \"Función de autorización\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «cumple con las regulaciones y estándares de seguridad cibernética como la ley Gramm-Leach-Bliley (GLBA) en los estados unidos»\", \"o\": [\"Cultura de denuncias\", \"Desafíos y consideraciones en auditorías internas\", \"Registro y documentación adecuada de ajustes\", \"Cumplimiento normativo\"], \"k\": 3, \"e\": \"Pág. 17. El material identifica «Cumplimiento normativo» con esta descripción: cumple con las regulaciones y estándares de seguridad cibernética como la ley Gramm-Leach-Bliley (GLBA) en los estados unidos\", \"p\": 17, \"term\": \"Cumplimiento normativo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Dentro del contexto de las instituciones bancarias, las denuncias confidenciales pueden abordar diversos tipos de problemas.»\", \"o\": [\"Pruebas y auditorías\", \"Evaluación continua\", \"Tipos de denuncias confidenciales\", \"Oportunidad\"], \"k\": 2, \"e\": \"Pág. 21. El material identifica «Tipos de denuncias confidenciales» con esta descripción: Dentro del contexto de las instituciones bancarias, las denuncias confidenciales pueden abordar diversos tipos de problemas.\", \"p\": 21, \"term\": \"Tipos de denuncias confidenciales\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Las auditorías internas son un proceso de evaluación independiente y sistemática que tiene como objetivo revisar las operaciones, los procesos y los controles internos de una organización.»\", \"o\": [\"Políticas de control de acceso\", \"Concepto de auditorías internas\", \"Causas de fraudes internos\", \"Pasos para implementar la segregación de funciones\"], \"k\": 1, \"e\": \"Pág. 11. El material identifica «Concepto de auditorías internas» con esta descripción: Las auditorías internas son un proceso de evaluación independiente y sistemática que tiene como objetivo revisar las operaciones, los procesos y los controles internos de una organización.\", \"p\": 11, \"term\": \"Concepto de auditorías internas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Para abordar la mitigación de fraudes internos, es necesario considerar varios tipos de políticas y procedimientos internos.»\", \"o\": [\"Tipos de políticas y procedimientos\", \"3.3. Control de acceso a datos\", \"Cumplimiento normativo\", \"Cultura de denuncias\"], \"k\": 0, \"e\": \"Pág. 7. El material identifica «Tipos de políticas y procedimientos» con esta descripción: Para abordar la mitigación de fraudes internos, es necesario considerar varios tipos de políticas y procedimientos internos.\", \"p\": 7, \"term\": \"Tipos de políticas y procedimientos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Las auditorías internas en instituciones bancarias pueden ser de varios tipos, cada una con su enfoque específico.»\", \"o\": [\"Tipos de auditorías internas\", \"Suplantación de identidad (phishing)\", \"Descontento laboral\", \"Evaluación de riesgos\"], \"k\": 0, \"e\": \"Pág. 11. El material identifica «Tipos de auditorías internas» con esta descripción: Las auditorías internas en instituciones bancarias pueden ser de varios tipos, cada una con su enfoque específico.\", \"p\": 11, \"term\": \"Tipos de auditorías internas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «fomentar una cultura en la que los empleados se sientan seguros al presentar denuncias confidenciales puede ser un desafío»\", \"o\": [\"Cultura de denuncias\", \"Abuso de privilegios\", \"Comunicación\", \"Detección temprana\"], \"k\": 0, \"e\": \"Pág. 24. El material identifica «Cultura de denuncias» con esta descripción: fomentar una cultura en la que los empleados se sientan seguros al presentar denuncias confidenciales puede ser un desafío\", \"p\": 24, \"term\": \"Cultura de denuncias\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La segregación de funciones es un principio clave de control interno que implica la distribución de tareas y responsabilidades relacionadas con un proceso financiero o contable entre diferentes»\", \"o\": [\"Concepto de segregación de funciones\", \"Conciencia del personal\", \"3.2. Control de acceso lógico\", \"Adaptación\"], \"k\": 0, \"e\": \"Pág. 2. El material identifica «Concepto de segregación de funciones» con esta descripción: La segregación de funciones es un principio clave de control interno que implica la distribución de tareas y responsabilidades relacionadas con un proceso financiero o contable entre diferentes\", \"p\": 2, \"term\": \"Concepto de segregación de funciones\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Esta política garantiza que los préstamos se aprueben de manera justa y consistente, evitando prácticas de aprobación de préstamos riesgosas o sesgadas»\", \"o\": [\"Planificación\", \"Evaluación continua\", \"Procesos de seguimiento de préstamos\", \"Fraude de préstamos ficticios\"], \"k\": 2, \"e\": \"Pág. 9. El material identifica «Procesos de seguimiento de préstamos» con esta descripción: Esta política garantiza que los préstamos se aprueben de manera justa y consistente, evitando prácticas de aprobación de préstamos riesgosas o sesgadas\", \"p\": 9, \"term\": \"Procesos de seguimiento de préstamos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «las auditorías internas pueden identificar irregularidades y fraudes en etapas tempranas, antes de que causen daños significativos»\", \"o\": [\"Beneficios de la segregación de funciones\", \"Manipulación de transacciones\", \"Detección temprana\", \"Tipos de políticas y procedimientos\"], \"k\": 2, \"e\": \"Pág. 12. El material identifica «Detección temprana» con esta descripción: las auditorías internas pueden identificar irregularidades y fraudes en etapas tempranas, antes de que causen daños significativos\", \"p\": 12, \"term\": \"Detección temprana\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Supongamos que un cliente solicita un préstamo personal en un banco.»\", \"o\": [\"Ejemplo 1: autorización y registro de transacciones\", \"Desafíos y consideraciones\", \"Investigaciones justas\", \"Causas de fraudes internos\"], \"k\": 0, \"e\": \"Pág. 4. El material identifica «Ejemplo 1: autorización y registro de transacciones» con esta descripción: Supongamos que un cliente solicita un préstamo personal en un banco.\", \"p\": 4, \"term\": \"Ejemplo 1: autorización y registro de transacciones\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «las investigaciones internas deben ser justas y transparentes para todas las partes involucradas»\", \"o\": [\"Investigaciones justas\", \"Concepto de auditorías internas\", \"Motivaciones financieras\", \"3. Tipos de control de acceso\"], \"k\": 0, \"e\": \"Pág. 24. El material identifica «Investigaciones justas» con esta descripción: las investigaciones internas deben ser justas y transparentes para todas las partes involucradas\", \"p\": 24, \"term\": \"Investigaciones justas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Estas políticas establecen quién tiene acceso a sistemas, datos y áreas críticas dentro de la institución bancaria.»\", \"o\": [\"Conclusiones\", \"Concepto de auditorías internas\", \"Políticas de control de acceso\", \"Desafíos y consideraciones en auditorías internas\"], \"k\": 2, \"e\": \"Pág. 7. El material identifica «Políticas de control de acceso» con esta descripción: Estas políticas establecen quién tiene acceso a sistemas, datos y áreas críticas dentro de la institución bancaria.\", \"p\": 7, \"term\": \"Políticas de control de acceso\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «realizar revisiones periódicas para asegurarse de que las políticas estén actualizadas y sean efectivas»\", \"o\": [\"Revelación no autorizada de datos de clientes\", \"Capacitación del personal\", \"Adaptación\", \"Revisión continua\"], \"k\": 3, \"e\": \"Pág. 10. El material identifica «Revisión continua» con esta descripción: realizar revisiones periódicas para asegurarse de que las políticas estén actualizadas y sean efectivas\", \"p\": 10, \"term\": \"Revisión continua\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Un empleado recibe un correo electrónico de phishing que parece ser de una fuente legítima, como el departamento de recursos humanos.»\", \"o\": [\"Beneficios de la segregación de funciones\", \"Concepto de auditorías internas\", \"Función de autorización\", \"Suplantación de identidad (phishing)\"], \"k\": 3, \"e\": \"Pág. 18. El material identifica «Suplantación de identidad (phishing)» con esta descripción: Un empleado recibe un correo electrónico de phishing que parece ser de una fuente legítima, como el departamento de recursos humanos.\", \"p\": 18, \"term\": \"Suplantación de identidad (phishing)\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El monitoreo constante de las actividades de acceso ayuda a detectar patrones inusuales o comportamientos sospechosos.»\", \"o\": [\"Descontento laboral\", \"Políticas de detección de fraudes\", \"Monitoreo continuo\", \"3.1. Control de acceso físico\"], \"k\": 2, \"e\": \"Pág. 19. El material identifica «Monitoreo continuo» con esta descripción: El monitoreo constante de las actividades de acceso ayuda a detectar patrones inusuales o comportamientos sospechosos.\", \"p\": 19, \"term\": \"Monitoreo continuo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Un cliente denuncia que sus datos personales y financieros se han divulgado sin su consentimiento La investigación interna rastrea la revelación no autorizada hasta un empleado que había vendido»\", \"o\": [\"Revelación no autorizada de datos de clientes\", \"Tipos de denuncias confidenciales\", \"Especialización\", \"Tipos de políticas y procedimientos\"], \"k\": 0, \"e\": \"Pág. 23. El material identifica «Revelación no autorizada de datos de clientes» con esta descripción: Un cliente denuncia que sus datos personales y financieros se han divulgado sin su consentimiento La investigación interna rastrea la revelación no autorizada hasta un empleado que había vendido\", \"p\": 23, \"term\": \"Revelación no autorizada de datos de clientes\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Un empleado de una institución bancaria recibe una denuncia confidencial que señala la manipulación de transacciones para beneficio personal.»\", \"o\": [\"Beneficios de la segregación de funciones\", \"Manipulación de transacciones\", \"Especialización\", \"Investigaciones justas\"], \"k\": 1, \"e\": \"Pág. 23. El material identifica «Manipulación de transacciones» con esta descripción: Un empleado de una institución bancaria recibe una denuncia confidencial que señala la manipulación de transacciones para beneficio personal.\", \"p\": 23, \"term\": \"Manipulación de transacciones\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Estas políticas establecen procedimientos y herramientas para detectar fraudes internos en etapas tempranas.»\", \"o\": [\"3.3. Control de acceso a datos\", \"Pruebas y auditorías\", \"Políticas de detección de fraudes\", \"Conciencia del personal\"], \"k\": 2, \"e\": \"Pág. 7. El material identifica «Políticas de detección de fraudes» con esta descripción: Estas políticas establecen procedimientos y herramientas para detectar fraudes internos en etapas tempranas.\", \"p\": 7, \"term\": \"Políticas de detección de fraudes\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «llevar a cabo la auditoría interna de acuerdo con el plan establecido, incluyendo la revisión de documentación, entrevistas y pruebas de controles»\", \"o\": [\"Tipos de denuncias confidenciales\", \"Causas de fraudes internos\", \"Ejecución\", \"3.1. Control de acceso físico\"], \"k\": 2, \"e\": \"Pág. 15. El material identifica «Ejecución» con esta descripción: llevar a cabo la auditoría interna de acuerdo con el plan establecido, incluyendo la revisión de documentación, entrevistas y pruebas de controles\", \"p\": 15, \"term\": \"Ejecución\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Los empleados pueden verse tentados a cometer fraudes internos debido a motivaciones financieras como la necesidad de dinero adicional o la oportunidad de enriquecerse ilegalmente»\", \"o\": [\"Prevención\", \"Ejecución\", \"Motivaciones financieras\", \"Tipos de denuncias confidenciales\"], \"k\": 2, \"e\": \"Pág. 17. El material identifica «Motivaciones financieras» con esta descripción: Los empleados pueden verse tentados a cometer fraudes internos debido a motivaciones financieras como la necesidad de dinero adicional o la oportunidad de enriquecerse ilegalmente\", \"p\": 17, \"term\": \"Motivaciones financieras\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «las instituciones bancarias deben adaptar la segregación de funciones a su estructura organizativa y riesgos específicos»\", \"o\": [\"Adaptación\", \"Pruebas y auditorías\", \"Beneficios de las políticas y procedimientos internos\", \"Concepto de auditorías internas\"], \"k\": 0, \"e\": \"Pág. 5. El material identifica «Adaptación» con esta descripción: las instituciones bancarias deben adaptar la segregación de funciones a su estructura organizativa y riesgos específicos\", \"p\": 5, \"term\": \"Adaptación\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «comunicar claramente las políticas y procedimientos a todos los empleados y proporcionar capacitación sobre su implementación»\", \"o\": [\"Cultura de denuncias\", \"Concepto de auditorías internas\", \"Comunicación\", \"Suplantación de identidad (phishing)\"], \"k\": 2, \"e\": \"Pág. 10. El material identifica «Comunicación» con esta descripción: comunicar claramente las políticas y procedimientos a todos los empleados y proporcionar capacitación sobre su implementación\", \"p\": 10, \"term\": \"Comunicación\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «establecer políticas de seguridad de acceso y procedimientos claros»\", \"o\": [\"Causas de fraudes internos\", \"Formación\", \"Revisión continua\", \"Desarrollo de políticas\"], \"k\": 3, \"e\": \"Pág. 19. El material identifica «Desarrollo de políticas» con esta descripción: establecer políticas de seguridad de acceso y procedimientos claros\", \"p\": 19, \"term\": \"Desarrollo de políticas\"}];const letters=['A','B','C','D'];let idx=0,ans=Array(Q.length).fill(null),locked=Array(Q.length).fill(false);function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;')}function render(){let q=Q[idx];document.getElementById('count').textContent=`Pregunta ${idx+1} de ${Q.length}`;document.getElementById('answered').textContent=`${locked.filter(Boolean).length} comprobadas`;document.getElementById('bar').style.width=((idx+1)/Q.length*100)+'%';document.getElementById('stem').textContent=q.q;document.getElementById('options').innerHTML=q.o.map((v,j)=>`<button class=\"opt ${ans[idx]===j?'chosen':''} ${locked[idx]&&j===q.k?'correct':''} ${locked[idx]&&ans[idx]===j&&j!==q.k?'wrong':''}\" ${locked[idx]?'disabled':''} onclick=\"choose(${j})\"><b>${letters[j]}.<\/b> ${esc(v)}<\/button>`).join('');document.getElementById('prev').disabled=idx===0;document.getElementById('check').classList.toggle('hidden',locked[idx]);document.getElementById('check').disabled=ans[idx]===null;document.getElementById('next').classList.toggle('hidden',!locked[idx]);document.getElementById('next').textContent=idx===Q.length-1?'Ver calificación':'Siguiente →';let f=document.getElementById('feedback');f.classList.toggle('hidden',!locked[idx]);if(locked[idx])f.innerHTML=`<b class=\"${ans[idx]===q.k?'good':'bad'}\">${ans[idx]===q.k?'✓ Respuesta correcta':'✗ Respuesta incorrecta'}<\/b><p>${esc(q.e)}<\/p>`}function choose(j){if(locked[idx])return;ans[idx]=j;render()}function check(){if(ans[idx]===null)return;locked[idx]=true;render()}function prev(){if(idx>0){idx--;render()}}function next(){if(!locked[idx])return;if(idx===Q.length-1){finish();return}idx++;render()}function finish(){let correct=Q.filter((q,i)=>ans[i]===q.k).length;document.getElementById('quiz').classList.add('hidden');document.getElementById('results').classList.remove('hidden');document.getElementById('score').textContent=Math.round(100*correct/Q.length)+'%';document.getElementById('summary').textContent=`${correct} de ${Q.length} respuestas correctas`;document.getElementById('review').innerHTML=Q.map((q,i)=>`<div class=\"review\"><b>${i+1}. ${esc(q.q)}<\/b><div class=\"${ans[i]===q.k?'good':'bad'}\">Tu respuesta: ${letters[ans[i]]}. ${esc(q.o[ans[i]])}<\/div>${ans[i]===q.k?'':`<div class=\"good\">Correcta: ${letters[q.k]}. ${esc(q.o[q.k])}<\/div>`}<div>${esc(q.e)}<\/div><\/div>`).join('');window.scrollTo(0,0)}function restart(){idx=0;ans=Array(Q.length).fill(null);locked=Array(Q.length).fill(false);document.getElementById('results').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();window.scrollTo(0,0)}render();<\/script><\/body><\/html>", "title": "Métodos de Mitigación de fraudes", "count": 46, "week": "Semana 15", "area": "Área Bancaria Financiera"}, {"html": "<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Proceso de créditos<\/title><style>\n*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#183047;font:16px system-ui,Segoe UI,Arial}.shell{max-width:900px;margin:24px auto;padding:0 14px}.head{background:#10365b;color:white;border-radius:16px;padding:26px}.head small{letter-spacing:.08em;color:#b8d7f2}.head h1{margin:8px 0 6px;font-size:28px}.head p{margin:5px 0;color:#e3edf7}.box{background:white;border-radius:16px;padding:26px;margin:18px 0;box-shadow:0 3px 14px #193b5610}.meta{display:flex;justify-content:space-between;color:#63798c;font-size:14px}.progress{height:8px;background:#e3edf5;border-radius:99px;overflow:hidden;margin:16px 0 24px}.bar{height:100%;background:#1682bf}.stem{font-size:19px;line-height:1.6;font-weight:650;margin:20px 0}.opt{display:block;width:100%;border:1px solid #d1dde6;background:#fff;text-align:left;padding:14px 16px;margin:10px 0;border-radius:10px;cursor:pointer;font-size:15px;line-height:1.45}.opt:hover{background:#f3faff;border-color:#7aafd1}.opt.chosen{background:#e9f4fc;border:2px solid #1672ac}.opt.correct{background:#e7f6ee;border:2px solid #11834c}.opt.wrong{background:#ffeded;border:2px solid #c74646}.opt:disabled{cursor:default}.feedback{background:#edf5fc;padding:14px;border-radius:10px;margin-top:15px;line-height:1.55}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:20px}button.act{background:#176c9e;color:white;border:0;border-radius:9px;padding:12px 16px;font-weight:650;cursor:pointer}button.act.secondary{background:#e6eef5;color:#1c4263}button.act:disabled{opacity:.4;cursor:default}.hidden{display:none}.score{text-align:center;font-size:48px;color:#176c9e;font-weight:800}.review{border-bottom:1px solid #e4ebf2;padding:16px 0;line-height:1.55}.good{color:#0d7d49}.bad{color:#c63d3d}footer{color:#64748b;font-size:12px;text-align:center;padding:15px}@media(max-width:520px){.head h1{font-size:23px}.box{padding:18px}.stem{font-size:17px}}\n<\/style><\/head><body><div class=\"shell\"><header class=\"head\"><small>ECP 2026 · SIMULADOR DE ESTUDIO<\/small><h1>Semana 3<\/h1><p><b>Documento:<\/b> Proceso de créditos<\/p><p>Área Bancaria Financiera · Análisis y gestiones crediticias<\/p><p>Páginas 2–11 de la guía oficial · 20 preguntas<\/p><\/header><section class=\"box\" id=\"quiz\"><div class=\"meta\"><span id=\"count\"><\/span><span id=\"answered\"><\/span><\/div><div class=\"progress\"><div class=\"bar\" id=\"bar\"><\/div><\/div><div class=\"stem\" id=\"stem\"><\/div><div id=\"options\"><\/div><div id=\"feedback\" class=\"feedback hidden\"><\/div><div class=\"actions\"><button class=\"act secondary\" id=\"prev\" onclick=\"prev()\">← Anterior<\/button>< dito» con esta descripción: Completa la evaluación del riesgo, un comité o un oficial de crédito toma la decisión de aprobar o rechazar la solicitud de crédito.\", \"p\": 2, \"term\": \"5. Aprobación del crédito\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Después del desembolso, la institución financiera monitorea el préstamo para garantizar que se cumplan los términos acordados y que se realicen los pagos según lo programado.»\", \"o\": [\"Ejemplos de evaluaciones de solicitantes y deudores\", \"8. Monitoreo y gestión del crédito\", \"2. Características del mercado objetivo\", \"2. Evaluación de la solicitud\"], \"k\": 1, \"e\": \"Pág. 3. El material identifica «8. Monitoreo y gestión del crédito» con esta descripción: Después del desembolso, la institución financiera monitorea el préstamo para garantizar que se cumplan los términos acordados y que se realicen los pagos según lo programado.\", \"p\": 3, \"term\": \"8. Monitoreo y gestión del crédito\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «se evalúan los estados financieros, ingresos, activos y pasivos del solicitante o deudor para determinar su capacidad de pago y solvencia»\", \"o\": [\"Análisis financiero\", \"2. IDENTIFICACIÓN DEL MERCADO OBJETIVO\", \"4. Evaluación de garantías\", \"Criterios de aprobación\"], \"k\": 0, \"e\": \"Pág. 10. El material identifica «Análisis financiero» con esta descripción: se evalúan los estados financieros, ingresos, activos y pasivos del solicitante o deudor para determinar su capacidad de pago y solvencia\", \"p\": 10, \"term\": \"Análisis financiero\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Análisis de riesgo crediticio: se utilizan modelos estadísticos y algoritmos para evaluar el riesgo crediticio de los clientes asignándoles una calificación de crédito que determinará la viabilidad de»\", \"o\": [\"1. Solicitud de crédito\", \"Ejemplos de evaluaciones de solicitantes y deudores\", \"1. Introducción al mercado objetivo\", \"3. Análisis de riesgo\"], \"k\": 1, \"e\": \"Pág. 11. El material identifica «Ejemplos de evaluaciones de solicitantes y deudores» con esta descripción: Análisis de riesgo crediticio: se utilizan modelos estadísticos y algoritmos para evaluar el riesgo crediticio de los clientes asignándoles una calificación de crédito que determinará la viabilidad de\", \"p\": 11, \"term\": \"Ejemplos de evaluaciones de solicitantes y deudores\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «se utilizan modelos estadísticos y algoritmos para evaluar el riesgo crediticio de los clientes asignándoles una calificación de crédito que determinará la viabilidad de otorgarles financiamiento»\", \"o\": [\"Préstamos hipotecarios\", \"Análisis de riesgo crediticio\", \"4. Evaluación de garantías\", \"2. Características del mercado objetivo\"], \"k\": 1, \"e\": \"Pág. 11. El material identifica «Análisis de riesgo crediticio» con esta descripción: se utilizan modelos estadísticos y algoritmos para evaluar el riesgo crediticio de los clientes asignándoles una calificación de crédito que determinará la viabilidad de otorgarles financiamiento\", \"p\": 11, \"term\": \"Análisis de riesgo crediticio\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Comportamental: comportamientos de compra, uso de productos financieros, lealtad a la»\", \"o\": [\"5. Estrategias de marketing y comunicación\", \"Análisis de riesgo crediticio\", \"Análisis financiero\", \"Psicográfica: estilo de vida, valores, personalidad\"], \"k\": 3, \"e\": \"Pág. 6. El material identifica «Psicográfica: estilo de vida, valores, personalidad» con esta descripción: Comportamental: comportamientos de compra, uso de productos financieros, lealtad a la\", \"p\": 6, \"term\": \"Psicográfica: estilo de vida, valores, personalidad\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? « ])f.innerHTML=`<b class=\"${ans[idx]===q.k?'good':'bad'}\">${ans[idx]===q.k?'✓ Respuesta correcta':'✗ Respuesta incorrecta'}<\/b><p>${esc(q.e)}<\/p>`}function choose(j){if(locked[idx])return;ans[idx]=j;render()}function check(){if(ans[idx]===null)return;locked[idx]=true;render()}function prev(){if(idx>0){idx--;render()}}function next(){if(!locked[idx])return;if(idx===Q.length-1){finish();return}idx++;render()}function finish(){let correct=Q.filter((q,i)=>ans[i]===q.k).length;document.getElementById('quiz').classList.add('hidden');document.getElementById('results').classList.remove('hidden');document.getElementById('score').textContent=Math.round(100*correct/Q.length)+'%';document.getElementById('summary').textContent=`${correct} de ${Q.length} respuestas correctas`;document.getElementById('review').innerHTML=Q.map((q,i)=>`<div class=\"review\"><b>${i+1}. ${esc(q.q)}<\/b><div class=\"${ans[i]===q.k?'good':'bad'}\">Tu respuesta: ${letters[ans[i]]}. ${esc(q.o[ans[i]])}<\/div>${ans[i]===q.k?'':`<div class=\"good\">Correcta: ${letters[q.k]}. ${esc(q.o[q.k])}<\/div>`}<div>${esc(q.e)}<\/div><\/div>`).join('');window.scrollTo(0,0)}function restart(){idx=0;ans=Array(Q.length).fill(null);locked=Array(Q.length).fill(false);document.getElementById('results').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();window.scrollTo(0,0)}render();<\/script><\/body><\/html>", "title": "Proceso de créditos", "count": 20, "week": "Semana 3", "area": "Área Bancaria Financiera"}, {"html": "<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Utilización de los Burós de crédito<\/title><style>\n*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#183047;font:16px system-ui,Segoe UI,Arial}.shell{max-width:900px;margin:24px auto;padding:0 14px}.head{background:#10365b;color:white;border-radius:16px;padding:26px}.head small{letter-spacing:.08em;color:#b8d7f2 ass=\"meta\"><span id=\"count\"><\/span><span id=\"answered\"><\/span><\/div><div class=\"progress\"><div class=\"bar\" id=\"bar\"><\/div><\/div><div class=\"stem\" id=\"stem\"><\/div><div id=\"options\"><\/div><div id=\"feedback\" class=\"feedback hidden\"><\/div><div class=\"actions\"><button class=\"act secondary\" id=\"prev\" onclick=\"prev()\">← Anterior<\/button><button class=\"act\" id=\"check\" onclick=\"check()\">Comprobar respuesta<\/button><button class=\"act hidden\" id=\"next\" onclick=\"next()\">Siguiente →<\/button><\/div><\/section><section class=\"box hidden\" id=\"results\"><h2>Resultado del simulador<\/h2><div class=\"score\" id=\"score\"><\/div><p id=\"summary\" style=\"text-align:center\"><\/p><div class=\"actions\"><button class=\"act secondary\" onclick=\"restart()\">Repetir<\/button><button class=\"act\" onclick=\"window.print()\">Imprimir revisión<\/button><\/div><h2>Respuestas explicadas<\/h2><div id=\"review\"><\/div><\/section><footer>Preguntas basadas únicamente en el documento del curso y páginas indicadas. Funciona sin conexión.<\/footer><\/div><script>\nconst Q=[{\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Identificación de posibles banderas rojas como quiebras, embargos, reposesiones o cuentas en cobranzas que podrían impactar negativamente en la decisión final»\", \"o\": [\"4. Historial de pagos\", \"8. Análisis de factores adversos\", \"12. Condiciones del préstamo\", \"13. Monitoreo continuo\"], \"k\": 1, \"e\": \"Pág. 20. El material identifica «8. Análisis de factores adversos» con esta descripción: Identificación de posibles banderas rojas como quiebras, embargos, reposesiones o cuentas en cobranzas que podrían impactar negativamente en la decisión final\", \"p\": 20, \"term\": \"8. Análisis de factores adversos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Se observa la antigüedad de las líneas de crédito para evaluar la experiencia del solicitante en la gestión de créditos a largo plazo»\", \"o\": [\"3. Evaluación del puntaje de crédito\", \"9. Análisis de la utilización del crédito\", \"10. Revisiones de eventos adversos\", \"7. Verificación de duración del crédito\"], \"k\": 3, \"e\": \"Pág. 17. El material identifica «7. Verificación de duración del crédito» con esta descripción: Se observa la antigüedad de las líneas de crédito para evaluar la experiencia del solicitante en la gestión de créditos a largo plazo\", \"p\": 17, \"term\": \"7. Verificación de duración del crédito\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «se analiza qué porcentaje del crédito disponible se está utilizando»\", \"o\": [\"Aprobación del préstamo\", \"4. Historial de pagos\", \"11. Análisis de la capacidad de pago\", \"Uso de crédito\"], \"k\": 3, \"e\": \"Pág. 7. El material identifica «Uso de crédito» con esta descripción: se analiza qué porcentaje del crédito disponible se está utilizando\", \"p\": 7, \"term\": \"Uso de crédito\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Si el solicitante cumple con los criterios de solvencia y capacidad de pago, el préstamo para consolidación de deudas puede ser aprobado»\", \"o\": [\"11. Cálculo de la ratio deuda ingreso\", \"4. Historial de pagos\", \"8. Registro de incumplimientos\", \"11. Aprobación del préstamo\"], \"k\": 3, \"e\": \"Pág. 22. El material identifica «11. Aprobación del préstamo» con esta descripción: Si el solicitante cumple con los criterios de solvencia y capacidad de pago, el préstamo para consolidación de deudas puede ser aprobado\", \"p\": 22, \"term\": \"11. Aprobación del préstamo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «a menudo necesitan demostrar a los reguladores que están prestando de manera responsable y, el uso de informes de crédito es parte de este proceso»\", \"o\": [\"4. Evaluación del puntaje de crédito\", \"Solicitud de crédito\", \"Cumplimiento regulatorio\", \"4. Evaluación de crédito comercial\"], \"k\": 2, \"e\": \"Pág. 4. El material identifica «Cumplimiento regulatorio» con esta descripción: a menudo necesitan demostrar a los reguladores que están prestando de manera responsable y, el uso de informes de crédito es parte de este proceso\", \"p\": 4, \"term\": \"Cumplimiento regulatorio\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «En los reportes de burós de crédito hay varios indicadores clave que se usan para evaluar la solvencia crediticia de una persona o empresa, los cuales sirven para que los prestamistas puedan estimar el»\", \"o\": [\"Como analizar un buró de crédito\", \"5. Análisis de la utilización de crédito\", \"Privacidad y regulación\", \"Indicadores clave en los burós de crédito\"], \"k\": 3, \"e\": \"Pág. 7. El material identifica «Indicadores clave en los burós de crédito» con esta descripción: En los reportes de burós de crédito hay varios indicadores clave que se usan para evaluar la solvencia crediticia de una persona o empresa, los cuales sirven para que los prestamistas puedan estimar el\", \"p\": 7, \"term\": \"Indicadores clave en los burós de crédito\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Examinar la cantidad de crédito que el solicitante está utilizando en comparación con su límite.»\", \"o\": [\"10. Verificación de información financiera\", \"2. Recolección de información del solicitante\", \"10. Análisis del entorno empresarial\", \"6. Utilización de crédito\"], \"k\": 3, \"e\": \"Pág. 6. El material identifica «6. Utilización de crédito» con esta descripción: Examinar la cantidad de crédito que el solicitante está utilizando en comparación con su límite.\", \"p\": 6, \"term\": \"6. Utilización de crédito\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Si se aprueba el préstamo se establecerán los términos y condiciones, incluyendo la tasa de interés que estará influenciada por la puntuación de crédito y otros factores evaluados»\", \"o\": [\"Reducir la morosidad\", \"12. Condiciones del préstamo\", \"Definición\", \"2. Recolección de información del solicitante\"], \"k\": 1, \"e\": \"Pág. 20. El material identifica «12. Condiciones del préstamo» con esta descripción: Si se aprueba el préstamo se establecerán los términos y condiciones, incluyendo la tasa de interés que estará influenciada por la puntuación de crédito y otros factores evaluados\", \"p\": 20, \"term\": \"12. Condiciones del préstamo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Se asegura de que la solicitud cumpla con todas las normativas gubernamentales y los estándares»\", \"o\": [\"Autogestión financiera\", \"10. Verificación de información financiera\", \"12. Cumplimiento de normativas\", \"Manejo financiero\"], \"k\": 2, \"e\": \"Pág. 18. El material identifica «12. Cumplimiento de normativas» con esta descripción: Se asegura de que la solicitud cumpla con todas las normativas gubernamentales y los estándares\", \"p\": 18, \"term\": \"12. Cumplimiento de normativas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Se buscan registros de bancarrota, embargos, ejecuciones hipotecarias o colecciones, ya que estos pueden afectar significativamente la decisión de crédito»\", \"o\": [\"4. Análisis del historial de pagos\", \"1. Solicitud completa\", \"11. Análisis de la capacidad de pago\", \"10. Revisiones de eventos adversos\"], \"k\": 3, \"e\": \"Pág. 18. El material identifica «10. Revisiones de eventos adversos» con esta descripción: Se buscan registros de bancarrota, embargos, ejecuciones hipotecarias o colecciones, ya que estos pueden afectar significativamente la decisión de crédito\", \"p\": 18, \"term\": \"10. Revisiones de eventos adversos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Se analizan las deudas existentes como préstamos de autos, tarjetas de crédito y préstamos estudiantiles para evaluar la carga financiera actual y la capacidad para asumir una hipoteca»\", \"o\": [\"11. Consideración de colateral\", \"Solicitud de crédito\", \"6. Observación de las deudas actuales\", \"5. Examen de la utilización del crédito\"], \"k\": 2, \"e\": \"Pág. 17. El material identifica «6. Observación de las deudas actuales» con esta descripción: Se analizan las deudas existentes como préstamos de autos, tarjetas de crédito y préstamos estudiantiles para evaluar la carga financiera actual y la capacidad para asumir una hipoteca\", \"p\": 17, \"term\": \"6. Observación de las deudas actuales\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El prestamista revisa la puntuación de crédito, que es un indicador clave del riesgo crediticio.»\", \"o\": [\"3. Evaluación del puntaje de crédito\", \"4. Evaluación de crédito comercial\", \"10. Verificación de información financiera\", \"Detección de fraude\"], \"k\": 0, \"e\": \"Pág. 13. El material identifica «3. Evaluación del puntaje de crédito» con esta descripción: El prestamista revisa la puntuación de crédito, que es un indicador clave del riesgo crediticio.\", \"p\": 13, \"term\": \"3. Evaluación del puntaje de crédito\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Confirmación de que la información proporcionada por el solicitante en su aplicación es precisa y veraz, a menudo a través de documentos justificativos como recibos de sueldo, declaraciones fiscales»\", \"o\": [\"9. Análisis de registros públicos\", \"Autogestión financiera\", \"11. Consideración de colateral\", \"9. Verificación de la información\"], \"k\": 3, \"e\": \"Pág. 20. El material identifica «9. Verificación de la información» con esta descripción: Confirmación de que la información proporcionada por el solicitante en su aplicación es precisa y veraz, a menudo a través de documentos justificativos como recibos de sueldo, declaraciones fiscales\", \"p\": 20, \"term\": \"9. Verificación de la información\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El valor de la propiedad que se va a hipotecar se evalúa como parte del proceso de aprobación»\", \"o\": [\"9. Verificación de garantías y colaterales\", \"Planes de pago\", \"11. Consideración de colateral\", \"Precios basados en el riesgo\"], \"k\": 2, \"e\": \"Pág. 18. El material identifica «11. Consideración de colateral» con esta descripción: El valor de la propiedad que se va a hipotecar se evalúa como parte del proceso de aprobación\", \"p\": 18, \"term\": \"11. Consideración de colateral\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Análisis de estados financieros como balance general, estado de resultados y flujo de efectivo para determinar la salud financiera de la empresa»\", \"o\": [\"4. Evaluación del puntaje de crédito\", \"7. Extracción de información financiera\", \"6. Observación de las deudas actuales\", \"12. Condiciones del préstamo\"], \"k\": 1, \"e\": \"Pág. 15. El material identifica «7. Extracción de información financiera» con esta descripción: Análisis de estados financieros como balance general, estado de resultados y flujo de efectivo para determinar la salud financiera de la empresa\", \"p\": 15, \"term\": \"7. Extracción de información financiera\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La entidad financiera recibe una solicitud completa que incluye detalles de todas las deudas a consolidar, así como información personal y financiera del solicitante»\", \"o\": [\"11. Cálculo de la ratio deuda ingreso\", \"Decisión de crédito informada\", \"1. Solicitud completa\", \"2. Revisión del puntaje de crédito corporativo\"], \"k\": 2, \"e\": \"Pág. 21. El material identifica «1. Solicitud completa» con esta descripción: La entidad financiera recibe una solicitud completa que incluye detalles de todas las deudas a consolidar, así como información personal y financiera del solicitante\", \"p\": 21, \"term\": \"1. Solicitud completa\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «si el prestamista tiene ciertas reservas puede ofrecer el préstamo con una tasa de interés más alta o con la necesidad de un aval o garantía»\", \"o\": [\"Aprobación con condiciones\", \"Cumplimiento regulatorio\", \"12. Condiciones del préstamo\", \"12. Cumplimiento de normativas\"], \"k\": 0, \"e\": \"Pág. 14. El material identifica «Aprobación con condiciones» con esta descripción: si el prestamista tiene ciertas reservas puede ofrecer el préstamo con una tasa de interés más alta o con la necesidad de un aval o garantía\", \"p\": 14, \"term\": \"Aprobación con condiciones\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «la información del buró ayuda a los prestamistas a decidir si aprueban o rechazan una solicitud de crédito»\", \"o\": [\"3. Evaluación del puntaje de crédito\", \"Otorgamiento de créditos\", \"11. Consideración de colateral\", \"Manejo financiero\"], \"k\": 1, \"e\": \"Pág. 10. El material identifica «Otorgamiento de créditos» con esta descripción: la información del buró ayuda a los prestamistas a decidir si aprueban o rechazan una solicitud de crédito\", \"p\": 10, \"term\": \"Otorgamiento de créditos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «cuando un consumidor o empresa solicita un nuevo crédito, ya sea una tarjeta de crédito, un préstamo personal, una hipoteca o un préstamo para automóvil; el prestamista generalmente analizará el informe de crédito para evaluar el riesgo»\", \"o\": [\"8. Ratio deuda ingreso (DTI)\", \"Evaluación de riesgos\", \"5. Examen de la utilización del crédito\", \"Solicitud de crédito\"], \"k\": 3, \"e\": \"Pág. 9. El material identifica «Solicitud de crédito» con esta descripción: cuando un consumidor o empresa solicita un nuevo crédito, ya sea una tarjeta de crédito, un préstamo personal, una hipoteca o un préstamo para automóvil; el prestamista generalmente analizará el informe de crédito para evaluar el riesgo\", \"p\": 9, \"term\": \"Solicitud de crédito\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Se recopila información detallada sobre todas las deudas existentes, incluyendo saldos pendientes tasas de interés y plazos de vencimiento»\", \"o\": [\"3. Recolección de información de deudas\", \"Aprobación con condiciones\", \"Aprobación del préstamo\", \"3. Evaluación del puntaje de crédito\"], \"k\": 0, \"e\": \"Pág. 21. El material identifica «3. Recolección de información de deudas» con esta descripción: Se recopila información detallada sobre todas las deudas existentes, incluyendo saldos pendientes tasas de interés y plazos de vencimiento\", \"p\": 21, \"term\": \"3. Recolección de información de deudas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Cuando una persona solicita un préstamo, el prestamista solicita su informe de crédito a uno o más»\", \"o\": [\"5. Examen de la utilización del crédito\", \"1. Solicitud del Informe de crédito\", \"Precios basados en el riesgo\", \"3. Extracción del informe de crédito\"], \"k\": 1, \"e\": \"Pág. 12. El material identifica «1. Solicitud del Informe de crédito» con esta descripción: Cuando una persona solicita un préstamo, el prestamista solicita su informe de crédito a uno o más\", \"p\": 12, \"term\": \"1. Solicitud del Informe de crédito\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «A partir de la información recopilada se evalúa si el solicitante tiene la capacidad de pagar el»\", \"o\": [\"Como analizar un buró de crédito\", \"13. Monitoreo continuo\", \"11. Análisis de la capacidad de pago\", \"7. Consideración de la mezcla de créditos\"], \"k\": 2, \"e\": \"Pág. 7. El material identifica «11. Análisis de la capacidad de pago» con esta descripción: A partir de la información recopilada se evalúa si el solicitante tiene la capacidad de pagar el\", \"p\": 7, \"term\": \"11. Análisis de la capacidad de pago\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «los informes a menudo incluyen una puntuación de crédito que califica la solvencia»\", \"o\": [\"3. Recolección de información de deudas\", \"Escala de crédito\", \"Solicitud de crédito\", \"Otorgamiento de créditos\"], \"k\": 1, \"e\": \"Pág. 3. El material identifica «Escala de crédito» con esta descripción: los informes a menudo incluyen una puntuación de crédito que califica la solvencia\", \"p\": 3, \"term\": \"Escala de crédito\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Se buscan posibles eventos negativos en el historial crediticio como retrasos en los pagos cobranzas, embargos u otras señales de dificultades financieras pasadas»\", \"o\": [\"5. Examen de deuda existente\", \"8. Comprobación de registros adversos\", \"5. Antigüedad del crédito\", \"3. Análisis del historial de pagos\"], \"k\": 1, \"e\": \"Pág. 22. El material identifica «8. Comprobación de registros adversos» con esta descripción: Se buscan posibles eventos negativos en el historial crediticio como retrasos en los pagos cobranzas, embargos u otras señales de dificultades financieras pasadas\", \"p\": 22, \"term\": \"8. Comprobación de registros adversos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Esto involucra revisar cuidadosamente el historial crediticio de una persona o entidad para evaluar su solvencia y comportamiento financiero.»\", \"o\": [\"1. Recepción de la solicitud\", \"9. Análisis de registros públicos\", \"Como analizar un buró de crédito\", \"Recolección de datos\"], \"k\": 2, \"e\": \"Pág. 5. El material identifica «Como analizar un buró de crédito» con esta descripción: Esto involucra revisar cuidadosamente el historial crediticio de una persona o entidad para evaluar su solvencia y comportamiento financiero.\", \"p\": 5, \"term\": \"Como analizar un buró de crédito\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Observar cuántas consultas de crédito recientes ha tenido el solicitante.»\", \"o\": [\"7. Consultas de crédito\", \"11. Consideración de colateral\", \"1. Solicitud y autorización\", \"10. Análisis del entorno empresarial\"], \"k\": 0, \"e\": \"Pág. 6. El material identifica «7. Consultas de crédito» con esta descripción: Observar cuántas consultas de crédito recientes ha tenido el solicitante.\", \"p\": 6, \"term\": \"7. Consultas de crédito\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «con base en el historial de crédito, los prestamistas pueden tomar decisiones más informadas sobre a quién prestar dinero y bajo qué términos (monto del préstamo tasa de interés, plazo de pago, etc.)»\", \"o\": [\"Decisión de crédito informada\", \"1. Recepción de la solicitud\", \"Cumplimiento regulatorio\", \"7. Consideración del endeudamiento total\"], \"k\": 0, \"e\": \"Pág. 4. El material identifica «Decisión de crédito informada» con esta descripción: con base en el historial de crédito, los prestamistas pueden tomar decisiones más informadas sobre a quién prestar dinero y bajo qué términos (monto del préstamo tasa de interés, plazo de pago, etc.)\", \"p\": 4, \"term\": \"Decisión de crédito informada\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «los individuos pueden usar su reporte de crédito para tomar decisiones informadas sobre cómo manejar su crédito, por ejemplo, cuándo buscar un refinanciamiento o consolidación de deuda»\", \"o\": [\"Autogestión financiera\", \"Denegación del préstamo\", \"Revisiones de empleo\", \"6. Análisis del historial de pagos\"], \"k\": 0, \"e\": \"Pág. 12. El material identifica «Autogestión financiera» con esta descripción: los individuos pueden usar su reporte de crédito para tomar decisiones informadas sobre cómo ión del historial de pagos» con esta descripción: Se analiza el historial de pagos para verificar la consistencia y la puntualidad en las obligaciones\", \"p\": 19, \"term\": \"4. Evaluación del historial de pagos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Se observa el comportamiento de la empresa con relación a sus proveedores y acreedores comerciales, incluyendo términos de pago y cualquier registro de pagos atrasados»\", \"o\": [\"4. Evaluación de crédito comercial\", \"10. Revisiones de eventos adversos\", \"Características\", \"9. Análisis de factores de riesgo\"], \"k\": 0, \"e\": \"Pág. 15. El material identifica «4. Evaluación de crédito comercial» con esta descripción: Se observa el comportamiento de la empresa con relación a sus proveedores y acreedores comerciales, incluyendo términos de pago y cualquier registro de pagos atrasados\", \"p\": 15, \"term\": \"4. Evaluación de crédito comercial\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La entidad crediticia recibe una solicitud completa que incluye detalles financieros y personales del»\", \"o\": [\"Cumplimiento regulatorio\", \"Denegación del préstamo\", \"1. Recepción de la solicitud\", \"5. Evaluación del puntaje de crédito\"], \"k\": 2, \"e\": \"Pág. 19. El material identifica «1. Recepción de la solicitud» con esta descripción: La entidad crediticia recibe una solicitud completa que incluye detalles financieros y personales del\", \"p\": 19, \"term\": \"1. Recepción de la solicitud\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «aprender sobre cómo sus acciones financieras impactan su crédito puede alentar a los consumidores a tomar decisiones más responsables, mejorando así su salud financiera a largo plazo»\", \"o\": [\"Ofertas preaprobadas\", \"1. Solicitud y autorización\", \"Historial de pagos\", \"Educación financiera\"], \"k\": 3, \"e\": \"Pág. 5. El material identifica «Educación financ  provisional\"], \"k\": 1, \"e\": \"Pág. 4. El material identifica «Manejo financiero» con esta descripción: revisar el propio informe de crédito puede ayudar a los consumidores a comprender cómo su comportamiento financiero afecta su acceso al crédito\", \"p\": 4, \"term\": \"Manejo financiero\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Verificar que la información personal como nombre, dirección y número de seguro social sea correcta»\", \"o\": [\"13. Decisiones de crédito\", \"7. Comprobación de ratios financieros\", \"Plazo promedio de crédito\", \"2. Revisar la información personal\"], \"k\": 3, \"e\": \"Pág. 5. El material identifica «2. Revisar la información personal» con esta descripción: Verificar que la información personal como nombre, dirección y número de seguro social sea correcta\", \"p\": 5, \"term\": \"2. Revisar la información personal\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Se revisa cómo la empresa ha manejado sus deudas previas, incluyendo cualquier retraso o falta»\", \"o\": [\"3. Análisis del historial de pagos\", \"9. Análisis de registros públicos\", \"8. Comprobación de registros adversos\", \"7. Consideración del endeudamiento total\"], \"k\": 0, \"e\": \"Pág. 15. El material identifica «3. Análisis del historial de pagos» con esta descripción: Se revisa cómo la empresa ha manejado sus deudas previas, incluyendo cualquier retraso o falta\", \"p\": 15, \"term\": \"3. Análisis del historial de pagos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Se estudia el sector de industria, las condiciones del mercado y otros factores macroeconómicos que podrían afectar la capacidad de la empresa para cumplir con la deuda»\", \"o\": [\"Características\", \"10. Análisis del entorno empresarial\", \"Ofertas preaprobadas\", \"1. Solicitud completa\"], \"k\": 1, \"e\": \"Pág. 16. El material identifica «10. Análisis del entorno empresarial» con esta descripción: Se estudia el sector de industria, las condiciones del mercado y otros factores macroeconómicos que podrían afectar la capacidad de la empresa para cumplir con la deuda\", \"p\": 16, \"term\": \"10. Análisis del entorno empresarial\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Recolección de datos: recopilan información de muchas fuentes, fundamentalmente de instituciones financieras que otorgan créditos»\", \"o\": [\"3. Análisis del historial de pagos\", \"13. Decisiones de crédito\", \"Características\", \"Denegación del préstamo\"], \"k\": 2, \"e\": \"Pág. 2. El material identifica «Características» con esta descripción: Recolección de datos: recopilan información de muchas fuentes, fundamentalmente de instituciones financieras que otorgan créditos\", \"p\": 2, \"term\": \"Características\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «las cuentas en cobranza y las deudas escrituradas pueden tener un impacto significativamente negativo en el puntaje de crédito y señalan al prestamista un riesgo»\", \"o\": [\"Escala de crédito\", \"Solicitud de crédito\", \"Privacidad y regulación\", \"Cuotas y cuentas pendientes\"], \"k\": 3, \"e\": \"Pág. 8. El material identifica «Cuotas y cuentas pendientes» con esta descripción: las cuentas en cobranza y las deudas escrituradas pueden tener un impacto significativamente negativo en el puntaje de crédito y señalan al prestamista un riesgo\", \"p\": 8, \"term\": \"Cuotas y cuentas pendientes\"}];const letters=['A','B','C','D'];let idx=0,ans=Array(Q.length).fill(null),locked=Array(Q.length).fill(false);function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;')}function render(){let q=Q[idx];document.getElementById('count').textContent=`Pregunta ${idx+1} de ${Q.length}`;document.getElementById('answered').textContent=`${locked.filter(Boolean).length} comprobadas`;document.getElementById('bar').style.width=((idx+1)/Q.length*100)+'%';document.getElementById('stem').textContent=q.q;document.getElementById('options').innerHTML=q.o.map((v,j)=>`<button class=\"opt ${ans[idx]===j?'chosen':''} ${locked[idx]&&j===q.k?'correct':''} ${locked[idx]&&ans[idx]===j&&j!==q.k?'wrong':''}\" ${locked[idx]?'disabled':''} onclick=\"choose(${j})\"><b>${letters[j]}.<\/b> ${esc(v)}<\/button>`).join('');document.getElementById('prev').disabled=idx===0;document.getElementById('check').classList.toggle('hidden',locked[idx]);document.getElementById('check').disabled=ans[idx]===null;document.getElementById('next').classList.toggle('hidden',!locked[idx]);document.getElementById('next').textContent=idx===Q.length-1?'Ver calificación':'Siguiente →';let f=document.getElementById('feedback');f.classList.toggle('hidden',!locked[idx]);if(locked[idx])f.innerHTML=`<b class=\"${ans[idx]===q.k?'good':'bad'}\">${ans[idx]===q.k?'✓ Respuesta correcta':'✗ Respuesta incorrecta'}<\/b><p>${esc(q.e)}<\/p>`}function choose(j){if(locked[idx])return;ans[idx]=j;render()}function check(){if(ans[idx]===null)return;locked[idx]=true;render()}function prev(){if(idx>0){idx--;render()}}function next(){if(!locked[idx])return;if(idx===Q.length-1){finish();return}idx++;render()}function finish(){let correct=Q.filter((q,i)=>ans[i]===q.k).length;document.getElementById('quiz').classList.add('hidden');document.getElementById('results').classList.remove('hidden');document.getElementById('score').textContent=Math.round(100*correct/Q.length)+'%';document.getElementById('summary').textContent=`${correct} de ${Q.length} respuestas correctas`;document.getElementById('review').innerHTML=Q.map((q,i)=>`<div class=\"review\"><b>${i+1}. ${esc(q.q)}<\/b><div class=\"${ans[i]===q.k?'good':'bad'}\">Tu respuesta: ${letters[ans[i]]}. ${esc(q.o[ans[i]])}<\/div>${ans[i]===q.k?'':`<div class=\"good\">Correcta: ${letters[q.k]}. ${esc(q.o[q.k])}<\/div>`}<div>${esc(q.e)}<\/div><\/div>`).join('');window.scrollTo(0,0)}function restart(){idx=0;ans=Array(Q.length).fill(null);locked=Array(Q.length).fill(false);document.getElementById('results').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();window.scrollTo(0,0)}render();<\/script><\/body><\/html>", "title": "Utilización de los Burós de crédito", "count": 42, "week": "Semana 6", "area": "Área Bancaria Financiera"}, {"html": "<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Calificación crediticia<\/title><style>\n*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#183047;font:16px system-ui,Segoe UI,Arial}.shell{max-width:900px;margin:24px auto;padding:0 14px}.head{background:#10365b;color:white;border-radius:16px;padding:26px}.head small{letter-spacing:.08em;color:#b8d7f2}.head h1{margin:8px 0 6px;font-size:28px}.head p{margin:5px 0;color:#e3edf7}.box{background:white;border-radius:16px;padding:26px;margin:18px 0;box-shadow:0 3px 14px #193b5610}.meta{display:flex;justify-content:space-between;color:#63798c;font-size:14px}.progress{height:8px;background:#e3edf5;border-radius:99px;overflow:hidden;margin:16px 0 24px}.bar{height:100%;background:#1682bf}.stem{font-size:19px;line-height:1.6;font-weight:650;margin:20px 0}.opt{display:block;width:100%;border:1px solid #d1dde6;background:#fff;text-align:left;padding:14px 16px;margin:10px 0;border-radius:10px;cursor:pointer;font-size:15px;line-height:1.45}.opt:hover{background:#f3faff;border-color:#7aafd1}.opt.chosen{background:#e9f4fc;border:2px solid #1672ac}.opt.correct{background:#e7f6ee;border:2px solid #11834c}.opt.wrong{background:#ffeded;border:2px solid #c74646}.opt:disabled{cursor:default}.feedback{background:#edf5fc;padding:14px;border-radius:10px;margin-top:15px;line-height:1.55}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:20px}button.act{background:#176c9e;color:white;border:0;border-radius:9px;padding:12px 16px;font-weight:650;cursor:pointer}button.act.secondary{background:#e6eef5;color:#1c4263}button.act:disabled{opacity:.4;cursor:default}.hidden{display:none}.score{text-align:center;font-size:48px;color:#176c9e;font-weight:800}.review{border-bottom:1px solid #e4ebf2;padding:16px 0;line-height:1.55}.good{color:#0d7d49}.bad{color:#c63d3d}footer{color:#64748b;font-size:12px;text-align:center;padding:15px}@media(max-width:520px){.head h1{font-size:23px}.box{padding:18px}.stem{font-size:17px}}\n<\/style><\/head><body><div class=\"shell\"><header class=\"head\"><small>ECP 2026 · SIMULADOR DE ESTUDIO<\/small><h1>Semana 9<\/h1><p><b>Documento:<\/b> Calificación crediticia<\/p><p>Área Bancaria Financiera · Análisis y gestiones crediticias<\/p><p>Páginas 2–20 de la guía oficial · 38 preguntas<\/p><\/header><section class=\"box\" id=\"quiz\"><div class=\"meta\"><span id=\"count\"><\/span><span id=\"answered\"><\/span><\/div><div class=\"progress\"><div class=\"bar\" id=\"bar\"><\/div><\/div><div class=\"stem\" id=\"stem\"><\/div><div id=\"options\"><\/div><div id=\"feedback\" class=\"feedback hidden\"><\/div><div class=\"actions\"><button class=\"act secondary\" id=\"prev\" onclick=\"prev()\">← Anterior<\/button><button class=\"act\" id=\"check\" onclick=\"check()\">Comprobar respuesta<\/button><button class=\"act hidden\" id=\"next\" onclick=\"next()\">Siguiente →<\/button><\/div><\/section><section class=\"box hidden\" id=\"results\"><h2>Resultado del simulador<\/h2><div class=\"score\" id=\"score\"><\/div><p id=\"summary\" style=\"text-align:center\"><\/p><div class=\"actions\"><button class=\"act secondary\" onclick=\"restart()\">Repetir<\/button><button class=\"act\" onclick=\"window.print()\">Imprimir revisión<\/button><\/div><h2>Respuestas explicadas<\/h2><div id=\"review\"><\/div><\/section><footer>Preguntas basadas únicamente en el documento del curso y páginas indicadas. Funciona sin conexión.<\/footer><\/div><script>\nconst Q=[{\"q\": \"Según el documento, ¿a qué concepto Evaluación de la resiliencia\"}];const letters=['A','B','C','D'];let idx=0,ans=Array(Q.length).fill(null),locked=Array(Q.length).fill(false);function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;')}function render(){let q=Q[idx];document.getElementById('count').textContent=`Pregunta ${idx+1} de ${Q.length}`;document.getElementById('answered').textContent=`${locked.filter(Boolean).length} comprobadas`;document.getElementById('bar').style.width=((idx+1)/Q.length*100)+'%';document.getElementById('stem').textContent=q.q;document.getElementById('options').innerHTML=q.o.map((v,j)=>`<button class=\"opt ${ans[idx]===j?'chosen':''} ${locked[idx]&&j===q.k?'correct':''} ${locked[idx]&&ans[idx]===j&&j!==q.k?'wrong':''}\" ${locked[idx]?'disabled':''} onclick=\"choose(${j})\"><b>${letters[j]}.<\/b> ${esc(v)}<\/button>`).join('');document.getElementById('prev').disabled=idx===0;document.getElementById('check').classList.toggle('hidden',locked[idx]);document.getElementById('check').disabled=ans[idx]===null;document.getElementById('next').classList.toggle('hidden',!locked[idx]);document.getElementById('next').textContent=idx===Q.length-1?'Ver calificación':'Siguiente →';let f=document.getElementById('feedback');f.classList.toggle('hidden',!locked[idx]);if(locked[idx])f.innerHTML=`<b class=\"${ans[idx]===q.k?'good':'bad'}\">${ans[idx]===q.k?'✓ Respuesta correcta':'✗ Respuesta incorrecta'}<\/b><p>${esc(q.e)}<\/p>`}function choose(j){if(locked[idx])return;ans[idx]=j;render()}function check(){if(ans[idx]===null)return;locked[idx]=true;render()}function prev(){if(idx>0){idx--;render()}}function next(){if(!locked[idx])return;if(idx===Q.length-1){finish();return}idx++;render()}function finish(){let correct=Q.filter((q,i)=>ans[i]===q.k).length;document.getElementById('quiz').classList.add('hidden');document.getElementById('results').classList.remove('hidden');document.getElementById('score').textContent=Math.round(100*correct/Q.length)+'%';document.getElementById('summary').textContent=`${correct} de ${Q.length} respuestas correctas`;document.getElementById('review').innerHTML=Q.map((q,i)=>`<div class=\"review\"><b>${i+1}. ${esc(q.q)}<\/b><div class=\"${ans[i]===q.k?'good':'bad'}\">Tu respuesta: ${letters[ans[i]]}. ${esc(q.o[ans[i]])}<\/div>${ans[i]===q.k?'':`<div class=\"good\">Correcta: ${letters[q.k]}. ${esc(q.o[q.k])}<\/div>`}<div>${esc(q.e)}<\/div><\/div>`).join('');window.scrollTo(0,0)}function restart(){idx=0;ans=Array(Q.length).fill(null);locked=Array(Q.length).fill(false);document.getElementById('results').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();window.scrollTo(0,0)}render();<\/script><\/body><\/html>", "title": "Calificación crediticia", "count": 38, "week": "Semana 9", "area": "Área Bancaria Financiera"}, {"html": "<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Score de crédito y puntaje crediticio<\/title><style>\n*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#183047;font:16px system-ui,Segoe UI,Arial}.shell{max-width:900px;margin:24px auto;padding:0 14px}.head{background:#10365b;color:white;border-radius:16px;padding:26px}.head small{letter-spacing:.08em;color:#b8d7f2}.head h1{margin:8px 0 6px;font-size:28px}.head p{margin:5px 0;color:#e3edf7}.box{background:white;border-radius:16px;padding:26px;margin:18px 0;box-shadow:0 3px 14px #193b5610}.meta{display:flex;justify-content:space-between;color:#63798c;font-size:14px}.progress{height:8px;background:#e3edf5;border-radius:99px;overflow:hidden;margin:16px 0 24px}.bar{height:100%;background:#1682bf}.stem{font-size:19px;line-height:1.6;font-weight:650;margin:20px 0}.opt{display:block;width:100%;border:1px solid #d1dde6;background:#fff;text-align:left;padding:14px 16px;margin:10px 0;border-radius:10px;cursor:pointer;font-size:15px;line-height:1.45}.opt:hover{backg
