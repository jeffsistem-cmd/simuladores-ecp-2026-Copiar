 \"term\": \"Análisis de Informes Financieros\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Indica la capacidad de la institución para mantener a sus clientes actuales a lo largo del tiempo»\", \"o\": [\"Encuestas y Entrevistas\", \"Identificación de Brechas\", \"Análisis de Informes Financieros\", \"Tasa de Retención de Clientes\"], \"k\": 3, \"e\": \"Pág. 13. El material identifica «Tasa de Retención de Clientes» con esta descripción: Indica la capacidad de la institución para mantener a sus clientes actuales a lo largo del tiempo\", \"p\": 13, \"term\": \"Tasa de Retención de Clientes\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Este tipo de benchmarking se centra en la comparación de procesos básicos comunes a la mayoría de las industrias, como la gestión de recursos humanos o la cadena de suministro.»\", \"o\": [\"Benchmarking Genérico\", \"Benchmarking Interno\", \"Adopción de Mejores Prácticas\", \"Ventajas\"], \"k\": 0, \"e\": \"Pág. 12. El material identifica «Benchmarking Genérico» con esta descripción: Este tipo de benchmarking se centra en la comparación de procesos básicos comunes a la mayoría de las industrias, como la gestión de recursos humanos o la cadena de suministro.\", \"p\": 12, \"term\": \"Benchmarking Genérico\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Una vez recopilados los datos, el siguiente paso es realizar un análisis comparativo para evaluar las diferencias y similitudes entre la institución y sus competidores.»\", \"o\": [\"Benchmarking Competitivo\", \"Análisis de las Fuerzas Competitivas de Porter\", \"Métodos de Identificación de Competidores\", \"Análisis Comparativo\"], \"k\": 3, \"e\": \"Pág. 14. El material identifica «Análisis Comparativo» con esta descripción: Una vez recopilados los datos, el siguiente paso es realizar un análisis comparativo para evaluar las diferencias y similitudes entre la institución y sus competidores.\", \"p\": 14, \"term\": \"Análisis Comparativo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Consiste en comparar procesos y prácticas dentro de la misma institución, entre diferentes departamentos o sucursales.»\", \"o\": [\"Benchmarking Interno\", \"Ventajas\", \"Identificación de Brechas\", \"Revisión de Publicaciones y Reportes del Sector\"], \"k\": 0, \"e\": \"Pág. 12. El material identifica «Benchmarking Interno» con esta descripción: Consiste en comparar procesos y prácticas dentro de la misma institución, entre diferentes departamentos o sucursales.\", \"p\": 12, \"term\": \"Benchmarking Interno\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El benchmarking es una herramienta estratégica que permite a las instituciones financieras comparar sus procesos, productos, y servicios con los líderes del sector o con otras organizaciones que se»\", \"o\": [\"Concepto y Objetivos del Benchmarking\", \"Evaluación de Desempeño Relativo\", \"Estudios de Mercado\", \"Tasa de Retención de Clientes\"], \"k\": 0, \"e\": \"Pág. 11. El material identifica «Concepto y Objetivos del Benchmarking» con esta descripción: El benchmarking es una herramienta estratégica que permite a las instituciones financieras comparar sus procesos, productos, y servicios con los líderes del sector o con otras organizaciones que se\", \"p\": 11, \"term\": \"Concepto y Objetivos del Benchmarking\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La identificación precisa de competidores requiere una combinación de técnicas analíticas y de investigación para asegurarse de que se están considerando todos los posibles actores que puedan»\", \"o\": [\"Evaluación de Desempeño Relativo\", \"Benchmarking Genérico\", \"Análisis de las Fuerzas Competitivas de Porter\", \"Métodos de Identificación de Competidores\"], \"k\": 3, \"e\": \"Pág. 7. El material identifica «Métodos de Identificación de Competidores» con esta descripción: La identificación precisa de competidores requiere una combinación de técnicas analíticas y de investigación para asegurarse de que se están considerando todos los posibles actores que puedan\", \"p\": 7, \"term\": \"Métodos de Identificación de Competidores\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Comparar los KPI seleccionados con los de los competidores para determinar la posición de la institución en el mercado»\", \"o\": [\"Índice de Eficiencia\", \"Análisis de las Fuerzas Competitivas de Porter\", \"Evaluación de Desempeño Relativo\", \"Adopción de Mejores Prácticas\"], \"k\": 2, \"e\": \"Pág. 14. El material identifica «Evaluación de Desempeño Relativo» con esta descripción: Comparar los KPI seleccionados con los de los competidores para determinar la posición de la institución en el mercado\", \"p\": 14, \"term\": \"Evaluación de Desempeño Relativo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Se enfoca en comparar procesos o funciones específicas con instituciones de otros sectores que son líderes en esa área particular.»\", \"o\": [\"Benchmarking Funcional\", \"Índice de Eficiencia\", \"Evaluación de Desempeño Relativo\", \"Métodos de Identificación de Competidores\"], \"k\": 0, \"e\": \"Pág. 12. El material identifica «Benchmarking Funcional» con esta descripción: Se enfoca en comparar procesos o funciones específicas con instituciones de otros sectores que son líderes en esa área particular.\", \"p\": 12, \"term\": \"Benchmarking Funcional\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Finalmente, el benchmarking no solo se trata de identificar diferencias, sino de aprender de los líderes del sector»\", \"o\": [\"Adopción de Mejores Prácticas\", \"Benchmarking Funcional\", \"Revisión de Publicaciones y Reportes del Sector\", \"Encuestas y Entrevistas\"], \"k\": 0, \"e\": \"Pág. 14. El material identifica «Adopción de Mejores Prácticas» con esta descripción: Finalmente, el benchmarking no solo se trata de identificar diferencias, sino de aprender de los líderes del sector\", \"p\": 14, \"term\": \"Adopción de Mejores Prácticas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Capacidad de establecer precios premium debido al valor añadido percibido Mayor lealtad del cliente y menor sensibilidad al precio»\", \"o\": [\"Benchmarking Funcional\", \"Ventajas\", \"Métodos de Identificación de Competidores\", \"Análisis de las Fuerzas Competitivas de Porter\"], \"k\": 1, \"e\": \"Pág. 4. El material identifica «Ventajas» con esta descripción: Capacidad de establecer precios premium debido al valor añadido percibido Mayor lealtad del cliente y menor sensibilidad al precio\", \"p\": 4, \"term\": \"Ventajas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Las encuestas a clientes y entrevistas con expertos del sector pueden ofrecer insights sobre cómo los competidores son percibidos en el mercado y cuáles son sus fortalezas y debilidades desde la perspectiva del cliente»\", \"o\": [\"Encuestas y Entrevistas\", \"Análisis Comparativo\", \"Benchmarking Competitivo\", \"Benchmarking Funcional\"], \"k\": 0, \"e\": \"Pág. 13. El material identifica «Encuestas y Entrevistas» con esta descripción: Las encuestas a clientes y entrevistas con expertos del sector pueden ofrecer insights sobre cómo los competidores son percibidos en el mercado y cuáles son sus fortalezas y debilidades desde la perspectiva del cliente\", \"p\": 13, \"term\": \"Encuestas y Entrevistas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Otra forma efectiva de identificar competidores es a través de la revisión de publicaciones y reportes del sector financiero.»\", \"o\": [\"Ventajas\", \"Benchmarking Genérico\", \"Concepto y Objetivos del Benchmarking\", \"Revisión de Publicaciones y Reportes del Sector\"], \"k\": 3, \"e\": \"Pág. 8. El material identifica «Revisión de Publicaciones y Reportes del Sector» con esta descripción: Otra forma efectiva de identificar competidores es a través de la revisión de publicaciones y reportes del sector financiero.\", \"p\": 8, \"term\": \"Revisión de Publicaciones y Reportes del Sector\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El modelo de las Fuerzas Competitivas de Michael Porter es una herramienta estratégica que permite a las instituciones financieras analizar los diferentes factores que influyen en su competitividad en el»\", \"o\": [\"Análisis de las Fuerzas Competitivas de Porter\", \"Benchmarking Interno\", \"Índice de Eficiencia\", \"Ventajas\"], \"k\": 0, \"e\": \"Pág. 9. El material identifica «Análisis de las Fuerzas Competitivas de Porter» con esta descripción: El modelo de las Fuerzas Competitivas de Michael Porter es una herramienta estratégica que permite a las instituciones financieras analizar los diferentes factores que influyen en su competitividad en el\", \"p\": 9, \"term\": \"Análisis de las Fuerzas Competitivas de Porter\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La reducción de precios puede llevar a márgenes de beneficio más bajos Riesgo de entrar en una \\\"guerra de precios\\\" que puede ser insostenible a largo plazo»\", \"o\": [\"Tasa de Retención de Clientes\", \"Análisis de Informes Financieros\", \"Análisis Comparativo\", \"Desafíos\"], \"k\": 3, \"e\": \"Pág. 3. El material identifica «Desafíos» con esta descripción: La reducción de precios puede llevar a márgenes de beneficio más bajos Riesgo de entrar en una \\\"guerra de precios\\\" que puede ser insostenible a largo plazo\", \"p\": 3, \"term\": \"Desafíos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El análisis comparativo también permite identificar brechas de desempeño que representan oportunidades para la mejora»\", \"o\": [\"Análisis de las Fuerzas Competitivas de Porter\", \"Evaluación de Desempeño Relativo\", \"Identificación de Brechas\", \"Benchmarking Interno\"], \"k\": 2, \"e\": \"Pág. 14. El material identifica «Identificación de Brechas» con esta descripción: El análisis comparativo también permite identificar brechas de desempeño que representan oportunidades para la mejora\", \"p\": 14, \"term\": \"Identificación de Brechas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La investigación de mercado puede proporcionar información sobre las tendencias del sector, el comportamiento del cliente, y las estrategias competitivas que están siendo implementadas por otras instituciones financieras»\", \"o\": [\"Benchmarking Funcional\", \"Identificación de Brechas\", \"Encuestas y Entrevistas\", \"Estudios de Mercado\"], \"k\": 3, \"e\": \"Pág. 14. El material identifica «Estudios de Mercado» con esta descripción: La investigación de mercado puede proporcionar información sobre las tendencias del sector, el comportamiento del cliente, y las estrategias competitivas que están siendo implementadas por otras instituciones financieras\", \"p\": 14, \"term\": \"Estudios de Mercado\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Implica comparar los productos, servicios, y procesos de la institución con los de sus competidores directos.»\", \"o\": [\"Concepto y Objetivos del Benchmarking\", \"Métodos de Identificación de Competidores\", \"Benchmarking Competitivo\", \"Análisis de las Fuerzas Competitivas de Porter\"], \"k\": 2, \"e\": \"Pág. 12. El material identifica «Benchmarking Competitivo» con esta descripción: Implica comparar los productos, servicios, y procesos de la institución con los de sus competidores directos.\", \"p\": 12, \"term\": \"Benchmarking Competitivo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Mide la relación entre los costos operativos y los ingresos generados ayudando a evaluar la eficiencia operativa»\", \"o\": [\"Índice de Eficiencia\", \"Ventajas\", \"Benchmarking Funcional\", \"Revisión de Publicaciones y Reportes del Sector\"], \"k\": 0, \"e\": \"Pág. 13. El material identifica «Índice de Eficiencia» con esta descripción: Mide la relación entre los costos operativos y los ingresos generados ayudando a evaluar la eficiencia operativa\", \"p\": 13, \"term\": \"Índice de Eficiencia\"}];const letters=['A','B','C','D'];let idx=0,ans=Array(Q.length).fill(null),locked=Array(Q.length).fill(false);function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;')}function render(){let q=Q[idx];document.getElementById('count').textContent=`Pregunta ${idx+1} de ${Q.length}`;document.getElementById('answered').textContent=`${locked.filter(Boolean).length} comprobadas`;document.getElementById('bar').style.width=((idx+1)/Q.length*100)+'%';document.getElementById('stem').textContent=q.q;document.getElementById('options').innerHTML=q.o.map((v,j)=>`<button class=\"opt ${ans[idx]===j?'chosen':''} ${locked[idx]&&j===q.k?'correct':''} ${locked[idx]&&ans[idx]===j&&j!==q.k?'wrong':''}\" ${locked[idx]?'disabled':''} onclick=\"choose(${j})\"><b>${letters[j]}.<\/b> ${esc(v)}<\/button>`).join('');document.getElementById('prev').disabled=idx===0;document.getElementById('check').classList.toggle('hidden',locked[idx]);document.getElementById('check').disabled=ans[idx]===null;document.getElementById('next').classList.toggle('hidden',!locked[idx]);document.getElementById('next').textContent=idx===Q.length-1?'Ver calificación':'Siguiente →';let f=document.getElementById('feedback');f.classList.toggle('hidden',!locked[idx]);if(locked[idx])f.innerHTML=`<b class=\"${ans[idx]===q.k?'good':'bad'}\">${ans[idx]===q.k?'✓ Respuesta correcta':'✗ Respuesta incorrecta'}<\/b><p>${esc(q.e)}<\/p>`}function choose(j){if(locked[idx])return;ans[idx]=j;render()}function check(){if(ans[idx]===null)return;locked[idx]=true;render()}function prev(){if(idx>0){idx--;render()}}function next(){if(!locked[idx])return;if(idx===Q.length-1){finish();return}idx++;render()}function finish(){let correct=Q.filter((q,i)=>ans[i]===q.k).length;document.getElementById('quiz').classList.add('hidden');document.getElementById('results').classList.remove('hidden');document.getElementById('score').textContent=Math.round(100*correct/Q.length)+'%';document.getElementById('summary').textContent=`${correct} de ${Q.length} respuestas correctas`;document.getElementById('review').innerHTML=Q.map((q,i)=>`<div class=\"review\"><b>${i+1}. ${esc(q.q)}<\/b><div class=\"${ans[i]===q.k?'good':'bad'}\">Tu respuesta: ${letters[ans[i]]}. ${esc(q.o[ans[i]])}<\/div>${ans[i]===q.k?'':`<div class=\"good\">Correcta: ${letters[q.k]}. ${esc(q.o[q.k])}<\/div>`}<div>${esc(q.e)}<\/div><\/div>`).join('');window.scrollTo(0,0)}function restart(){idx=0;ans=Array(Q.length).fill(null);locked=Array(Q.length).fill(false);document.getElementById('results').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();window.scrollTo(0,0)}render();<\/script><\/body><\/html>", "title": "Análisis Competitivo en el Sector Financiero", "count": 19, "week": "Semana 9", "area": "Área Comercial"}, {"html": "<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Inteligencia Artificial y Análisis Predictivo en Mercados Financieros<\/title><style>\n*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#183047;font:16px system-ui,Segoe UI,Arial}.shell{max-width:900px;margin:24px auto;padding:0 14px}.head{background:#10365b;color:white;border-radius:16px;padding:26px}.head small{letter-spacing:.08em;color:#b8d7f2}.head h1{margin:8px 0 6px;font-size:28px}.head p{margin:5px 0;color:#e3edf7}.box{background:white;border-radius:16px;padding:26px;margin:18px 0;box-shadow:0 3px 14px #193b5610}.meta{display:flex;justify-content:space-between;color:#63798c; ','C','D'];let idx=0,ans=Array(Q.length).fill(null),locked=Array(Q.length).fill(false);function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;')}function render(){let q=Q[idx];document.getElementById('count').textContent=`Pregunta ${idx+1} de ${Q.length}`;document.getElementById('answered').textContent=`${locked.filter(Boolean).length} comprobadas`;document.getElementById('bar').style.width=((idx+1)/Q.length*100)+'%';document.getElementById('stem').textContent=q.q;document.getElementById('options').innerHTML=q.o.map((v,j)=>`<button class=\"opt ${ans[idx]===j?'chosen':''} ${locked[idx]&&j===q.k?'correct':''} ${locked[idx]&&ans[idx]===j&&j!==q.k?'wrong':''}\" ${locked[idx]?'disabled':''} onclick=\"choose(${j})\"><b>${letters[j]}.<\/b> ${esc(v)}<\/button>`).join('');document.getElementById('prev').disabled=idx===0;document.getElementById('check').classList.toggle('hidden',locked[idx]);document.getElementById('check').disabled=ans[idx]===null;document.getElementById('next').classList.toggle('hidden',!locked[idx]);document.getElementById('next').textContent=idx===Q.length-1?'Ver calificación':'Siguiente →';let f=document.getElementById('feedback');f.classList.toggle('hidden',!locked[idx]);if(locked[idx])f.innerHTML=`<b class=\"${ans[idx]===q.k?'good':'bad'}\">${ans[idx]===q.k?'✓ Respuesta correcta':'✗ Respuesta incorrecta'}<\/b><p>${esc(q.e)}<\/p>`}function choose(j){if(locked[idx])return;ans[idx]=j;render()}function check(){if(ans[idx]===null)return;locked[idx]=true;render()}function prev(){if(idx>0){idx--;render()}}function next(){if(!locked[idx])return;if(idx===Q.length-1){finish();return}idx++;render()}function finish(){let correct=Q.filter((q,i)=>ans[i]===q.k).length;document.getElementById('quiz').classList.add('hidden');document.getElementById('results').classList.remove('hidden');document.getElementById('score').textContent=Math.round(100*correct/Q.length)+'%';document.getElementById('summary').textContent=`${correct} de ${Q.length} respuestas correctas`;document.getElementById('review').innerHTML=Q.map((q,i)=>`<div class=\"review\"><b>${i+1}. ${esc(q.q)}<\/b><div class=\"${ans[i]===q.k?'good':'bad'}\">Tu respuesta: ${letters[ans[i]]}. ${esc(q.o[ans[i]])}<\/div>${ans[i]===q.k?'':`<div class=\"good\">Correcta: ${letters[q.k]}. ${esc(q.o[q.k])}<\/div>`}<div>${esc(q.e)}<\/div><\/div>`).join('');window.scrollTo(0,0)}function restart(){idx=0;ans=Array(Q.length).fill(null);locked=Array(Q.length).fill(false);document.getElementById('results').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();window.scrollTo(0,0)}render();<\/script><\/body><\/html>", "title": "Inteligencia Artificial y Análisis Predictivo en Mercados Financieros", "count": 18, "week": "Semana 16", "area": "Área Comercial"}];
