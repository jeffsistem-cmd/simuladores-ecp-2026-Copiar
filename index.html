ejar diferentes tipos de deuda (por ejemplo, préstamos hipotecarios, tarjetas de crédito, préstamos estudiantiles, etc.)»\", \"o\": [\"Tipos de crédito\", \"Modelo de puntuación FICO\", \"Excelente: 800 - 850\", \"Estimación de parámetros\"], \"k\": 0, \"e\": \"Pág. 15. El material identifica «Tipos de crédito» con esta descripción: la variedad de tipos de cuentas crediticias que tiene un individuo puede ser un indicador de su capacidad para manejar diferentes tipos de deuda (por ejemplo, préstamos hipotecarios, tarjetas de crédito, préstamos estudiantiles, etc.)\", \"p\": 15, \"term\": \"Tipos de crédito\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Estos modelos buscan identificar relaciones de causa y efecto entre variables económicas, lo que permite explicar y predecir el comportamiento económico»\", \"o\": [\"4. Bueno (740 - 799)\", \"Precisión\", \"Experian Score\", \"Relaciones causales\"], \"k\": 3, \"e\": \"Pág. 13. El material identifica «Relaciones causales» con esta descripción: Estos modelos buscan identificar relaciones de causa y efecto entre variables económicas, lo que permite explicar y predecir el comportamiento económico\", \"p\": 13, \"term\": \"Relaciones causales\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Un sistema de calificación crediticia desarrollado por las tres principales agencias de informes de crédito»\", \"o\": [\"Modelos basados en puntajes personalizados\", \"1. Muy Deficiente (300 - 579)\", \"Evaluación de riesgos\", \"Modelo vantageScore\"], \"k\": 3, \"e\": \"Pág. 11. El material identifica «Modelo vantageScore» con esta descripción: Un sistema de calificación crediticia desarrollado por las tres principales agencias de informes de crédito\", \"p\": 11, \"term\": \"Modelo vantageScore\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La aplicación de modelos de credit scoring es fundamental en el sector financiero por varias razones»\", \"o\": [\"Eficiencia y rapidez\", \"Indicadores claves de los modelos econométricos\", \"La importancia de aplicar modelos credit scoring\", \"Evaluación del riesgo crediticio\"], \"k\": 2, \"e\": \"Pág. 17. El material identifica «La importancia de aplicar modelos credit scoring» con esta descripción: La aplicación de modelos de credit scoring es fundamental en el sector financiero por varias razones\", \"p\": 17, \"term\": \"La importancia de aplicar modelos credit scoring\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «FICO Score: es uno de los puntajes crediticios más utilizados en Estados Unidos, con una escala de puntuación que va de 300 a 850»\", \"o\": [\"La importancia de aplicar modelos credit scoring\", \"Ejemplos\", \"Estimación de parámetros\", \"Eficiencia\"], \"k\": 1, \"e\": \"Pág. 2. El material identifica «Ejemplos» con esta descripción: FICO Score: es uno de los puntajes crediticios más utilizados en Estados Unidos, con una escala de puntuación que va de 300 a 850\", \"p\": 2, \"term\": \"Ejemplos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Estos son solo ejemplos de rangos de puntuación y pueden variar según el sistema de calificación»\", \"o\": [\"Validación y verificación\", \"Tasas de interés\", \"Relaciones causales\", \"Excelente: 800 - 850\"], \"k\": 3, \"e\": \"Pág. 8. El material identifica «Excelente: 800 - 850» con esta descripción: Estos son solo ejemplos de rangos de puntuación y pueden variar según el sistema de calificación\", \"p\": 8, \"term\": \"Excelente: 800 - 850\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «los modelos de credit scoring pueden ser ajustados y refinados para adaptarse a diferentes perfiles de riesgo y necesidades de negocio»\", \"o\": [\"La importancia del score crediticio\", \"Modelo de puntuación FICO\", \"Adaptabilidad\", \"Uso del crédito disponible\"], \"k\": 2, \"e\": \"Pág. 16. El material identifica «Adaptabilidad» con esta descripción: los modelos de credit scoring pueden ser ajustados y refinados para adaptarse a diferentes perfiles de riesgo y necesidades de negocio\", \"p\": 16, \"term\": \"Adaptabilidad\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Historial crediticio excelente con pagos puntuales en todas las cuentas Bajo nivel de endeudamiento en relación con el límite de crédito disponible»\", \"o\": [\"Escalabilidad\", \"Toma de decisiones basada en datos\", \"4. Bueno (740 - 799)\", \"Características\"], \"k\": 2, \"e\": \"Pág. 9. El material identifica «4. Bueno (740 - 799)» con esta descripción: Historial crediticio excelente con pagos puntuales en todas las cuentas Bajo nivel de endeudamiento en relación con el límite de crédito disponible\", \"p\": 9, \"term\": \"4. Bueno (740 - 799)\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Pagos atrasados frecuentes o falta de cumplimiento de obligaciones financieras Altos niveles de deuda en relación con el límite de crédito disponible»\", \"o\": [\"Escalabilidad\", \"Toma de decisiones basada en datos\", \"Ejemplos\", \"1. Muy Deficiente (300 - 579)\"], \"k\": 3, \"e\": \"Pág. 8. El material identifica «1. Muy Deficiente (300 - 579)» con esta descripción: Pagos atrasados frecuentes o falta de cumplimiento de obligaciones financieras Altos niveles de deuda en relación con el límite de crédito disponible\", \"p\": 8, \"term\": \"1. Muy Deficiente (300 - 579)\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «En los modelos de análisis crediticio, el nivel de probabilidad se refiere a la estimación de la probabilidad de que un prestatario incumpla con sus obligaciones crediticias, como por ejemplo no»\", \"o\": [\"4. Bueno (740 - 799)\", \"Evaluación de riesgos\", \"Nivel de probabilidad del modelo de análisis\", \"Vantagescore\"], \"k\": 2, \"e\": \"Pág. 19. El material identifica «Nivel de probabilidad del modelo de análisis» con esta descripción: En los modelos de análisis crediticio, el nivel de probabilidad se refiere a la estimación de la probabilidad de que un prestatario incumpla con sus obligaciones crediticias, como por ejemplo no\", \"p\": 19, \"term\": \"Nivel de probabilidad del modelo de análisis\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «los modelos de credit scoring son escalables y pueden aplicarse a grandes volúmenes de solicitudes de crédito de manera consistente y eficiente»\", \"o\": [\"Relaciones causales\", \"Escalabilidad\", \"Toma de decisiones basada en datos\", \"Precisión\"], \"k\": 1, \"e\": \"Pág. 16. El material identifica «Escalabilidad» con esta descripción: los modelos de credit scoring son escalables y pueden aplicarse a grandes volúmenes de solicitudes de crédito de manera consistente y eficiente\", \"p\": 16, \"term\": \"Escalabilidad\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «a través del análisis de datos históricos y cálculos estadísticos, estos modelos buscan proporcionar una evaluación precisa del riesgo crediticio de un individuo o empresa»\", \"o\": [\"Precisión\", \"Excelente: 800 - 850\", \"La importancia del score crediticio\", \"Validación y verificación\"], \"k\": 0, \"e\": \"Pág. 16. El material identifica «Precisión» con esta descripción: a través del análisis de datos históricos y cálculos estadísticos, estos modelos buscan proporcionar una evaluación precisa del riesgo crediticio de un individuo o empresa\", \"p\": 16, \"term\": \"Precisión\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «En los modelos de credit scoring, se utilizan una variedad de indicadores clave para evaluar el riesgo crediticio de un individuo o empresa.»\", \"o\": [\"Historial crediticio con pagos atrasados ocasionales\", \"Indicadores claves de los modelos credit scoring\", \"Excelente: 800 - 850\", \"Modelo de puntuación FICO\"], \"k\": 1, \"e\": \"Pág. 18. El material identifica «Indicadores claves de los modelos credit scoring» con esta descripción: En los modelos de credit scoring, se utilizan una variedad de indicadores clave para evaluar el riesgo crediticio de un individuo o empresa.\", \"p\": 18, \"term\": \"Indicadores claves de los modelos credit scoring\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «los modelos econométricos se basan en datos reales recopilados de la economía, las finanzas o cualquier otro campo de estudio económico»\", \"o\": [\"Estimación de parámetros\", \"Excelente: 800 - 850\", \"Indicadores claves de los modelos credit scoring\", \"Utilizan datos empíricos\"], \"k\": 3, \"e\": \"Pág. 13. El material identifica «Utilizan datos empíricos» con esta descripción: los modelos econométricos se basan en datos reales recopilados de la economía, las finanzas o cualquier otro campo de estudio económico\", \"p\": 13, \"term\": \"Utilizan datos empíricos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «el score de crédito y puntaje crediticio influyen en la tasa de interés que se ofrece a un prestatario»\", \"o\": [\"Precisión\", \"FICO Score\", \"La importancia del score crediticio\", \"Tasas de interés\"], \"k\": 3, \"e\": \"Pág. 4. El material identifica «Tasas de interés» con esta descripción: el score de crédito y puntaje crediticio influyen en la tasa de interés que se ofrece a un prestatario\", \"p\": 4, \"term\": \"Tasas de interés\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «al utilizar modelos de calificación crediticia, las instituciones financieras pueden basar sus decisiones en datos concretos y análisis estadísticos, en lugar de depender únicamente de evaluaciones subjetivas»\", \"o\": [\"Relaciones causales\", \"Estimación de parámetros\", \"Toma de decisiones basada en datos\", \"Ejemplos\"], \"k\": 2, \"e\": \"Pág. 11. El material identifica «Toma de decisiones basada en datos» con esta descripción: al utilizar modelos de calificación crediticia, las instituciones financieras pueden basar sus decisiones en datos concretos y análisis estadísticos, en lugar de depender únicamente de evaluaciones subjetivas\", \"p\": 11, \"term\": \"Toma de decisiones basada en datos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Son herramientas utilizadas por las instituciones financieras para evaluar el riesgo crediticio Se basan en información histórica de las actividades crediticias de un individuo»\", \"o\": [\"Ejemplos\", \"Eficiencia\", \"Características\", \"1. Muy Deficiente (300 - 579)\"], \"k\": 2, \"e\": \"Pág. 2. El material identifica «Características» con esta descripción: Son herramientas utilizadas por las instituciones financieras para evaluar el riesgo crediticio Se basan en información histórica de las actividades crediticias de un individuo\", \"p\": 2, \"term\": \"Características\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Desarrollado por Fair Isaac Corporation, es uno de los modelos de calificación crediticia más utilizados en Estados Unidos»\", \"o\": [\"Objetividad\", \"Reducción de sesgos\", \"Estimación de parámetros\", \"Modelo de puntuación FICO\"], \"k\": 3, \"e\": \"Pág. 10. El material identifica «Modelo de puntuación FICO» con esta descripción: Desarrollado por Fair Isaac Corporation, es uno de los modelos de calificación crediticia más utilizados en Estados Unidos\", \"p\": 10, \"term\": \"Modelo de puntuación FICO\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «los modelos de credit scoring ayudan a reducir los sesgos subjetivos en la toma de decisiones crediticias»\", \"o\": [\"Utilización del crédito\", \"Reducción de sesgos\", \"FICO Score\", \"Nivel de probabilidad del modelo de análisis\"], \"k\": 1, \"e\": \"Pág. 18. El material identifica «Reducción de sesgos» con esta descripción: lo a escala de puntuación que va de 300 a 850\", \"p\": 2, \"term\": \"FICO Score\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Niveles moderados de deuda en comparación con el límite de crédito Alguna evidencia de problemas financieros pasados, como cuentas en colecciones»\", \"o\": [\"Modelo vantageScore\", \"Historial crediticio con pagos atrasados ocasionales\", \"Eficiencia\", \"Adaptabilidad\"], \"k\": 1, \"e\": \"Pág. 9. El material identifica «Historial crediticio con pagos atrasados ocasionales» con esta descripción: Niveles moderados de deuda en comparación con el límite de crédito Alguna evidencia de problemas financieros pasados, como cuentas en colecciones\", \"p\": 9, \"term\": \"Historial crediticio con pagos atrasados ocasionales\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «el score de crédito y puntaje crediticio permiten a las instituciones financieras evaluar de manera rápida y objetiva el riesgo crediticio de un individuo»\", \"o\": [\"Nivel de endeudamiento\", \"Tipos de crédito\", \"Eficiencia\", \"Evaluación de riesgos\"], \"k\": 3, \"e\": \"Pág. 3. El material identifica «Evaluación de riesgos» con esta descripción: el score de crédito y puntaje crediticio permiten a las instituciones financieras evaluar de manera rápida y objetiva el riesgo crediticio de un individuo\", \"p\": 3, \"term\": \"Evaluación de riesgos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Estos modelos son desarrollados a medida para adaptarse a las necesidades específicas de un prestamista, incorporando variables únicas y metodologías personalizadas»\", \"o\": [\"Modelos basados en puntajes personalizados\", \"Relaciones causales\", \"Mitigación del riesgo\", \"Historial crediticio con pagos atrasados ocasionales\"], \"k\": 0, \"e\": \"Pág. 17. El material identifica «Modelos basados en puntajes personalizados» con esta descripción: Estos modelos son desarrollados a medida para adaptarse a las necesidades específicas de un prestamista, incorporando variables únicas y metodologías personalizadas\", \"p\": 17, \"term\": \"Modelos basados en puntajes personalizados\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Los modelos econométricos de puntuación crediticia utilizan una serie de indicadores clave para evaluar el riesgo crediticio y predecir el comportamiento de los prestatarios»\", \"o\": [\"Indicadores claves de los modelos econométricos\", \"La importancia de los modelos econométricos\", \"Nivel de probabilidad del modelo de análisis\", \"Modelos basados en puntajes personalizados\"], \"k\": 0, \"e\": \"Pág. 14. El material identifica «Indicadores claves de los modelos econométricos» con esta descripción: Los modelos econométricos de puntuación crediticia utilizan una serie de indicadores clave para evaluar el riesgo crediticio y predecir el comportamiento de los prestatarios\", \"p\": 14, \"term\": \"Indicadores claves de los modelos econométricos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «al utilizar modelos de calificación crediticia, las instituciones financieras pueden identificar de manera proactiva los potenciales riesgos crediticios y tomar medidas preventivas para mitigarlos»\", \"o\": [\"Vantagescore\", \"Mitigación del riesgo\", \"Toma de decisiones basada en datos\", \"Objetividad\"], \"k\": 1, \"e\": \"Pág. 12. El material identifica «Mitigación del riesgo» con esta descripción: al utilizar modelos de calificación crediticia, las instituciones financieras pueden identificar de manera proactiva los potenciales riesgos crediticios y tomar medidas preventivas para mitigarlos\", \"p\": 12, \"term\": \"Mitigación del riesgo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «se evalúa la relación entre la cantidad de deuda total de un individuo y su capacidad de pago»\", \"o\": [\"Nivel de endeudamiento\", \"Excelente: 8 \": [\"Chime\", \"4. Plataformas de inversiones\", \"Préstamos y crédito\", \"1. Jumio\"], \"k\": 2, \"e\": \"Pág. 3. El material identifica «Préstamos y crédito» con esta descripción: utiliza algoritmos y big data para evaluar la solvencia de los solicitantes de manera más eficiente permitiendo ofrecer créditos y préstamos de manera más rápida y, a menudo con menos requisitos que los bancos tradicionales\", \"p\": 3, \"term\": \"Préstamos y crédito\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Posiblemente una de las plataformas de pago más reconocidas a nivel global.»\", \"o\": [\"insurtech\", \"1. PayPal\", \"Wealthfront\", \"1. Financiamiento colectivo\"], \"k\": 1, \"e\": \"Pág. 8. El material identifica «1. PayPal» con esta descripción: Posiblemente una de las plataformas de pago más reconocidas a nivel global.\", \"p\": 8, \"term\": \"1. PayPal\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «ofrecen soluciones rápidas de financiamiento basadas en facturas para pequeñas empresas, ayudándolas a gestionar mejor su capital de trabajo»\", \"o\": [\"Seedrs y Crowdcube\", \"MetricStream\", \"Fundbox y BlueVine\", \"Tipos de financiamiento colectivo\"], \"k\": 2, \"e\": \"Pág. 11. El material identifica «Fundbox y BlueVine» con esta descripción: ofrecen soluciones rápidas de financiamiento basadas en facturas para pequeñas empresas, ayudándolas a gestionar mejor su capital de trabajo\", \"p\": 11, \"term\": \"Fundbox y BlueVine\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Las plataformas de préstamos P2P conectan a personas que buscan financiación con inversores dispuestos a prestar dinero a cambio de un retorno en forma de intereses.»\", \"o\": [\"2. Préstamos Peer-to-Peer (P2P)\", \"Regnology\", \"1. Financiamiento colectivo\", \"Empresas destacadas en el ámbito de robo-asesores\"], \"k\": 0, \"e\": \"Pág. 11. El material identifica «2. Préstamos Peer-to-Peer (P2P)» con esta descripción: Las plataformas de préstamos P2P conectan a personas que buscan financiación con inversores dispuestos a prestar dinero a cambio de un retorno en forma de intereses.\", \"p\": 11, \"term\": \"2. Préstamos Peer-to-Peer (P2P)\"}];const letters=['A','B','C','D'];let idx=0,ans=Array(Q.length).fill(null),locked=Array(Q.length).fill(false);function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;')}function render(){let q=Q[idx];document.getElementById('count').textContent=`Pregunta ${idx+1} de ${Q.length}`;document.getElementById('answered').textContent=`${locked.filter(Boolean).length} comprobadas`;document.getElementById('bar').style.width=((idx+1)/Q.length*100)+'%';document.getElementById('stem').textContent=q.q;document.getElementById('options').innerHTML=q.o.map((v,j)=>`<button class=\"opt ${ans[idx]===j?'chosen':''} ${locked[idx]&&j===q.k?'correct':''} ${locked[idx]&&ans[idx]===j&&j!==q.k?'wrong':''}\" ${locked[idx]?'disabled':''} onclick=\"choose(${j})\"><b>${letters[j]}.<\/b> ${esc(v)}<\/button>`).join('');document.getElementById('prev').disabled=idx===0;document.getElementById('check').classList.toggle('hidden',locked[idx]);document.getElementById('check').disabled=ans[idx]===null;document.getElementById('next').classList.toggle('hidden',!locked[idx]);document.getElementById('next').textContent=idx===Q.length-1?'Ver calificación':'Siguiente →';let f=document.getElementById('feedback');f.classList.toggle('hidden',!locked[idx]);if(locked[idx])f.innerHTML=`<b class=\"${ans[idx]===q.k?'good':'bad'}\">${ans[idx]===q.k?'✓ Respuesta correcta':'✗ Respuesta incorrecta'}<\/b><p>${esc(q.e)}<\/p>`}function choose(j){if(locked[idx])return;ans[idx]=j;render()}function check(){if(ans[idx]===null)return;locked[idx]=true;render()}function prev(){if(idx>0){idx--;render()}}function next(){if(!locked[idx])return;if(idx===Q.length-1){finish();return}idx++;render()}function finish(){let correct=Q.filter((q,i)=>ans[i]===q.k).length;document.getElementById('quiz').classList.add('hidden');document.getElementById('results').classList.remove('hidden');document.getElementById('score').textContent=Math.round(100*correct/Q.length)+'%';document.getElementById('summary').textContent=`${correct} de ${Q.length} respuestas correctas`;document.getElementById('review').innerHTML=Q.map((q,i)=>`<div class=\"review\"><b>${i+1}. ${esc(q.q)}<\/b><div class=\"${ans[i]===q.k?'good':'bad'}\">Tu respuesta: ${letters[ans[i]]}. ${esc(q.o[ans[i]])}<\/div>${ans[i]===q.k?'':`<div class=\"good\">Correcta: ${letters[q.k]}. ${esc(q.o[q.k])}<\/div>`}<div>${esc(q.e)}<\/div><\/div>`).join('');window.scrollTo(0,0)}function restart(){idx=0;ans=Array(Q.length).fill(null);locked=Array(Q.length).fill(false);document.getElementById('results').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();window.scrollTo(0,0)}render();<\/script><\/body><\/html>", "title": "Impacto de la tecnología Fintech en la industria crediticia en Guatemala", "count": 38, "week": "Semana 19", "area": "Área Bancaria Financiera"}, {"html": "<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Estrategia de venta cruzada<\/title><style>\n*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#183047;font:16px system-ui,Segoe UI,Arial}.shell{max-width:900px;margin:24px auto;padding:0 14px}.head{background:#10365b;color:white;border-radius:16px;padding:26px}.head small{letter-spacing:.08em;color:#b8d7f2}.head h1{margin:8px 0 6px;font-size:28px}.head p{margin:5px 0;color:#e3edf7}.box{background:white;border-radius:16px;padding:26px;margin:18px 0;box-shadow:0 3px 14px #193b5610}.meta{display:flex;justify-content:space-between;color:#63798c;font-size:14px}.progress{height:8px;background:#e3edf5;border-radius:99px;overflow:hidden;margin:16px 0 24px}.bar{height:100%;background:#1682bf}.stem{f " id=\"check\" onclick=\"check()\">Comprobar respuesta<\/button><button class=\"act hidden\" id=\"next\" onclick=\"next()\">Siguiente →<\/button><\/div><\/section><section class=\"box hidden\" id=\"results\"><h2>Resultado del simulador<\/h2><div class=\"score\" id=\"score\"><\/div><p id=\"summary\" style=\"text-align:center\"><\/p><div class=\"actions\"><button class=\"act secondary\" onclick=\"restart()\">Repetir<\/button><button class=\"act\" onclick=\"window.print()\">Imprimir revisión<\/button><\/div><h2>Respuestas explicadas<\/h2><div id=\"review\"><\/div><\/section><footer>Preguntas basadas únicamente en el documento del curso y páginas indicadas. Funciona sin conexión.<\/footer><\/div><script>\nconst Q=[{\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «después de la compra se realiza un seguimiento para garantizar que el cliente esté satisfecho con su elección y que esté aprovechando al máximo las mejoras o adiciones»\", \"o\": [\"Seguimiento postventa\", \"Fomento de la compra impulsiva\", \"Utilizar la personalización\", \"Segmentar a la audiencia\"], \"k\": 0, \"e\": \"Pág. 22. El material identifica «Seguimiento postventa» con esta descripción: después de la compra se realiza un seguimiento para garantizar que el cliente esté satisfecho con su elección y que esté aprovechando al máximo las mejoras o adiciones\", \"p\": 22, \"term\": \"Seguimiento postventa\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «implementar estrategias de personalización en las interacciones con el cliente, esto implica ofrecer recomendaciones personalizadas basadas en su historial de compras y preferencias»\", \"o\": [\"Utilizar la personalización\", \"Aumento de ingresos\", \"Enfoque en el valor añadido\", \"Énfasis en la educación del cliente\"], \"k\": 0, \"e\": \"Pág. 15. El material identifica «Utilizar la personalización» con esta descripción: implementar estrategias de personalización en las interacciones con el cliente, esto implica ofrecer recomendaciones personalizadas basadas en su historial de compras y preferencias\", \"p\": 15, \"term\": \"Utilizar la personalización\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «la venta cruzada exitosa adapta las ofertas a las necesidades específicas de cada cliente, de esta forma, es posible realizar cierres de venta eficientes que sean acordes a las expectativas de cada consumidor o usuario»\", \"o\": [\"Ofertas a la medida\", \"Falta de análisis de datos\", \"Optimización de recursos\", \"Conocer profundamente al cliente\"], \"k\": 0, \"e\": \"Pág. 7. El material identifica «Ofertas a la medida» con esta descripción: la venta cruzada exitosa adapta las ofertas a las necesidades específicas de cada cliente, de esta forma, es posible realizar cierres de venta eficientes que sean acordes a las expectativas de cada consumidor o usuario\", \"p\": 7, \"term\": \"Ofertas a la medida\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «algunos clientes pueden ser reacios a adquirir productos o servicios adicionales, incluso si son complementarios a los que ya han comprado»\", \"o\": [\"Optimización de recursos\", \"Resistencia del cliente\", \"Diversificación de ingresos\", \"Falta de análisis de datos\"], \"k\": 1, \"e\": \"Pág. 12. El material identifica «Resistencia del cliente» con esta descripción: algunos clientes pueden ser reacios a adquirir productos o servicios adicionales, incluso si son complementarios a los que ya han comprado\", \"p\": 12, \"term\": \"Resistencia del cliente\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «la venta cruzada permite comprender mejor las necesidades del cliente las empresas pueden desarrollar una gestión de inventario y planificación de productos más eficiente reduciendo el desperdicio y mejorando la eficiencia operativa»\", \"o\": [\"Optimización de recursos\", \"Enfoque en el valor añadido\", \"Diferencias organizacionales\", \"Falta de análisis de datos\"], \"k\": 0, \"e\": \"Pág. 5. El material identifica «Optimización de recursos» con esta descripción: la venta cruzada permite comprender mejor las necesidades del cliente las empresas pueden desarrollar una gestión de inventario y planificación de productos más eficiente reduciendo el desperdicio y mejorando la eficiencia operativa\", \"p\": 5, \"term\": \"Optimización de recursos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «contribuye a una experiencia de compra más personalizada y enriquecedora»\", \"o\": [\"Énfasis en la educación del cliente\", \"Diversificación de ingresos\", \"completa\", \"Falta de análisis de datos\"], \"k\": 2, \"e\": \"Pág. 7. El material identifica «completa» con esta descripción: contribuye a una experiencia de compra más personalizada y enriquecedora\", \"p\": 7, \"term\": \"completa\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «proporciona información relevante al cliente sobre los beneficios y la utilidad de los productos o servicios complementarios La información clara y persuasiva puede influir positivamente en las decisiones de compra»\", \"o\": [\"Énfasis en la educación del cliente\", \"Utilizar la personalización\", \"Uso de técnicas persuasivas\", \"Falta de personalización\"], \"k\": 0, \"e\": \"Pág. 27. El material identifica «Énfasis en la educación del cliente» con esta descripción: proporciona información relevante al cliente sobre los beneficios y la utilidad de los productos o servicios complementarios La información clara y persuasiva puede influir positivamente en las decisiones de compra\", \"p\": 27, \"term\": \"Énfasis en la educación del cliente\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «se integra con otras estrategias comerciales como el upselling, el marketing de contenidos y las estrategias de fidelización del cliente»\", \"o\": [\"Utilizar la personalización\", \"Evaluación continua de resultados\", \"Falta de personalización\", \"Marketing integral\"], \"k\": 3, \"e\": \"Pág. 8. El material identifica «Marketing integral» con esta descripción: se integra con otras estrategias comerciales como el upselling, el marketing de contenidos y las estrategias de fidelización del cliente\", \"p\": 8, \"term\": \"Marketing integral\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «utiliza tecnologías avanzadas como análisis de datos y sistemas de gestión para identificar oportunidades de venta cruzada de manera más eficiente»\", \"o\": [\"Mayor satisfacción del cliente\", \"Personalización de la oferta\", \"Ofertas a la medida\", \"Tecnología y análisis de datos\"], \"k\": 3, \"e\": \"Pág. 8. El material identifica «Tecnología y análisis de datos» con esta descripción: utiliza tecnologías avanzadas como análisis de datos y sistemas de gestión para identificar oportunidades de venta cruzada de manera más eficiente\", \"p\": 8, \"term\": \"Tecnología y análisis de datos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «la venta cruzada proporciona a los clientes soluciones más integrales y completas para satisfacer sus necesidades, lo que contribuye a una mayor satisfacción y fidelidad»\", \"o\": [\"Medición de resultados\", \"Énfasis en la educación del cliente\", \"Personalización de ofertas\", \"Mayor satisfacción del cliente\"], \"k\": 3, \"e\": \"Pág. 4. El material identifica «Mayor satisfacción del cliente» con esta descripción: la venta cruzada proporciona a los clientes soluciones más integrales y completas para satisfacer sus necesidades, lo que contribuye a una mayor satisfacción y fidelidad\", \"p\": 4, \"term\": \"Mayor satisfacción del cliente\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «tales como destacar los beneficios adicionales, ofrecer descuentos en productos relacionados o crear paquetes atractivos para incentivar la compra de productos complementarios»\", \"o\": [\"Segmentar a la audiencia\", \"Personalización de la oferta\", \"Uso de técnicas persuasivas\", \"Marketing integral\"], \"k\": 2, \"e\": \"Pág. 26. El material identifica «Uso de técnicas persuasivas» con esta descripción: tales como destacar los beneficios adicionales, ofrecer descuentos en productos relacionados o crear paquetes atractivos para incentivar la compra de productos complementarios\", \"p\": 26, \"term\": \"Uso de técnicas persuasivas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «al ofrecer productos o servicios adicionales, las empresas pueden aumentar el valor promedio de cada transacción, lo que se traduce directamente en un aumento de los ingresos»\", \"o\": [\"Tecnología y análisis de datos\", \"Aumento de ingresos\", \"Conocer profundamente al cliente\", \"Medición de resultados\"], \"k\": 1, \"e\": \"Pág. 4. El material identifica «Aumento de ingresos» con esta descripción: al ofrecer productos o servicios adicionales, las empresas pueden aumentar el valor promedio de cada transacción, lo que se traduce directamente en un aumento de los ingresos\", \"p\": 4, \"term\": \"Aumento de ingresos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «el upselling es una estrategia efectiva que, cuando se implementa de manera ética y centrada en el cliente puede generar beneficios, tanto para la empresa como para el consumidor, al ofrecer opciones que mejoran la experiencia de compra»\", \"o\": [\"Evaluación continua de resultados\", \"Énfasis en la educación del cliente\", \"Personalización de ofertas\", \"Medición de resultados\"], \"k\": 3, \"e\": \"Pág. 23. El material identifica «Medición de resultados» con esta descripción: el upselling es una estrategia efectiva que, cuando se implementa de manera ética y centrada en el cliente puede generar beneficios, tanto para la empresa como para el consumidor, al ofrecer opciones que mejoran la experiencia de compra\", \"p\": 23, \"term\": \"Medición de resultados\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «las ofertas se basan en datos específicos del consumidor, como patrones de compra, preferencias y comportamientos»\", \"o\": [\"Ofertas a la medida\", \"Personalización de ofertas\", \"Falta de análisis de datos\", \"Conocer profundamente al cliente\"], \"k\": 1, \"e\": \"Pág. 25. El material identifica «Personalización de ofertas» con esta descripción: las ofertas se basan en datos específicos del consumidor, como patrones de compra, preferencias y comportamientos\", \"p\": 25, \"term\": \"Personalización de ofertas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «la venta cruzada exitosa se basa en ofrecer productos o servicios relevantes y personalizados a cada cliente»\", \"o\": [\"Uso de técnicas persuasivas\", \"Ofertas a la medida\", \"Evaluación continua de resultados\", \"Falta de personalización\"], \"k\": 3, \"e\": \"Pág. 13. El material identifica «Falta de personalización» con esta descripción: la venta cruzada exitosa se basa en ofrecer productos o servicios relevantes y personalizados a cada cliente\", \"p\": 13, \"term\": \"Falta de personalización\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «aquí se aprovecha la posibilidad de compra impulsiva al presentar opciones atractivas y convincentes durante el proceso de compra»\", \"o\": [\"Fomento de la compra impulsiva\", \"Diferencias organizacionales\", \"Ofertas a la medida\", \"Uso de técnicas persuasivas\"], \"k\": 0, \"e\": \"Pág. 26. El material identifica «Fomento de la compra impulsiva» con esta descripción: aquí se aprovecha la posibilidad de compra impulsiva al presentar opciones atractivas y convincentes durante el proceso de compra\", \"p\": 26, \"term\": \"Fomento de la compra impulsiva\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «se implementan métricas y análisis para evaluar la efectividad de las estrategias de venta cruzada»\", \"o\": [\"Uso de técnicas persuasivas\", \"Diferencias organizacionales\", \"Seguimiento postventa\", \"Evaluación continua de resultados\"], \"k\": 3, \"e\": \"Pág. 27. El material identifica «Evaluación continua de resultados» con esta descripción: se implementan métricas y análisis para evaluar la efectividad de las estrategias de venta cruzada\", \"p\": 27, \"term\": \"Evaluación continua de resultados\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «esta fase conlleva dividir a los clientes en segmentos basados en comportamientos de compra similares»\", \"o\": [\"Énfasis en la educación del cliente\", \"Segmentar a la audiencia\", \"Medición de resultados\", \"Enfoque en el valor añadido\"], \"k\": 1, \"e\": \"Pág. 14. El material identifica «Segmentar a la audiencia» con esta descripción: esta fase conlleva dividir a los clientes en segmentos basados en comportamientos de compra similares\", \"p\": 14, \"term\": \"Segmentar a la audiencia\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «en algunas empresas, los diferentes departamentos o equipos trabajan de forma aislada, sin compartir información entre ellos»\", \"o\": [\"Seguimiento postventa\", \"Conocer profundamente al cliente\", \"Mayor satisfacción del cliente\", \"Diferencias organizacionales\"], \"k\": 3, \"e\": \"Pág. 12. El material identifica «Diferencias organizacionales» con esta descripción: en algunas empresas, los diferentes departamentos o equipos trabajan de forma aislada, sin compartir información entre ellos\", \"p\": 12, \"term\": \"Diferencias organizacionales\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «es importante realizar un análisis detallado del perfil del cliente Esto incluye datos demográficos, preferencias de compra, historial de transacciones y cualquier otra información relevante»\", \"o\": [\"Conocer profundamente al cliente\", \"Énfasis en la educación del cliente\", \"Aumento de ingresos\", \"Fomento de la compra impulsiva\"], \"k\": 0, \"e\": \"Pág. 13. El material identifica «Conocer profundamente al cliente» con esta descripción: es importante realizar un análisis detallado del perfil del cliente Esto incluye datos demográficos, preferencias de compra, historial de transacciones y cualquier otra información relevante\", \"p\": 13, \"term\": \"Conocer profundamente al cliente\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «se adapta a las necesidades y preferencias específicas del cliente»\", \"o\": [\"Seguimiento postventa\", \"Personalización de la oferta\", \"Fomento de la compra impulsiva\", \"Enfoque en el valor añadido\"], \"k\": 1, \"e\": \"Pág. 20. El material identifica «Personalización de la oferta» con esta descripción: se adapta a las necesidades y preferencias específicas del cliente\", \"p\": 20, \"term\": \"Personalización de la oferta\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «la estrategia se centra en resaltar el valor añadido que el cliente obtendrá al elegir una opción más cara que la elegida con anterioridad»\", \"o\": [\"Énfasis en la educación del cliente\", \"Fomento de la compra impulsiva\", \"Uso de técnicas persuasivas\", \"Enfoque en el valor añadido\"], \"k\": 3, \"e\": \"Pág. 20. El material identifica «Enfoque en el valor añadido» con esta descripción: la estrategia se centra en resaltar el valor añadido que el cliente obtendrá al elegir una opción más cara que la elegida con anterioridad\", \"p\": 20, \"term\": \"Enfoque en el valor añadido\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «la identificación de oportunidades suele basarse en el análisis de datos sobre el comportamiento de los clientes, sus compras anteriores, preferencias y otros factores»\", \"o\": [\"Falta de análisis de datos\", \"Segmentar a la audiencia\", \"Personalización de ofertas\", \"Tecnología y análisis de datos\"], \"k\": 0, \"e\": \"Pág. 12. El material identifica «Falta de análisis de datos» con esta descripción: la identificación de oportunidades suele basarse en el análisis de datos sobre el comportamiento de los clientes, sus compras anteriores, preferencias y otros factores\", \"p\": 12, \"term\": \"Falta de análisis de datos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «esta estrategia permite diversificar las ofertas, reduce la dependencia de un solo producto o servicio, lo que hace que la empresa sea más resistente a cambios en la demanda»\", \"o\": [\"Diversificación de ingresos\", \"Marketing integral\", \"Personalización de la oferta\", \"Utilizar la personalización\"], \"k\": 0, \"e\": \"Pág. 6. El material identifica «Diversificación de ingresos» con esta descripción: esta estrategia permite diversificar las ofertas, reduce la dependencia de un solo producto o servicio, lo que hace que la empresa sea más resistente a cambios en la demanda\", \"p\": 6, \"term\": \"Diversificación de ingresos\"}];const letters=['A','B','C','D'];let idx=0,ans=Array(Q.length).fill(null),locked=Array(Q.length).fill(false);function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;')}function render(){let q=Q[idx];document.getElementById('count').textContent=`Pregunta ${idx+1} de ${Q.length}`;document.getElementById('answered').textContent=`${locked.filter(Boolean).length} comprobadas`;document.getElementById('bar').style.width=((idx+1)/Q.length*100)+'%';document.getElementById('stem').textContent=q.q;document.getElementById('options').innerHTML=q.o.map((v,j)=>`<button class=\"opt ${ans[idx]===j?'chosen':''} ${locked[idx]&&j===q.k?'correct':''} ${locked[idx]&&ans[idx]===j&&j!==q.k?'wrong':''}\" ${locked[idx]?'disabled':''} onclick=\"choose(${j})\"><b>${letters[j]}.<\/b> ${esc(v)}<\/button>`).join('');document.getElementById('prev').disabled=idx===0;document.getElementById('check').classList.toggle('hidden',locked[idx]);document.getElementById('check').disabled=ans[idx]===null;document.getElementById('next').classList.toggle('hidden',!locked[idx]);document.getElementById('next').textContent=idx===Q.length-1?'Ver calificación':'Siguiente →';let f=document.getElementById('feedback');f.classList.toggle('hidden',!locked[idx]);if(locked[idx])f.innerHTML=`<b class=\"${ans[idx]===q.k?'good':'bad'}\">${ans[idx]===q.k?'✓ Respuesta correcta':'✗ Respuesta incorrecta'}<\/b><p>${esc(q.e)}<\/p>`}function choose(j){if(locked[idx])return;ans[idx]=j;render()}function check(){if(ans[idx]===null)return;locked[idx]=true;render()}function prev(){if(idx>0){idx--;render()}}function next(){if(!locked[idx])return;if(idx===Q.length-1){finish();return}idx++;render()}function finish(){let correct=Q.filter((q,i)=>ans[i]===q.k).length;document.getElementById('quiz').classList.add('hidden');document.getElementById('results').classList.remove('hidden');document.getElementById('score').textContent=Math.round(100*correct/Q.length)+'%';document.getElementById('summary').textContent=`${correct} de ${Q.length} respuestas correctas`;document.getElementById('review').innerHTML=Q.map((q,i)=>`<div class=\"review\"><b>${i+1}. ${esc(q.q)}<\/b><div class=\"${ans[i]===q.k?'good':'bad'}\">Tu respuesta: ${letters[ans[i]]}. ${esc(q.o[ans[i]])}<\/div>${ans[i]===q.k?'':`<div class=\"good\">Correcta: ${letters[q.k]}. ${esc(q.o[q.k])}<\/div>`}<div>${esc(q.e)}<\/div><\/div>`).join('');window.scrollTo(0,0)}function restart(){idx=0;ans=Array(Q.length).fill(null);locked=Array(Q.length).fill(false);document.getElementById('results').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();window.scrollTo(0,0)}render();<\/script><\/body><\/html>", "title": "Estrategia de venta cruzada", "count": 24, "week": "Semana 3", "area": "Área Comercial"}, {"html": "<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Técnicas de venta en los productos financieros<\/title><style>\n*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#183047;font:16px system-ui,Segoe UI,Arial}.shell{max-width:900px;margin:24px auto;padding:0 14px}.head{background:#10365b;color:white;border-radius:16px;padding:26px}.head small{letter-spacing:.08em;color:#b8d7f2}.head h1{margin:8px 0 6px;font-size:28px}.head p{margin:5px 0;color:#e3edf7}.box{background:white;border-radius:16px;padding:26px;margin:18px 0;box-shadow:0 3px 14px #193b5610}.meta{display:flex;justify-content:space-between;color:#63798c;font-size:14px}.progress{height:8px;background:#e3edf5;border-radius:99px;overflow:hidden;margin:16px 0 24px}.bar{height:100%;background:#1682bf}.stem{font-size:19px;line-height:1.6;font-weight:650;margin:20px 0}.opt{display:block;width:100%;border:1px solid #d1dde6;background:#fff;text-align:left;padding:14px 16px;margin:10px 0;border-radius:10px;cursor:pointer;font-size:15px;line-height:1.45}.opt:hover{background:#f3faff;border-color:#7aafd1}.opt.chosen{background:#e9f4fc;border:2px solid #1672ac}.opt.correct{background:#e7f6ee;border:2px solid #11834c}.opt.wrong{background:#ffeded;border:2px solid #c74646}.opt:disabled{cursor:default}.feedback{background:#edf5fc;padding:14px;border-radius:10px;margin-top:15px;line-height:1.55}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:20px}button.act{background:#176c9e;color:white;border:0;border-radius:9px;padding:12px 16px;font-weight:650;cursor:pointer}button.act.secondary{background:#e6eef5;color:#1c4263}button.act:disabled{opacity:.4;cursor:default}.hidden{display:none}.score{text-align:center;font-size:48px;color:#176c9e;font-weight:800}.review{border-bottom:1px solid #e4ebf2;padding:16px 0;line-height:1.55}.good{color:#0d7d49}.bad{color:#c63d3d}footer{color:#64748b;font-size:12px;text-align:center;padding:15px}@media(max-width:520px){.head h1{font-size:23px}.box{padding:18px}.stem{font-size:17px}}\n<\/style><\/head><body><div class=\"shell\"><header class=\"head\"><small>ECP 2026 · SIMULADOR DE ESTUDIO<\/small><h1>Semana 7<\/h1><p><b>Documento:<\/b> Técnicas de venta en los productos financieros<\/p><p>Área Comercial · Técnicas de ventas cruzadas y productos financieros<\/p><p>Páginas 2–18 de la guía oficial · 26 preguntas<\/p><\/header><section class=\"box\" id=\"quiz\"><div class=\"meta\"><span id=\"count\"><\/span><span id=\"answered\"><\/span><\/div><div class=\"progress\"><div class=\"bar\" id=\"bar\"><\/div><\/div><div class=\"stem\" id=\"stem\"><\/div><div id=\"options\"><\/div><div id=\"feedback\" class=\"feedback hidden\"><\/div><div class=\"actions\"><button class=\"act secondary\" id=\"prev\" onclick=\"prev()\">← Anterior<\/button><button class=\"act\" id=\"check\" onclick=\"check()\">Comprobar respuesta<\/button><button class=\"act hidden\" id=\"next\" onclick=\"next()\">Siguiente →<\/button><\/div><\/section><section class=\"box hidden\" id=\"results\"><h2>Resultado del simulador<\/h2><div class=\"score\" id=\"score\"><\/div><p id=\"summary\" style=\"text-align:center\"><\/p><div class=\"actions\"><button class=\"act secondary\" onclick=\"restart()\">Repetir<\/button><button class=\"act\" onclick=\"window.print()\">Imprimir revisión<\/button><\/div><h2>Respuestas explicadas<\/h2><div id=\"review\"><\/div><\/section><footer>Preguntas basadas únicamente en el documento del curso y páginas indicadas. Funciona sin conexión.<\/footer><\/div><script>\nconst Q=[{\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «contar historias que ilustren cómo los productos financieros han mejorado la vida financiera de otros clientes puede conectar emocionalmente con los nuevos prospectos y persuadirlos para considerar los productos»\", \"o\": [\"Presentación de opciones\", \"Narrativas persuasivas\", \"Demostración de valor\", \"Ofertas limitadas\"], \"k\": 1, \"e\": \"Pág. 9. El material identifica «Narrativas persuasivas» con esta descripción: contar historias que ilustren cómo los productos financieros han mejorado la vida financiera de otros clientes puede conectar emocionalmente con los nuevos prospectos y persuadirlos para considerar los productos\", \"p\": 9, \"term\": \"Narrativas persuasivas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «se debe proporcionar un servicio excepcional después de la venta para construir lealtad»\", \"o\": [\"Narrativas persuasivas\", \"Capacitación continua\", \"Testimonios y casos de éxito\", \"Seguimiento postventa\"], \"k\": 3, \"e\": \"Pág. 7. El material identifica «Seguimiento postventa» con esta descripción: se debe proporcionar un servicio excepcional después de la venta para construir lealtad\", \"p\": 7, \"term\": \"Seguimiento postventa\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «al ofrecer varias opciones y colocar la opción preferida en primer lugar puede influir en la percepción del cliente y hacer que esta sea la que le parezca más atractiva»\", \"o\": [\"Preguntas que guían\", \"Presentación de opciones\", \"Transparencia\", \"Programas de fidelidad\"], \"k\": 1, \"e\": \"Pág. 10. El material identifica «Presentación de opciones» con esta descripción: al ofrecer varias opciones y colocar la opción preferida en primer lugar puede influir en la percepción del cliente y hacer que esta sea la que le parezca más atractiva\", \"p\": 10, \"term\": \"Presentación de opciones\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «las técnicas de venta efectivas deben centrarse en comprender las necesidades y expectativas de los clientes y no solo en cerrar transacciones»\", \"o\": [\"Utilizar la tecnología\", \"Presentación de opciones\", \"Satisfacción del cliente\", \"Manejo de objeciones\"], \"k\": 2, \"e\": \"Pág. 3. El material identifica «Satisfacción del cliente» con esta descripción: las técnicas de venta efectivas deben centrarse en comprender las necesidades y expectativas de los clientes y no solo en cerrar transacciones\", \"p\": 3, \"term\": \"Satisfacción del cliente\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «presentar estadísticas o cifras que respalden la efectividad de los productos financieros puede influir en la percepción del cliente sobre la popularidad y éxito de dichos»\", \"o\": [\"Capacitación continua\", \"Emplear números y estadísticas\", \"Conocer al cliente\", \"Maximización de ingresos\"], \"k\": 1, \"e\": \"Pág. 8. El material identifica «Emplear números y estadísticas» con esta descripción: presentar estadísticas o cifras que respalden la efectividad de los productos financieros puede influir en la percepción del cliente sobre la popularidad y éxito de dichos\", \"p\": 8, \"term\": \"Emplear números y estadísticas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «el entorno financiero está en constante evolución debido a cambios en la economía, regulaciones y avances; por eso la venta de productos financieros requiere habilidades»\", \"o\": [\"Diferenciación competitiva\", \"Adaptación al cambio\", \"Profesionales certificados\", \"Comunicación clara y efectiva\"], \"k\": 1, \"e\": \"Pág. 5. El material identifica «Adaptación al cambio» con esta descripción: el entorno financiero está en constante evolución debido a cambios en la economía, regulaciones y avances; por eso la venta de productos financieros requiere habilidades\", \"p\": 5, \"term\": \"Adaptación al cambio\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «es importante investigar y comprender las necesidades financieras y metas de los clientes, así como personalizar el enfoque según la situación financiera y los objetivos individuales»\", \"o\": [\"Cierre efectivo\", \"Ofertas limitadas\", \"Transparencia\", \"Conocer al cliente\"], \"k\": 3, \"e\": \"Pág. 6. El material identifica «Conocer al cliente» con esta descripción: es importante investigar y comprender las necesidades financieras y metas de los clientes, así como personalizar el enfoque según la situación financiera y los objetivos individuales\", \"p\": 6, \"term\": \"Conocer al cliente\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «proponer beneficios personalizados como tasas de interés preferenciales o servicios adicionales, puede generar un sentido de reciprocidad y aumentar la disposición del cliente para comprometerse»\", \"o\": [\"Ofertas personalizadas\", \"Construcción de confianza\", \"Establecimiento de confianza\", \"Adaptación al cambio\"], \"k\": 0, \"e\": \"Pág. 9. El material identifica «Ofertas personalizadas» con esta descripción: proponer beneficios personalizados como tasas de interés preferenciales o servicios adicionales, puede generar un sentido de reciprocidad y aumentar la disposición del cliente para comprometerse\", \"p\": 9, \"term\": \"Ofertas personalizadas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «es importante construir relaciones sólidas mostrando integridad y transparencia»\", \"o\": [\"Preguntas que guían\", \"Manejo de objeciones\", \"Capacitación continua\", \"Establecimiento de confianza\"], \"k\": 3, \"e\": \"Pág. 6. El material identifica «Establecimiento de confianza» con esta descripción: es importante construir relaciones sólidas mostrando integridad y transparencia\", \"p\": 6, \"term\": \"Establecimiento de confianza\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «presentar testimonios de clientes satisfechos o casos de éxito puede construir confianza al demostrar resultados positivos»\", \"o\": [\"Testimonios y casos de éxito\", \"Seguimiento postventa\", \"Incremento de la rentabilidad\", \"Emplear números y estadísticas\"], \"k\": 0, \"e\": \"Pág. 8. El material identifica «Testimonios y casos de éxito» con esta descripción: presentar testimonios de clientes satisfechos o casos de éxito puede construir confianza al demostrar resultados positivos\", \"p\": 8, \"term\": \"Testimonios y casos de éxito\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «para concluir es importante invitar a la acción de manera clara y específica utilizando técnicas de cierre naturales y se alineen con la situación»\", \"o\": [\"Cierre efectivo\", \"Manejo de objeciones\", \"Preguntas que guían\", \"Adaptación al cambio\"], \"k\": 0, \"e\": \"Pág. 7. El material identifica «Cierre efectivo» con esta descripción: para concluir es importante invitar a la acción de manera clara y específica utilizando técnicas de cierre naturales y se alineen con la situación\", \"p\": 7, \"term\": \"Cierre efectivo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «ser transparente sobre costos, condiciones y beneficios ayuda a establecer una relación de confianza»\", \"o\": [\"Transparencia\", \"Preguntas que guían\", \"Ofertas limitadas\", \"Capacitación continua\"], \"k\": 0, \"e\": \"Pág. 8. El material identifica «Transparencia» con esta descripción: ser transparente sobre costos, condiciones y beneficios ayuda a establecer una relación de confianza\", \"p\": 8, \"term\": \"Transparencia\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «estos son una excelente manera de fomentar el cross selling»\", \"o\": [\"Testimonios y casos de éxito\", \"Establecimiento de confianza\", \"Programas de fidelidad\", \"Técnicas de persuasión\"], \"k\": 2, \"e\": \"Pág. 16. El material identifica «Programas de fidelidad» con esta descripción: estos son una excelente manera de fomentar el cross selling\", \"p\": 16, \"term\": \"Programas de fidelidad\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «es necesario anticiparse a posibles objeciones y prepararse para abordarlas de ngth*100)+'%';document.getElementById('stem').textContent=q.q;document.getElementById('options').innerHTML=q.o.map((v,j)=>`<button class=\"opt ${ans[idx]===j?'chosen':''} ${locked[idx]&&j===q.k?'correct':''} ${locked[idx]&&ans[idx]===j&&j!==q.k?'wrong':''}\" ${locked[idx]?'disabled':''} onclick=\"choose(${j})\"><b>${letters[j]}.<\/b> ${esc(v)}<\/button>`).join('');document.getElementById('prev').disabled=idx===0;document.getElementById('check').classList.toggle('hidden',locked[idx]);document.getElementById('check').disabled=ans[idx]===null;document.getElementById('next').classList.toggle('hidden',!locked[idx]);document.getElementById('next').textContent=idx===Q.length-1?'Ver calificación':'Siguiente →';let f=document.getElementById('feedback');f.classList.toggle('hidden',!locked[idx]);if(locked[idx])f.innerHTML=`<b class=\"${ans[idx]===q.k?'good':'bad'}\">${ans[idx]===q.k?'✓ Respuesta correcta':'✗ Respuesta incorrecta'}<\/b><p>${esc(q.e)}<\/p>`}function choose(j){if(locked[idx])return;ans[idx]=j;render()}function check(){if(ans[idx]===null)return;locked[idx]=true;render()}function prev(){if(idx>0){idx--;render()}}function next(){if(!locked[idx])return;if(idx===Q.length-1){finish();return}idx++;render()}function finish(){let correct=Q.filter((q,i)=>ans[i]===q.k).length;document.getElementById('quiz').classList.add('hidden');document.getElementById('results').classList.remove('hidden');document.getElementById('score').textContent=Math.round(100*correct/Q.length)+'%';document.getElementById('summary').textContent=`${correct} de ${Q.length} respuestas correctas`;document.getElementById('review').innerHTML=Q.map((q,i)=>`<div class=\"review\"><b>${i+1}. ${esc(q.q)}<\/b><div class=\"${ans[i]===q.k?'good':'bad'}\">Tu respuesta: ${letters[ans[i]]}. ${esc(q.o[ans[i]])}<\/div>${ans[i]===q.k?'':`<div class=\"good\">Correcta: ${letters[q.k]}. ${esc(q.o[q.k])}<\/div>`}<div>${esc(q.e)}<\/div><\/div>`).join('');window.scrollTo(0,0)}function restart(){idx=0;ans=Array(Q.length).fill( ct.secondary{background:#e6eef5;color:#1c4263}button.act:disabled{opacity:.4;cursor:default}.hidden{display:none}.score{text-align:center;font-size:48px;color:#176c9e;font-weight:800}.review{border-bottom:1px solid #e4ebf2;padding:16px 0;line-height:1.55}.good{color:#0d7d49}.bad{color:#c63d3d}footer{color:#64748b;font-size:12px;text-align:center;padding:15px}@media(max-width:520px){.head h1{font-size:23px}.box{padding:18px}.stem{font-size:17px}}\n<\/style><\/head><body><div class=\"shell\"><header class=\"head\"><small>ECP 2026 · SIMULADOR DE ESTUDIO<\/small><h1>Semana 2<\/h1><p><b>Documento:<\/b> Herramientas y técnicas de captación de clientes<\/p><p>Área Comercial · Implementación de estrategias de captación<\/p><p>Páginas 2–14 de la guía oficial · 26 preguntas<\/p><\/header><section class=\"box\" id=\"quiz\"><div class=\"meta\"><span id=\"count\"><\/span><span id=\"answered\"><\/span><\/div><div class=\"progress\"><div class=\"bar\" id=\"bar\"><\/div><\/div><div class=\"stem\" id=\"stem\"><\/div><div id=\"options\"><\/div><div id=\"feedback\" class=\"feedback hidden\"><\/div><div class=\"actions\"><button class=\"act secondary\" id=\"prev\" onclick=\"prev()\">← Anterior<\/button><button class=\"act\" id=\"check\" onclick=\"check()\">Comprobar respuesta<\/button><button class=\"act hidden\" id=\"next\" onclick=\"next()\">Siguiente →<\/button><\/div><\/section><section class=\"box hidden\" id=\"results\"><h2>Resultado del simulador<\/h2><div class=\"score\" id=\"score\"><\/div><p id=\"summary\" style=\"text-align:center\"><\/p><div class=\"actions\"><button class=\"act secondary\" onclick=\"restart()\">Repetir<\/button><button class=\"act\" onclick=\"window.print()\">Imprimir revisión<\/button><\/div><h2>Respuestas explicadas<\/h2><div id=\"review\"><\/div><\/section><footer>Preguntas basadas únicamente en el documento del curso y páginas indicadas. Funciona sin conexión.<\/footer><\/div><script>\nconst Q=[{\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Utilizar chatbot y herramientas de automatización para ofrecer asistencia rápida y personalizada a los»\", \"o\": [\"Tasa de éxito\", \"Uso de tecnología y digitalización\", \"Automatización de procesos\", \"Construcción de confianza en el sector financiero\"], \"k\": 2, \"e\": \"Pág. 3. El material identifica «Automatización de procesos» con esta descripción: Utilizar chatbot y herramientas de automatización para ofrecer asistencia rápida y personalizada a los\", \"p\": 3, \"term\": \"Automatización de procesos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «la competencia en el sector financiero es intensa y retener a los clientes existentes es más rentable que adquirir nuevos»\", \"o\": [\"Respuesta rápida\", \"Atención personalizada\", \"Ofertas a medida\", \"Fidelización del cliente\"], \"k\": 3, \"e\": \"Pág. 8. El material identifica «Fidelización del cliente» con esta descripción: la competencia en el sector financiero es intensa y retener a los clientes existentes es más rentable que adquirir nuevos\", \"p\": 8, \"term\": \"Fidelización del cliente\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La personalización implica adaptar los productos y servicios bancarios para satisfacer las necesidades específicas de cada cliente.»\", \"o\": [\"¿Qué es la prospección caliente?\", \"Personalización de servicios\", \"Fidelización del cliente\", \"Eventos de networking\"], \"k\": 1, \"e\": \"Pág. 2. El material identifica «Personalización de servicios» con esta descripción: La personalización implica adaptar los productos y servicios bancarios para satisfacer las necesidades específicas de cada cliente.\", \"p\": 2, \"term\": \"Personalización de servicios\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Utilizar datos demográficos para identificar los segmentos más prometedores.»\", \"o\": [\"Desafíos y consideraciones del marketing directo\", \"Análisis de KPI\", \"Análisis demográfico y socioeconómico\", \"¿Qué es la prospección caliente?\"], \"k\": 2, \"e\": \"Pág. 2. El material identifica «Análisis demográfico y socioeconómico» con esta descripción: Utilizar datos demográficos para identificar los segmentos más prometedores.\", \"p\": 2, \"term\": \"Análisis demográfico y socioeconómico\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «formar alianzas con otras empresas o instituciones puede expandir el alcance y atraer a nuevos clientes»\", \"o\": [\"Regulación y cumplimiento\", \"Construcción de confianza\", \"Alianzas estratégicas\", \"Interacciones iniciales\"], \"k\": 2, \"e\": \"Pág. 4. El material identifica «Alianzas estratégicas» con esta descripción: formar alianzas con otras empresas o instituciones puede expandir el alcance y atraer a nuevos clientes\", \"p\": 4, \"term\": \"Alianzas estratégicas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «el marketing directo permite segmentar a los clientes según diversos criterios como el comportamiento de compra, la edad, la ubicación geográfica o el historial crediticio»\", \"o\": [\"Análisis demográfico y socioeconómico\", \"Segmentación precisa\", \"¿Qué es la prospección fría?\", \"Encuestas de satisfacción\"], \"k\": 1, \"e\": \"Pág. 13. El material identifica «Segmentación precisa» con esta descripción: el marketing directo permite segmentar a los clientes según diversos criterios como el comportamiento de compra, la edad, la ubicación geográfica o el historial crediticio\", \"p\": 13, \"term\": \"Segmentación precisa\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «para garantizar interacciones de alta calidad es esencial que los empleados del banco reciban capacitación continua en habilidades de comunicación, servicio al cliente y conocimientos financieros»\", \"o\": [\"Construcción de confianza\", \"¿Qué es la prospección fría?\", \"Desafíos y consideraciones del marketing directo\", \"Capacitación continua\"], \"k\": 3, \"e\": \"Pág. 11. El material identifica «Capacitación continua» con esta descripción: para garantizar interacciones de alta calidad es esencial que los empleados del banco reciban capacitación continua en habilidades de comunicación, servicio al cliente y conocimientos financieros\", \"p\": 11, \"term\": \"Capacitación continua\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «participar o patrocinar eventos locales para aumentar la visibilidad y establecer conexiones con clientes potenciales»\", \"o\": [\"Análisis demográfico y socioeconómico\", \"Eventos de networking\", \"Medición y análisis\", \"Amplio alcance\"], \"k\": 1, \"e\": \"Pág. 3. El material identifica «Eventos de networking» con esta descripción: participar o patrocinar eventos locales para aumentar la visibilidad y establecer conexiones con clientes potenciales\", \"p\": 3, \"term\": \"Eventos de networking\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Segmentación precisa: los prospectos han sido identificados previamente y muestran señales claras de interés o necesidad de los servicios ofrecidos»\", \"o\": [\"Las características de la prospección caliente\", \"Personalización de servicios\", \"Fidelización del cliente\", \"Las características de la prospección fría\"], \"k\": 0, \"e\": \"Pág. 6. El material identifica «Las características de la prospección caliente» con esta descripción: Segmentación precisa: los prospectos han sido identificados previamente y muestran señales claras de interés o necesidad de los servicios ofrecidos\", \"p\": 6, \"term\": \"Las características de la prospección caliente\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «las primeras interacciones con los prospectos son clave para generar interés»\", \"o\": [\"Interacciones iniciales\", \"Personalización de servicios\", \"Uso de tecnología y digitalización\", \"Las características de la prospección caliente\"], \"k\": 0, \"e\": \"Pág. 6. El material identifica «Interacciones iniciales» con esta descripción: las primeras interacciones con los prospectos son clave para generar interés\", \"p\": 6, \"term\": \"Interacciones iniciales\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La confianza en el sector bancario se construye a través de la transparencia en las operaciones y la comunicación.»\", \"o\": [\"Respuesta rápida\", \"Encuestas de satisfacción\", \"Construcción de confianza en el sector financiero\", \"Fidelización del cliente\"], \"k\": 2, \"e\": \"Pág. 10. El material identifica «Construcción de confianza en el sector financiero» con esta descripción: La confianza en el sector bancario se construye a través de la transparencia en las operaciones y la comunicación.\", \"p\": 10, \"term\": \"Construcción de confianza en el sector financiero\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «A pesar de sus ventajas, el marketing directo en mercados bancarios y financieros enfrenta ciertos desafíos como la gestión de la privacidad y la protección de datos, aspectos fundamentales para»\", \"o\": [\"Banca en línea y móvil\", \"Regulación y cumplimiento\", \"Construcción de confianza en el sector financiero\", \"Desafíos y consideraciones del marketing directo\"], \"k\": 3, \"e\": \"Pág. 14. El material identifica «Desafíos y consideraciones del marketing directo» con esta descripción: A pesar de sus ventajas, el marketing directo en mercados bancarios y financieros enfrenta ciertos desafíos como la gestión de la privacidad y la protección de datos, aspectos fundamentales para\", \"p\": 14, \"term\": \"Desafíos y consideraciones del marketing directo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El marketing digital es una herramienta poderosa para atraer clientes en el entorno actual.»\", \"o\": [\"Estrategia
