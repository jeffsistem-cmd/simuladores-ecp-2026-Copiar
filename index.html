utton><button class=\"act\" id=\"check\" onclick=\"check()\">Comprobar respuesta<\/button><button class=\"act hidden\" id=\"next\" onclick=\"next()\">Siguiente →<\/button><\/div><\/section><section class=\"box hidden\" id=\"results\"><h2>Resultado del simulador<\/h2><div class=\"score\" id=\"score\"><\/div><p id=\"summary\" style=\"text-align:center\"><\/p><div class=\"actions\"><button class=\"act secondary\" onclick=\"restart()\">Repetir<\/button><button class=\"act\" onclick=\"window.print()\">Imprimir revisión<\/button><\/div><h2>Respuestas explicadas<\/h2><div id=\"review\"><\/div><\/section><footer>Preguntas basadas únicamente en el documento del curso y páginas indicadas. Funciona sin conexión.<\/footer><\/div><script>\nconst Q=[{\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Son clientes que tienen un alto uso de productos de crédito como préstamos personales, hipotecas y tarjetas de crédito.»\", \"o\": [\"¿Qué es el análisis de cuentas?\", \"Clientes de crédito\", \"Necesidades\", \"4. ANÁLISIS DE COMPORTAMIENTO DEL CLIENTE\"], \"k\": 1, \"e\": \"Pág. 7. El material identifica «Clientes de crédito» con esta descripción: Son clientes que tienen un alto uso de productos de crédito como préstamos personales, hipotecas y tarjetas de crédito.\", \"p\": 7, \"term\": \"Clientes de crédito\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El desarrollo de propuestas de valor personalizadas implica los siguientes pasos clave Análisis de datos del cliente: utilizar los datos obtenidos en el análisis de cuentas, incluyendo»\", \"o\": [\"PROCESO PARA DESARROLLAR PROPUESTAS DE VALOR PERSONALIZADAS\", \"Gestión de riesgos\", \"Retención y fidelización\", \"Clientes de servicios especiales\"], \"k\": 0, \"e\": \"Pág. 15. El material identifica «PROCESO PARA DESARROLLAR PROPUESTAS DE VALOR PERSONALIZADAS» con esta descripción: El desarrollo de propuestas de valor personalizadas implica los siguientes pasos clave Análisis de datos del cliente: utilizar los datos obtenidos en el análisis de cuentas, incluyendo\", \"p\": 15, \"term\": \"PROCESO PARA DESARROLLAR PROPUESTAS DE VALOR PERSONALIZADAS\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «identificar a los clientes con una relación prolongada con el banco quienes probablemente serán más leales y estarán más dispuestos a adquirir nuevos»\", \"o\": [\"Relevancia\", \"1. ANÁLISIS DE CUENTAS DE CLIENTES\", \"Fidelización y lealtad\", \"Clientes nuevos o jóvenes\"], \"k\": 2, \"e\": \"Pág. 10. El material identifica «Fidelización y lealtad» con esta descripción: identificar a los clientes con una relación prolongada con el banco quienes probablemente serán más leales y estarán más dispuestos a adquirir nuevos\", \"p\": 10, \"term\": \"Fidelización y lealtad\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El análisis de cuentas es el proceso mediante el cual los bancos revisan el comportamiento financiero las transacciones y el perfil general de cada cliente.»\", \"o\": [\"Segmentación\", \"Gestión del riesgo\", \"¿Qué es el análisis de cuentas?\", \"Prevención del fraude\"], \"k\": 2, \"e\": \"Pág. 11. El material identifica «¿Qué es el análisis de cuentas?» con esta descripción: El análisis de cuentas es el proceso mediante el cual los bancos revisan el comportamiento financiero las transacciones y el perfil general de cada cliente.\", \"p\": 11, \"term\": \"¿Qué es el análisis de cuentas?\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Evaluación del riesgo crediticio: revisa el perfil crediticio de los clientes, incluyendo la capacidad de pago y el historial de crédito»\", \"o\": [\"PROCESO PARA DESARROLLAR PROPUESTAS DE VALOR PERSONALIZADAS\", \"2. ANÁLISIS DE PRÉSTAMOS Y CRÉDITOS\", \"Creación de perfiles de clientes\", \"MÉTODOS DE SEGMENTACIÓN DE CLIENTES DE CONSUMO\"], \"k\": 1, \"e\": \"Pág. 12. El material identifica «2. ANÁLISIS DE PRÉSTAMOS Y CRÉDITOS» con esta descripción: Evaluación del riesgo crediticio: revisa el perfil crediticio de los clientes, incluyendo la capacidad de pago y el historial de crédito\", \"p\": 12, \"term\": \"2. ANÁLISIS DE PRÉSTAMOS Y CRÉDITOS\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «utilizar herramientas de análisis predictivo permite a los bancos identificar clientes con alto potencial de crecimiento, pues estas herramientas analizan el comportamiento histórico y los patrones de consumo»\", \"o\": [\"Uso de modelos predictivos\", \"Clientes de crédito\", \"Recopilación de datos\", \"Clientes de alto valor\"], \"k\": 0, \"e\": \"Pág. 10. El material identifica «Uso de modelos predictivos» con esta descripción: utilizar herramientas de análisis predictivo permite a los bancos identificar clientes con alto potencial de crecimiento, pues estas herramientas analizan el comportamiento histórico y los patrones de consumo\", \"p\": 10, \"term\": \"Uso de modelos predictivos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Incluyen a estudiantes y jóvenes profesionales que están empezando a manejar sus finanzas.»\", \"o\": [\"OBJETIVOS DEL ANÁLISIS DE CUENTAS\", \"Potencial de rentabilidad\", \"Clientes nuevos o jóvenes\", \"Clientes transaccionales\"], \"k\": 2, \"e\": \"Pág. 8. El material identifica «Clientes nuevos o jóvenes» con esta descripción: Incluyen a estudiantes y jóvenes profesionales que están empezando a manejar sus finanzas.\", \"p\": 8, \"term\": \"Clientes nuevos o jóvenes\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Esta identificación implica conocer quiénes son nuestros clientes, qué los motiva, qué necesidades tienen y cómo interactúan con los productos financieros.»\", \"o\": [\"¿Qué es la identificación de clientes?\", \"¿QUÉ ES LA SEGMENTACIÓN DE CLIENTES?\", \"Tendencias de uso\", \"Mejora de la rentabilidad\"], \"k\": 0, \"e\": \"Pág. 2. El material identifica «¿Qué es la identificación de clientes?» con esta descripción: Esta identificación implica conocer quiénes son nuestros clientes, qué los motiva, qué necesidades tienen y cómo interactúan con los productos financieros.\", \"p\": 2, \"term\": \"¿Qué es la identificación de clientes?\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Diversidad en necesidades: los clientes de consumo tienen una amplia gama de necesidades, desde la apertura de una cuenta corriente hasta productos de inversión o»\", \"o\": [\"Necesidades\", \"Segmentación demográfica\", \"Diferenciación\", \"CARACTERÍSTICAS DE LOS CLIENTES DE CONSUMO\"], \"k\": 3, \"e\": \"Pág. 6. El material identifica «CARACTERÍSTICAS DE LOS CLIENTES DE CONSUMO» con esta descripción: Diversidad en necesidades: los clientes de consumo tienen una amplia gama de necesidades, desde la apertura de una cuenta corriente hasta productos de inversión o\", \"p\": 6, \"term\": \"CARACTERÍSTICAS DE LOS CLIENTES DE CONSUMO\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «una identificación efectiva y segura contribuye a la confianza del público en el sistema bancario»\", \"o\": [\"HERRAMIENTAS PARA EL DESARROLLO DE PROPUESTAS PERSONALIZADAS\", \"Prevención de fraude\", \"Confianza y reputación\", \"Creación de perfiles de clientes\"], \"k\": 2, \"e\": \"Pág. 2. El material identifica «Confianza y reputación» con esta descripción: una identificación efectiva y segura contribuye a la confianza del público en el sistema bancario\", \"p\": 2, \"term\": \"Confianza y reputación\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «A continuación, algunos criterios que debemos de tomar en cuenta para priorizar a los clientes de»\", \"o\": [\"Tendencias de uso\", \"Criterios para priorizar clientes de consumo masivo\", \"Diferenciación\", \"PROCESO PARA DESARROLLAR PROPUESTAS DE VALOR PERSONALIZADAS\"], \"k\": 1, \"e\": \"Pág. 10. El material identifica «Criterios para priorizar clientes de consumo masivo» con esta descripción: A continuación, algunos criterios que debemos de tomar en cuenta para priorizar a los clientes de\", \"p\": 10, \"term\": \"Criterios para priorizar clientes de consumo masivo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Se basa en variables como la edad, el género, el nivel de ingresos, el estado civil y la ocupación»\", \"o\": [\"Mejora de la rentabilidad\", \"los clientes. Ejemplo\", \"Clientes de servicios especiales\", \"Segmentación demográfica\"], \"k\": 3, \"e\": \"Pág. 9. El material identifica «Segmentación demográfica» con esta descripción: Se basa en variables como la edad, el género, el nivel de ingresos, el estado civil y la ocupación\", \"p\": 9, \"term\": \"Segmentación demográfica\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «analiza la rentabilidad de diferentes productos y servicios ofrecidos a los clientes, ajustando las estrategias según sea necesario»\", \"o\": [\"TÉCNICAS PARA PRIORIZACIÓN\", \"Evaluación de productos\", \"CANALES DE CAPTACIÓN\", \"Mejora de la rentabilidad\"], \"k\": 1, \"e\": \"Pág. 12. El material identifica «Evaluación de productos» con esta descripción: analiza la rentabilidad de diferentes productos y servicios ofrecidos a los clientes, ajustando las estrategias según sea necesario\", \"p\": 12, \"term\": \"Evaluación de productos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Esta segmentación consiste en el proceso de dividir el mercado en grupos distintos, homogéneos y manejables basados en características similares como los comportamientos, necesidades o»\", \"o\": [\"Necesidades\", \"los clientes. Ejemplo\", \"¿QUÉ ES LA SEGMENTACIÓN DE CLIENTES?\", \"Clientes transaccionales\"], \"k\": 2, \"e\": \"Pág. 3. El material identifica «¿QUÉ ES LA SEGMENTACIÓN DE CLIENTES?» con esta descripción: Esta segmentación consiste en el proceso de dividir el mercado en grupos distintos, homogéneos y manejables basados en características similares como los comportamientos, necesidades o\", \"p\": 3, \"term\": \"¿QUÉ ES LA SEGMENTACIÓN DE CLIENTES?\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «En un entorno bancario competitivo, personalizar las propuestas de valor permite diferenciarse y captar la atención de clientes potenciales o fortalecer la relación con los existentes»\", \"o\": [\"MEDICIÓN Y AJUSTE\", \"Diferenciación\", \"Análisis de datos del cliente\", \"4. ANÁLISIS DE COMPORTAMIENTO DEL CLIENTE\"], \"k\": 1, \"e\": \"Pág. 15. El material identifica «Diferenciación» con esta descripción: En un entorno bancario competitivo, personalizar las propuestas de valor permite diferenciarse y captar la atención de clientes potenciales o fortalecer la relación con los existentes\", \"p\": 15, \"term\": \"Diferenciación\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «utilizar los datos obtenidos en el análisis de cuentas, incluyendo preferencias, historial de transacciones y uso de productos para entender qué productos y servicios serían de mayor valor para el cliente»\", \"o\": [\"MEDICIÓN Y AJUSTE\", \"Clientes de servicios especiales\", \"1. ANÁLISIS DE CUENTAS DE CLIENTES\", \"Análisis de datos del cliente\"], \"k\": 3, \"e\": \"Pág. 15. El material identifica «Análisis de datos del cliente» con esta descripción: utilizar los datos obtenidos en el análisis de cuentas, incluyendo preferencias, historial de transacciones y uso de productos para entender qué productos y servicios serían de mayor valor para el cliente\", \"p\": 15, \"term\": \"Análisis de datos del cliente\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Enfocarse en los clientes de alto valor es clave para la rentabilidad del banco.»\", \"o\": [\"Segmentación por valor del cliente\", \"1. ANÁLISIS DE CUENTAS DE CLIENTES\", \"Segmentación demográfica\", \"Clientes de inversión\"], \"k\": 0, \"e\": \"Pág. 4. El material identifica «Segmentación por valor del cliente» con esta descripción: Enfocarse en los clientes de alto valor es clave para la rentabilidad del banco.\", \"p\": 4, \"term\": \"Segmentación por valor del cliente\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «acceso a funcionalidades avanzadas en plataformas digitales como transferencias instantáneas y gestión de cuentas en línea»\", \"o\": [\"MEDICIÓN Y AJUSTE\", \"Prevención del fraude\", \"Necesidades\", \"Clientes de crédito\"], \"k\": 2, \"e\": \"Pág. 8. El material identifica «Necesidades» con esta descripción: acceso a funcionalidades avanzadas en plataformas digitales como transferencias instantáneas y gestión de cuentas en línea\", \"p\": 8, \"term\": \"Necesidades\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Cuentas de depósito: evalúa el saldo, las transacciones y el comportamiento de ahorro de los clientes.»\", \"o\": [\"Clientes de alto valor\", \"Análisis de datos del cliente\", \"1. ANÁLISIS DE CUENTAS DE CLIENTES\", \"HERRAMIENTAS PARA EL ANÁLISIS DE CUENTAS\"], \"k\": 2, \"e\": \"Pág. 12. El material identifica «1. ANÁLISIS DE CUENTAS DE CLIENTES» con esta descripción: Cuentas de depósito: evalúa el saldo, las transacciones y el comportamiento de ahorro de los clientes.\", \"p\": 12, \"term\": \"1. ANÁLISIS DE CUENTAS DE CLIENTES\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Identificar posibles riesgos financieros o crediticios mediante la evaluación constante de la cuenta y los productos financieros del cliente»\", \"o\": [\"Gestión del riesgo\", \"Evaluación de productos\", \"los clientes. Ejemplo\", \"Criterios para priorizar clientes de consumo masivo\"], \"k\": 0, \"e\": \"Pág. 14. El material identifica «Gestión del riesgo» con esta descripción: Identificar posibles riesgos financieros o crediticios mediante la evaluación constante de la cuenta y los productos financieros del cliente\", \"p\": 14, \"term\": \"Gestión del riesgo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Una vez segmentados los datos se crean perfiles de clientes para cada segmento.»\", \"o\": [\"los clientes. Ejemplo\", \"Creación de perfiles de clientes\", \"Confianza y reputación\", \"Canales digitales\"], \"k\": 1, \"e\": \"Pág. 5. El material identifica «Creación de perfiles de clientes» con esta descripción: Una vez segmentados los datos se crean perfiles de clientes para cada segmento.\", \"p\": 5, \"term\": \"Creación de perfiles de clientes\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El primer paso es recopilar datos precisos sobre los clientes.»\", \"o\": [\"¿Qué es el análisis de cuentas?\", \"4. ANÁLISIS DE COMPORTAMIENTO DEL CLIENTE\", \"Análisis de datos del cliente\", \"Recopilación de datos\"], \"k\": 3, \"e\": \"Pág. 5. El material identifica «Recopilación de datos» con esta descripción: El primer paso es recopilar datos precisos sobre los clientes.\", \"p\": 5, \"term\": \"Recopilación de datos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Mediante el análisis de las cuentas, el banco puede identificar productos adicionales que podrían ser de interés para el cliente como seguros, productos de inversión o préstamos hipotecarios»\", \"o\": [\"Cuentas de crédito\", \"Uso de modelos predictivos\", \"Oportunidades de venta cruzada\", \"Segmentación psicográfica\"], \"k\": 2, \"e\": \"Pág. 13. El material identifica «Oportunidades de venta cruzada» con esta descripción: Mediante el análisis de las cuentas, el banco puede identificar productos adicionales que podrían ser de interés para el cliente como seguros, productos de inversión o préstamos hipotecarios\", \"p\": 13, \"term\": \"Oportunidades de venta cruzada\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «la mayoría de los consumidores, especialmente los más jóvenes, prefieren canales digitales como sitios web, apps móviles y redes sociales para interactuar con el»\", \"o\": [\"Canales digitales\", \"OBJETIVOS DEL ANÁLISIS DE CUENTAS\", \"Segmentación\", \"¿Qué es la identificación de clientes?\"], \"k\": 0, \"e\": \"Pág. 9. El material identifica «Canales digitales» con esta descripción: la mayoría de los consumidores, especialmente los más jóvenes, prefieren canales digitales como sitios web, apps móviles y redes sociales para interactuar con el\", \"p\": 9, \"term\": \"Canales digitales\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «algunos clientes pueden estar más interesados en productos financieros sostenibles, mientras que otros buscan maximizar sus inversiones con productos de alto riesgo»\", \"o\": [\"los clientes. Ejemplo\", \"¿Qué es una propuesta de valor personalizada?\", \"ADAPTACIÓN DE PRODUCTOS Y SERVICIOS\", \"4. ANÁLISIS DE COMPORTAMIENTO DEL CLIENTE\"], \"k\": 0, \"e\": \"Pág. 4. El material identifica «los clientes. Ejemplo» con esta descripción: algunos clientes pueden estar más interesados en productos financieros sostenibles, mientras que otros buscan maximizar sus inversiones con productos de alto riesgo\", \"p\": 4, \"term\": \"los clientes. Ejemplo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Esta propuesta es una oferta de productos y servicios financieros que responde específicamente a las necesidades y preferencias de un cliente en particular.»\", \"o\": [\"Gestión de riesgos\", \"¿Qué es una propuesta de valor personalizada?\", \"Segmentación psicográfica\", \"2. ANÁLISIS DE PRÉSTAMOS Y CRÉDITOS\"], \"k\": 1, \"e\": \"Pág. 14. El material identifica «¿Qué es una propuesta de valor personalizada?» con esta descripción: Esta propuesta es una oferta de productos y servicios financieros que responde específicamente a las necesidades y preferencias de un cliente en particular.\", \"p\": 14, \"term\": \"¿Qué es una propuesta de valor personalizada?\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «En lugar de lanzar campañas de marketing generales, la segmentación permite crear mensajes dirigidos a audiencias específicas, lo que mejora la efectividad de las campañas»\", \"o\": [\"Retención y fidelización\", \"ADAPTACIÓN DE PRODUCTOS Y SERVICIOS\", \"Creación de perfiles de clientes\", \"Optimización de las estrategias de marketing\"], \"k\": 3, \"e\": \"Pág. 3. El material identifica «Optimización de las estrategias de marketing» con esta descripción: En lugar de lanzar campañas de marketing generales, la segmentación permite crear mensajes dirigidos a audiencias específicas, lo que mejora la efectividad de las campañas\", \"p\": 3, \"term\": \"Optimización de las estrategias de marketing\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Son clientes que tienen altos niveles de ingresos o activos significativos.»\", \"o\": [\"Clientes de ahorro\", \"Clientes de alto valor\", \"Gestión del riesgo\", \"Gestión de riesgos\"], \"k\": 1, \"e\": \"Pág. 7. El material identifica «Clientes de alto valor» con esta descripción: Son clientes que tienen altos niveles de ingresos o activos significativos.\", \"p\": 7, \"term\": \"Clientes de alto valor\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «identificar a los clientes correctamente ayuda a prevenir fraudes y suplantaciones de identidad»\", \"o\": [\"Relevancia\", \"¿Qué es la priorización de clientes?\", \"Confianza y reputación\", \"Prevención del fraude\"], \"k\": 3, \"e\": \"Pág. 2. El material identifica «Prevención del fraude» con esta descripción: identificar a los clientes correctamente ayuda a prevenir fraudes y suplantaciones de identidad\", \"p\": 2, \"term\": \"Prevención del fraude\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Los clientes de consumo tienen diferentes necesidades, algunos pueden estar interesados en préstamos hipotecarios, mientras que otros buscan productos de inversión o tarjetas de crédito con»\", \"o\": [\"Creación de perfiles de clientes\", \"Análisis de datos del cliente\", \"Prevención del fraude\", \"Personalización de productos financieros\"], \"k\": 3, \"e\": \"Pág. 3. El material identifica «Personalización de productos financieros» con esta descripción: Los clientes de consumo tienen diferentes necesidades, algunos pueden estar interesados en préstamos hipotecarios, mientras que otros buscan productos de inversión o tarjetas de crédito con\", \"p\": 3, \"term\": \"Personalización de productos financieros\"}];const letters=['A','B','C','D'];let idx=0,ans=Array(Q.length).fill(null),locked=Array(Q.length).fill(false);function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;')}function render(){let q=Q[idx];document.getElementById('count').textContent=`Pregunta ${idx+1} de ${Q.length}`;document.getElementById('answered').textContent=`${locked.filter(Boolean).length} comprobadas`;document.getElementById('bar').style.width=((idx+1)/Q.length*100)+'%';document.getElementById('stem').textContent=q.q;document.getElementById('options').innerHTML=q.o.map((v,j)=>`<button class=\"opt ${ans[idx]===j?'chosen':''} ${locked[idx]&&j===q.k?'correct':''} ${locked[idx]&&ans[idx]===j&&j!==q.k?'wrong':''}\" ${locked[idx]?'disabled':''} onclick=\"choose(${j})\"><b>${letters[j]}.<\/b> ${esc(v)}<\/button>`).join('');document.getElementById('prev').disabled=idx===0;document.getElementById('check').classList.toggle('hidden',locked[idx]);document.getElementById('check').disabled=ans[idx]===null;document.getElementById('next').classList.toggle('hidden',!locked[idx]);document.getElementById('next').textContent=idx===Q.length-1?'Ver calificación':'Siguiente →';let f=document.getElementById('feedback');f.classList.toggle('hidden',!locked[idx]);if(locked[idx])f.innerHTML=`<b class=\"${ans[idx]===q.k?'good':'bad'}\">${ans[idx]===q.k?'✓ Respuesta correcta':'✗ Respuesta incorrecta'}<\/b><p>${esc(q.e)}<\/p>`}function choose(j){if(locked[idx])return;ans[idx]=j;render()}function check(){if(ans[idx]===null)return;locked[idx]=true;render()}function prev(){if(idx>0){idx--;render()}}function next(){if(!locked[idx])return;if(idx===Q.length-1){finish();return}idx++;render()}function finish(){let correct=Q.filter((q,i)=>ans[i]===q.k).length;document.getElementById('quiz').classList.add('hidden');document.getElementById('results').classList.remove('hidden');document.getElementById('score').textContent=Math.round(100*correct/Q.length)+'%';document.getElementById('summary').textContent=`${correct} de ${Q.length} respuestas correctas`;document.getElementById('review').innerHTML=Q.map((q,i)=>`<div class=\"review\"><b>${i+1}. ${esc(q.q)}<\/b><div class=\"${ans[i]===q.k?'good':'bad'}\">Tu respuesta: ${letters[ans[i]]}. ${esc(q.o[ans[i]])}<\/div>${ans[i]===q.k?'':`<div class=\"good\">Correcta: ${letters[q.k]}. ${esc(q.o[q.k])}<\/div>`}<div>${esc(q.e)}<\/div><\/div>`).join('');window.scrollTo(0,0)}function restart(){idx=0;ans=Array(Q.length).fill(null);locked=Array(Q.length).fill(false);document.getElementById('results').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();window.scrollTo(0,0)}render();<\/script><\/body><\/html>", "title": "Identificación y segmentación de clientes de consumo", "count": 30, "week": "Semana 9", "area": "Área Comercial"}, {"html": "<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Identificación y segmentación de grandes clientes<\/title><style>\n*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#183047;font:16px system-ui,Segoe UI,Arial}.shell{max-width:900px;margin:24px auto;padding:0 14px}.head{background:#10365b;color:white;bord e la guía oficial · 28 preguntas<\/p><\/header><section class=\"box\" id=\"quiz\"><div class=\"meta\"><span id=\"count\"><\/span><span id=\"answered\"><\/span><\/div><div class=\"progress\"><div class=\"bar\" id=\"bar\"><\/div><\/div><div class=\"stem\" id=\"stem\"><\/div><div id=\"options\"><\/div><div id=\"feedback\" class=\"feedback hidden\"><\/div><div class=\"actions\"><button class=\"act secondary\" id=\"prev\" onclick=\"prev()\">← Anterior<\/button><button class=\"act\" id=\"check\" onclick=\"check()\">Comprobar respuesta<\/button><button class=\"act hidden\" id=\"next\" onclick=\"next()\">Siguiente →<\/button><\/div><\/section><section class=\"box hidden\" id=\"results\"><h2>Resultado del simulador<\/h2><div class=\"score\" id=\"score\"><\/div><p id=\"summary\" style=\"text-align:center\"><\/p><div class=\"actions\"><button class=\"act secondary\" onclick=\"restart()\">Repetir<\/button><button class=\"act\" onclick=\"window.print()\">Imprimir revisión<\/button><\/div><h2>Respuestas explicadas<\/h2><div id=\"review\"><\/div><\/section><footer>Preguntas basadas únicamente en el documento del curso y páginas indicadas. Funciona sin conexión.<\/footer><\/div><script>\nconst Q=[{\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La captación de grandes clientes es un proceso basado en relaciones.»\", \"o\": [\"Investigación y análisis de mercado\", \"Evaluación de oportunidades y riesgos\", \"¿Quiénes son los grandes clientes?\", \"Construcción de relaciones estratégicas\"], \"k\": 3, \"e\": \"Pág. 7. El material identifica «Construcción de relaciones estratégicas» con esta descripción: La captación de grandes clientes es un proceso basado en relaciones.\", \"p\": 7, \"term\": \"Construcción de relaciones estratégicas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Identificado y contactado el cliente es esencial realizar una evaluación continua de sus necesidades y, ajustar las ofertas y propuestas de valor según la evolución de la empresa»\", \"o\": [\"Evaluación y ajuste continuo\", \"Segmentación por comportamiento\", \"DESAFÍOS EN LA IDENTIFICACIÓN DE GRANDES CLIENTES\", \"2. Diseñar soluciones personalizadas\"], \"k\": 0, \"e\": \"Pág. 8. El material identifica «Evaluación y ajuste continuo» con esta descripción: Identificado y contactado el cliente es esencial realizar una evaluación continua de sus necesidades y, ajustar las ofertas y propuestas de valor según la evolución de la empresa\", \"p\": 8, \"term\": \"Evaluación y ajuste continuo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «debido a la complejidad de sus necesidades, los ciclos de venta para grandes clientes pueden ser prolongados y requerir de múltiples reuniones y negociaciones»\", \"o\": [\"Segmentación por necesidades financieras\", \"Importancia de captar grandes clientes\", \"Complejidad de sus necesidades financieras\", \"Ciclos de venta largos\"], \"k\": 3, \"e\": \"Pág. 9. El material identifica «Ciclos de venta largos» con esta descripción: debido a la complejidad de sus necesidades, los ciclos de venta para grandes clientes pueden ser prolongados y requerir de múltiples reuniones y negociaciones\", \"p\": 9, \"term\": \"Ciclos de venta largos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La captación de grandes clientes requiere una estrategia diferente a la de clientes de consumo.»\", \"o\": [\"Propuestas de valor adicional\", \"Segmentación por comportamiento\", \"PROCESO DE CAPTACIÓN DE GRANDES CLIENTES\", \"Gestión de tesorería\"], \"k\": 2, \"e\": \"Pág. 6. El material identifica «PROCESO DE CAPTACIÓN DE GRANDES CLIENTES» con esta descripción: La captación de grandes clientes requiere una estrategia diferente a la de clientes de consumo.\", \"p\": 6, \"term\": \"PROCESO DE CAPTACIÓN DE GRANDES CLIENTES\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Ajusta el contenido de la propuesta según el perfil del cliente.»\", \"o\": [\"MÉTODOS DE SEGMENTACIÓN DE GRANDES CLIENTES\", \"7. Implementar y evaluar la propuesta\", \"4. Personalizar la presentación\", \"Relaciones a largo plazo\"], \"k\": 2, \"e\": \"Pág. 13. El material identifica «4. Personalizar la presentación» con esta descripción: Ajusta el contenido de la propuesta según el perfil del cliente.\", \"p\": 13, \"term\": \"4. Personalizar la presentación\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «los bancos pueden utilizar herramientas de análisis de datos para identificar patrones en las transacciones y el comportamiento financiero, que revelen a los grandes clientes o aquellos con potencial de convertirse en grandes clientes»\", \"o\": [\"COMPONENTES CLAVE DEL ANÁLISIS DE GRANDES CLIENTES\", \"Ofrecimiento de servicios especializados\", \"Análisis de datos y big data\", \"Propuestas de valor adicional\"], \"k\": 2, \"e\": \"Pág. 2. El material identifica «Análisis de datos y big data» con esta descripción: los bancos pueden utilizar herramientas de análisis de datos para identificar patrones en las transacciones y el comportamiento financiero, que revelen a los grandes clientes o aquellos con potencial de convertirse en grandes clientes\", \"p\": 2, \"term\": \"Análisis de datos y big data\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Utiliza campañas de marketing dirigidas que resalten la propuesta de valor del banco y se centren en los grandes clientes potenciales.»\", \"o\": [\"7. Implementar y evaluar la propuesta\", \"Estrategia de marketing y comunicación\", \"DESAFÍOS EN LA IDENTIFICACIÓN DE GRANDES CLIENTES\", \"Análisis y monitoreo continuo\"], \"k\": 1, \"e\": \"Pág. 8. El material identifica «Estrategia de marketing y comunicación» con esta descripción: Utiliza campañas de marketing dirigidas que resalten la propuesta de valor del banco y se centren en los grandes clientes potenciales.\", \"p\": 8, \"term\": \"Estrategia de marketing y comunicación\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «asigna un gerente de relaciones dedicado que conozca bien al cliente y pueda ofrecer un servicio personalizado y continuo»\", \"o\": [\"8. Comunicación y revisión\", \"Segmentación por complejidad de servicios\", \"Gestión dedicada\", \"DESAFÍOS EN LA IDENTIFICACIÓN DE GRANDES CLIENTES\"], \"k\": 2, \"e\": \"Pág. 13. El material identifica «Gestión dedicada» con esta descripción: asigna un gerente de relaciones dedicado que conozca bien al cliente y pueda ofrecer un servicio personalizado y continuo\", \"p\": 13, \"term\": \"Gestión dedicada\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Esta segmentación es el proceso de dividir a los clientes en grupos específicos con características comunes.»\", \"o\": [\"¿Qué es la segmentación de clientes?\", \"Desarrollo de relaciones con decisores\", \"Importancia de captar grandes clientes\", \"PROCESO DE CAPTACIÓN DE GRANDES CLIENTES\"], \"k\": 0, \"e\": \"Pág. 3. El material identifica «¿Qué es la segmentación de clientes?» con esta descripción: Esta segmentación es el proceso de dividir a los clientes en grupos específicos con características comunes.\", \"p\": 3, \"term\": \"¿Qué es la segmentación de clientes?\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Clientes que interactúan frecuentemente con el banco versus aquellos que utilizan los servicios de manera ocasional.»\", \"o\": [\"Segmentación por comportamiento\", \"5. Incluir propuestas de valor únicas\", \"Big data y análisis predictivo\", \"Relaciones a largo plazo\"], \"k\": 0, \"e\": \"Pág. 4. El material identifica «Segmentación por comportamiento» con esta descripción: Clientes que interactúan frecuentemente con el banco versus aquellos que utilizan los servicios de manera ocasional.\", \"p\": 4, \"term\": \"Segmentación por comportamiento\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Mantén una comunicación constante con el cliente para revisar el desempeño de los servicios ofrecidos y ajustar las propuestas según las nuevas necesidades o cambios en la situación»\", \"o\": [\"8. Comunicación y revisión\", \"Alto volumen de transacciones\", \"¿Por qué es importante captar grandes clientes?\", \"Ciclos de venta largos\"], \"k\": 0, \"e\": \"Pág. 13. El material identifica «8. Comunicación y revisión» con esta descripción: Mantén una comunicación constante con el cliente para revisar el desempeño de los servicios ofrecidos y ajustar las propuestas según las nuevas necesidades o cambios en la situación\", \"p\": 13, \"term\": \"8. Comunicación y revisión\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Análisis de datos: utiliza herramientas de análisis para monitorizar el comportamiento y las necesidades cambiantes de los grandes clientes»\", \"o\": [\"DESAFÍOS EN LA IDENTIFICACIÓN DE GRANDES CLIENTES\", \"Gestión de riesgos financieros\", \"Gestión dedicada\", \"Análisis y monitoreo continuo\"], \"k\": 3, \"e\": \"Pág. 5. El material identifica «Análisis y monitoreo continuo» con esta descripción: Análisis de datos: utiliza herramientas de análisis para monitorizar el comportamiento y las necesidades cambiantes de los grandes clientes\", \"p\": 5, \"term\": \"Análisis y monitoreo continuo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Las relaciones comerciales con los grandes clientes suelen ser a largo plazo, ya que estos prefieren trabajar con bancos que conocen bien sus necesidades y que puedan ofrecerles soluciones continuas»\", \"o\": [\"Gestión de tesorería\", \"Construcción de relaciones estratégicas\", \"Estrategia de marketing y comunicación\", \"Relaciones a largo plazo\"], \"k\": 3, \"e\": \"Pág. 9. El material identifica «Relaciones a largo plazo» con esta descripción: Las relaciones comerciales con los grandes clientes suelen ser a largo plazo, ya que estos prefieren trabajar con bancos que conocen bien sus necesidades y que puedan ofrecerles soluciones continuas\", \"p\": 9, \"term\": \"Relaciones a largo plazo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Existen la segmentación corporativa que separa a las empresas por industria, tamaño, región y necesidades específica; además, la segmentación individual que lo hace a personas por nivel de»\", \"o\": [\"Segmentación por tipo de cliente\", \"Estrategia de marketing y comunicación\", \"CRM avanzados\", \"¿Qué es la segmentación de clientes?\"], \"k\": 0, \"e\": \"Pág. 4. El material identifica «Segmentación por tipo de cliente» con esta descripción: Existen la segmentación corporativa que separa a las empresas por industria, tamaño, región y necesidades específica; además, la segmentación individual que lo hace a personas por nivel de\", \"p\": 4, \"term\": \"Segmentación por tipo de cliente\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «estos sistemas permiten realizar segmentaciones dinámicas, ajustando los grupos de clientes según su comportamiento reciente y sus interacciones con el banco»\", \"o\": [\"CRM avanzados\", \"Enfoque global y multinacional\", \"Segmentación por sector industrial\", \"Importancia de la segmentación de grandes clientes\"], \"k\": 0, \"e\": \"Pág. 5. El material identifica «CRM avanzados» con esta descripción: estos sistemas permiten realizar segmentaciones dinámicas, ajustando los grupos de clientes según su comportamiento reciente y sus interacciones con el banco\", \"p\": 5, \"term\": \"CRM avanzados\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Realiza un análisis exhaustivo del mercado para identificar grandes clientes potenciales.»\", \"o\": [\"Investigación y análisis de mercado\", \"Propuestas de valor adicional\", \"5. Incluir propuestas de valor únicas\", \"HERRAMIENTAS PARA LA SEGMENT empresas o corporaciones que generan un elevado volumen de transacciones y necesitan soluciones financieras complejas y personalizadas.»\", \"o\": [\"¿Quiénes son los grandes clientes?\", \"Personalización de la oferta\", \"¿Qué es la segmentación de clientes?\", \"Alto potencial de rentabilidad\"], \"k\": 0, \"e\": \"Pág. 6. El material identifica «¿Quiénes son los grandes clientes?» con esta descripción: Estos, en el contexto bancario, son aquellas empresas o corporaciones que generan un elevado volumen de transacciones y necesitan soluciones financieras complejas y personalizadas.\", \"p\": 6, \"term\": \"¿Quiénes son los grandes clientes?\"}];const letters=['A','B','C','D'];let idx=0,ans=Array(Q.length).fill(null),locked=Array(Q.length).fill(false);function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;')}function render(){let q=Q[idx];document.getElementById('count').textContent=`Pregunta ${idx+1} de ${Q.length}`;document.getElementById('answered').textContent=`${locked.filter(Boolean).length} comprobadas`;document.getElementById('bar').style.width=((idx+1)/Q.length*100)+'%';document.getElementById('stem').textContent=q.q;document.getElementById('options').innerHTML=q.o.map((v,j)=>`<button class=\"opt ${ans[idx]===j?'chosen':''} ${locked[idx]&&j===q.k?'correct':''} ${locked[idx]&&ans[idx]===j&&j!==q.k?'wrong':''}\" ${locked[idx]?'disabled':''} onclick=\"choose(${j})\"><b>${letters[j]}.<\/b> ${esc(v)}<\/button>`).join('');document.getElementById('prev').disabled=idx===0;document.getElementById('check').classList.toggle('hidden',locked[idx]);document.getElementById('check').disabled=ans[idx]===null;document.getElementById('next').classList.toggle('hidden',!locked[idx]);document.getElementById('next').textContent=idx===Q.length-1?'Ver calificación':'Siguiente →';let f=document.getElementById('feedback');f.classList.toggle('hidden',!locked[idx]);if(locked[idx])f.innerHTML=`<b class=\"${ans[idx]===q.k?'good':'bad'}\">${ans[idx]===q.k?'✓ Respuesta correcta':'✗ Respuesta incorrecta'}<\/b><p>${esc(q.e)}<\/p>`}function choose(j){if(locked[idx])return;ans[idx]=j;render()}function check(){if(ans[idx]===null)return;locked[idx]=true;render()}function prev(){if(idx>0){idx--;render()}}function next(){if(!locked[idx])return;if(idx===Q.length-1){finish();return}idx++;render()}function finish(){let correct=Q.filter((q,i)=>ans[i]===q.k).length;document.getElementById('quiz').classList.add('hidden');document.getElementById('results').classList.remove('hidden');document.getElementById('score').textContent=Math.round(100*correct/Q.length)+'%';document.getElementById('summary').textContent=`${correct} de ${Q.length} respuestas correctas`;document.getElementById('review').innerHTML=Q.map((q,i)=>`<div class=\"review\"><b>${i+1}. ${esc(q.q)}<\/b><div class=\"${ans[i]===q.k?'good':'bad'}\">Tu respuesta: ${letters[ans[i]]}. ${esc(q.o[ans[i]])}<\/div>${ans[i]===q.k?'':`<div class=\"good\">Correcta: ${letters[q.k]}. ${esc(q.o[q.k])}<\/div>`}<div>${esc(q.e)}<\/div><\/div>`).join('');window.scrollTo(0,0)}function restart(){idx=0;ans=Array(Q.length).fill(null);locked=Array(Q.length).fill(false);document.getElementById('results').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();window.scrollTo(0,0)}render();<\/script><\/body><\/html>", "title": "Identificación y segmentación de grandes clientes", "count": 28, "week": "Semana 10", "area": "Área Comercial"}, {"html": "<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Segmentación de Mercado<\/title><style>\n*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#183047;font:16px system-ui,Segoe UI,Arial}.shell{max-width:900px;margin:24px auto;padding:0 14px}.head{background:#10365b;color:white;border-radius:16px;padding:26px}.head small{letter-spacing:.08em;color:#b8d7f2}.head h1{margin:8px 0 6px;f \/span><\/div><div class=\"progress\"><div class=\"bar\" id=\"bar\"><\/div><\/div><div class=\"stem\" id=\"stem\"><\/div><div id=\"options\"><\/div><div id=\"feedback\" class=\"feedback hidden\"><\/div><div class=\"actions\"><button class=\"act secondary\" id=\"prev\" onclick=\"prev()\">← Anterior<\/button><button class=\"act\" id=\"check\" onclick=\"check()\">Comprobar respuesta<\/button><button class=\"act hidden\" id=\"next\" onclick=\"next()\">Siguiente →<\/button><\/div><\/section><section class=\"box hidden\" id=\"results\"><h2>Resultado del simulador<\/h2><div class=\"score\" id=\"score\"><\/div><p id=\"summary\" style=\"text-align:center\"><\/p><div class=\"actions\"><button class=\"act secondary\" onclick=\"restart()\">Repetir<\/button><button class=\"act\" onclick=\"window.print()\">Imprimir revisión<\/button><\/div><h2>Respuestas explicadas<\/h2><div id=\"review\"><\/div><\/section><footer>Preguntas basadas únicamente en el documento del curso y páginas indicadas. Funciona sin conexión.<\/footer><\/div><script>\nconst Q=[{\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La segmentación permite a las instituciones financieras diferenciarse de la competencia al ofrecer soluciones únicas y bien adaptadas a cada segmento del mercado.»\", \"o\": [\"1. ACTUALIZACIÓN CONSTANTE DE SEGMENTOS\", \"INNOVACIÓN EN EL DESARROLLO DE PRODUCTOS\", \"Patrones de Uso\", \"AUMENTO DE LA COMPETITIVIDAD\"], \"k\": 3, \"e\": \"Pág. 4. El material identifica «AUMENTO DE LA COMPETITIVIDAD» con esta descripción: La segmentación permite a las instituciones financieras diferenciarse de la competencia al ofrecer soluciones únicas y bien adaptadas a cada segmento del mercado.\", \"p\": 4, \"term\": \"AUMENTO DE LA COMPETITIVIDAD\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Considera variables como la edad, el género, el ingreso y el estado civil, las cuales son determinantes clave en la elección de productos financieros»\", \"o\": [\"1. ACTUALIZACIÓN CONSTANTE DE SEGMENTOS\", \"9. INNOVACIÓN Y ADAPTACIÓN\", \"OPTIMIZACIÓN DE RECURSOS\", \"Segmentación Demográfica\"], \"k\": 3, \"e\": \"Pág. 3. El material identifica «Segmentación Demográfica» con esta descripción: Considera variables como la edad, el género, el ingreso y el estado civil, las cuales son determinantes clave en la elección de productos financieros\", \"p\": 3, \"term\": \"Segmentación Demográfica\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La implementación de estas estrategias debe estar integrada en el marco más amplio de los criterios de segmentación.»\", \"o\": [\"2. OPTIMIZACIÓN DE RECURSOS\", \"8. FIDELIZACIÓN DEL CLIENTE\", \"Segmentación Conductual\", \"Integración de los criterios\"], \"k\": 3, \"e\": \"Pág. 17. El material identifica «Integración de los criterios» con esta descripción: La implementación de estas estrategias debe estar integrada en el marco más amplio de los criterios de segmentación.\", \"p\": 17, \"term\": \"Integración de los criterios\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Se centra en aspectos relacionados con el estilo de vida, las actitudes y los valores de los clientes, lo que ayuda a comprender las motivaciones detrás de sus decisiones financieras»\", \"o\": [\"Tamaño del Mercado\", \"Segmentación Psicográfica\", \"Relevancia en la Personalización de Servicios\", \"Segmentación Conductual\"], \"k\": 1, \"e\": \"Pág. 3. El material identifica «Segmentación Psicográfica» con esta descripción: Se centra en aspectos relacionados con el estilo de vida, las actitudes y los valores de los clientes, lo que ayuda a comprender las motivaciones detrás de sus decisiones financieras\", \"p\": 3, \"term\": \"Segmentación Psicográfica\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Otro objetivo clave es la optimización en la asignación de recursos.»\", \"o\": [\"Segmentación Dinámica\", \"6. REDUCCIÓN DEL RIESGO\", \"OPTIMIZACIÓN DE RECURSOS\", \"MEJORA EN LA SATISFACCIÓN DEL CLIENTE\"], \"k\": 2, \"e\": \"Pág. 3. El material identifica «OPTIMIZACIÓN DE RECURSOS» con esta descripción: Otro objetivo clave es la optimización en la asignación de recursos.\", \"p\": 3, \"term\": \"OPTIMIZACIÓN DE RECURSOS\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Las instituciones financieras pueden utilizar la segmentación geográfica para adaptar sus estrategias de producto y marketing según las características específicas de la región.»\", \"o\": [\"Segmentación Dinámica\", \"Aplicación en el Sector Financiero\", \"Impacto en el Sector Financiero\", \"COMPLEJIDAD DEL ANÁLISIS DE DATOS\"], \"k\": 2, \"e\": \"Pág. 11. El material identifica «Impacto en el Sector Financiero» con esta descripción: Las instituciones financieras pueden utilizar la segmentación geográfica para adaptar sus estrategias de producto y marketing según las características específicas de la región.\", \"p\": 11, \"term\": \"Impacto en el Sector Financiero\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La segmentación precisa requiere el uso de tecnologías avanzadas, como algoritmos de machine learning y análisis predictivo.»\", \"o\": [\"Segmentación Conductual\", \"MEJORA EN LA SATISFACCIÓN DEL CLIENTE\", \"2. TECNOLOGÍA Y HERRAMIENTAS ANALÍTICAS\", \"3. USO DE DATOS EN TIEMPO REAL\"], \"k\": 2, \"e\": \"Pág. 5. El material identifica «2. TECNOLOGÍA Y HERRAMIENTAS ANALÍTICAS» con esta descripción: La segmentación precisa requiere el uso de tecnologías avanzadas, como algoritmos de machine learning y análisis predictivo.\", \"p\": 5, \"term\": \"2. TECNOLOGÍA Y HERRAMIENTAS ANALÍTICAS\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Las instituciones financieras utilizan la segmentación demográfica para diseñar productos que se ajusten a las necesidades específicas de cada grupo.»\", \"o\": [\"Aplicación en el Sector Financiero\", \"3. USO DE DATOS EN TIEMPO REAL\", \"7. DIFERENCIACIÓN EN UN MERCADO SATURADO\", \"Relevancia en la Personalización de Servicios\"], \"k\": 0, \"e\": \"Pág. 12. El material identifica «Aplicación en el Sector Financiero» con esta descripción: Las instituciones financieras utilizan la segmentación demográfica para diseñar productos que se ajusten a las necesidades específicas de cada grupo.\", \"p\": 12, \"term\": \"Aplicación en el Sector Financiero\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La capacidad de adaptarse rápidamente a las tendencias emergentes es crucial para el éxito en la segmentación dinámica.»\", \"o\": [\"1. COSTOS DE IMPLEMENTACIÓN\", \"2. RESPUESTAS RÁPIDAS AL MERCADO\", \"Segmentación Conductual\", \"Alianzas con Organizaciones Locales\"], \"k\": 1, \"e\": \"Pág. 7. El material identifica «2. RESPUESTAS RÁPIDAS AL MERCADO» con esta descripción: La capacidad de adaptarse rápidamente a las tendencias emergentes es crucial para el éxito en la segmentación dinámica.\", \"p\": 7, \"term\": \"2. RESPUESTAS RÁPIDAS AL MERCADO\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Diferentes clientes pueden buscar distintos beneficios en un producto financiero, como seguridad, rendimiento, o conveniencia»\", \"o\": [\"MEJORA EN LA SATISFACCIÓN DEL CLIENTE\", \"AUMENTO DE LA COMPETITIVIDAD\", \"Actitudes hacia el Dinero\", \"Beneficios Buscados\"], \"k\": 3, \"e\": \"Pág. 14. El material identifica «Beneficios Buscados» con esta descripción: Diferentes clientes pueden buscar distintos beneficios en un producto financiero, como seguridad, rendimiento, o conveniencia\", \"p\": 14, \"term\": \"Beneficios Buscados\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La forma en que los clientes ven y manejan el dinero, ya sea como un medio para la seguridad, la libertad o el estatus, influye en sus decisiones de ahorro inversión y gasto»\", \"o\": [\"Segmentación Dinámica\", \"COMPLEJIDAD DEL ANÁLISIS DE DATOS\", \"OPTIMIZACIÓN DE RECURSOS\", \"Actitudes hacia el Dinero\"], \"k\": 3, \"e\": \"Pág. 13. El material identifica «Actitudes hacia el Dinero» con esta descripción: La forma en que los clientes ven y manejan el dinero, ya sea como un medio para la seguridad, la libertad o el estatus, influye en sus decisiones de ahorro inversión y gasto\", \"p\": 13, \"term\": \"Actitudes hacia el Dinero\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La segmentación también ayuda a las instituciones financieras a gestionar el riesgo, al permitirles concentrarse en segmentos menos volátiles o más estables.»\", \"o\": [\"Patrones de Uso\", \"6. REDUCCIÓN DEL RIESGO\", \"OPTIMIZACIÓN DE RECURSOS\", \"MEJORA EN LA SATISFACCIÓN DEL CLIENTE\"], \"k\": 1, \"e\": \"Pág. 8. El material identifica «6. REDUCCIÓN DEL RIESGO» con esta descripción: La segmentación también ayuda a las instituciones financieras a gestionar el riesgo, al permitirles concentrarse en segmentos menos volátiles o más estables.\", \"p\": 8, \"term\": \"6. REDUCCIÓN DEL RIESGO\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Para abordar esta diversidad de manera efectiva, es necesario dividir el mercado en segmentos específicos utilizando diferentes criterios de segmentación.»\", \"o\": [\"Aplicación en el Sector Financiero\", \"7. DIFERENCIACIÓN EN UN MERCADO SATURADO\", \"3. USO DE DATOS EN TIEMPO REAL\", \"TIPOS DE SEGMENTACIÓN\"], \"k\": 3, \"e\": \"Pág. 2. El material identifica «TIPOS DE SEGMENTACIÓN» con esta descripción: Para abordar esta diversidad de manera efectiva, es necesario dividir el mercado en segmentos específicos utilizando diferentes criterios de segmentación.\", \"p\": 2, \"term\": \"TIPOS DE SEGMENTACIÓN\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La segmentación permite a las instituciones ajustar sus estrategias de marketing para que sean más efectivas.»\", \"o\": [\"5. OPTIMIZACIÓN DE ESTRATEGIAS DE MARKETING\", \"2. RESPUESTAS RÁPIDAS AL MERCADO\", \"1. COSTOS DE IMPLEMENTACIÓN\", \"Actitudes hacia el Dinero\"], \"k\": 0, \"e\": \"Pág. 8. El material identifica «5. OPTIMIZACIÓN DE ESTRATEGIAS DE MARKETING» con esta descripción: La segmentación permite a las instituciones ajustar sus estrategias de marketing para que sean más efectivas.\", \"p\": 8, \"term\": \"5. OPTIMIZACIÓN DE ESTRATEGIAS DE MARKETING\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La segmentación psicográfica es especialmente útil para las instituciones financieras que buscan personalizar sus ofertas de productos.»\", \"o\": [\"Innovación en Productos Financieros\", \"1. VOLUMEN DE DATOS\", \"Relevancia en la Personalización de Servicios\", \"1. COSTOS DE IMPLEMENTACIÓN\"], \"k\": 2, \"e\": \"Pág. 13. El material identifica «Relevancia en la Personalización de Servicios» con esta descripción: La segmentación psicográfica es especialmente útil para las instituciones financieras que buscan personalizar sus ofertas de productos.\", \"p\": 13, \"term\": \"Relevancia en la Personalización de Servicios\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Implementar una segmentación efectiva presenta varios desafíos.»\", \"o\": [\"3. CALIDAD DE LOS DATOS\", \"Desafíos en la Segmentación de Mercados\", \"Integración de los criterios\", \"Innovación en Productos Financieros\"], \"k\": 1, \"e\": \"Pág. 5. El material identifica «Desafíos en la Segmentación de Mercados» con esta descripción: Implementar una segmentación efectiva presenta varios desafíos.\", \"p\": 5, \"term\": \"Desafíos en la Segmentación de Mercados\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «En un país con una gran diversidad cultural y donde muchas comunidades viven en áreas de difícil acceso, las alianzas con organizaciones locales, como ONGs y a N DE OPORTUNIDADES DE MERCADO\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Una segmentación efectiva no solo atrae nuevos clientes, sino que también ayuda a retener a los existentes.»\", \"o\": [\"Ciclo de Vida Familiar\", \"Actitudes hacia el Dinero\", \"3. USO DE DATOS EN TIEMPO REAL\", \"8. FIDELIZACIÓN DEL CLIENTE\"], \"k\": 3, \"e\": \"Pág. 9. El material identifica «8. FIDELIZACIÓN DEL CLIENTE» con esta descripción: Una segmentación efectiva no solo atrae nuevos clientes, sino que también ayuda a retener a los existentes.\", \"p\": 9, \"term\": \"8. FIDELIZACIÓN DEL CLIENTE\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La implementación de estrategias de segmentación puede ser costosa, especialmente cuando se utilizan tecnologías avanzadas y se requiere personal altamente capacitado.»\", \"o\": [\"1. ACTUALIZACIÓN CONSTANTE DE SEGMENTOS\", \"1. COSTOS DE IMPLEMENTACIÓN\", \"2. EFICIENCIA EN LA ASIGNACIÓN DE RECURSOS\", \"5. OPTIMIZACIÓN DE ESTRATEGIAS DE MARKETING\"], \"k\": 1, \"e\": \"Pág. 6. El material identifica «1. COSTOS DE IMPLEMENTACIÓN» con esta descripción: La implementación de estrategias de segmentación puede ser costosa, especialmente cuando se utilizan tecnologías avanzadas y se requiere personal altamente capacitado.\", \"p\": 6, \"term\": \"1. COSTOS DE IMPLEMENTACIÓN\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Las necesidades financieras varían según la etapa de la vida»\", \"o\": [\"OPTIMIZACIÓN DE RECURSOS\", \"Ciclo de Vida Familiar\", \"Innovación en Productos Financieros\", \"Sensibilidad al Precio\"], \"k\": 1, \"e\": \"Pág. 12. El material identifica «Ciclo de Vida Familiar» con esta descripción: Las necesidades financieras varían según la etapa de la vida\", \"p\": 12, \"term\": \"Ciclo de Vida Familiar\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Las diferencias culturales dentro de un mismo \", \"p\": 5, \"term\": \"1. VOLUMEN DE DATOS\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Adaptar los productos y servicios a las necesidades específicas de cada segmento permite mejorar significativamente la satisfacción del cliente.»\", \"o\": [\"MEJORA EN LA SATISFACCIÓN DEL CLIENTE\", \"2. OPTIMIZACIÓN DE RECURSOS\", \"1. COSTOS DE IMPLEMENTACIÓN\", \"Patrones de Uso\"], \"k\": 0, \"e\": \"Pág. 4. El material identifica «MEJORA EN LA SATISFACCIÓN DEL CLIENTE» con esta descripción: Adaptar los productos y servicios a las necesidades específicas de cada segmento permite mejorar significativamente la satisfacción del cliente.\", \"p\": 4, \"term\": \"MEJORA EN LA SATISFACCIÓN DEL CLIENTE\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La segmentación conductual es clave para diseñar campañas de marketing que se dirijan directamente a las acciones y preferencias de los clientes.»\", \"o\": [\"Innovación en Productos Financieros\", \"Aplicación en Marketing Financiero\", \"2. EFICIENCIA EN LA ASIGNACIÓN DE RECURSOS\", \"2. OPTIMIZACIÓN DE RECURSOS\"], \"k\": 1, \"e\": \"Pág. 14. El material identifica «Aplicación en Marketing Financiero» con esta descripción: La segmentación conductual es clave para diseñar campañas de marketing que se dirijan directamente a las acciones y preferencias de los clientes.\", \"p\": 14, \"term\": \"Aplicación en Marketing Financiero\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Para que la segmentación de mercados sea verdaderamente efectiva en el contexto guatemalteco, es imprescindible que las instituciones financieras adopten un enfoque que vaya más allá de los criterios»\", \"o\": [\"Innovación en Productos Financieros\", \"Enfoque Estratégico en la Segmentación de Mercados\", \"Equilibrio entre Segmentación y Costos\", \"2. EFICIENCIA EN LA ASIGNACIÓN DE RECURSOS\"], \"k\": 1, \"e\": \"Pág. 15. El material identifica «Enfoque Estratégico en la Segmentación de Mercados» con esta descripción: Para que la segmentación de mercados sea verdaderamente efectiva en el contexto guatemalteco, es imprescindible que las instituciones financieras adopten un enfoque que vaya más allá de los criterios\", \"p\": 15, \"term\": \"Enfoque Estratégico en la Segmentación de Mercados\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «En mercados más grandes, las instituciones financieras pueden ofrecer una gama más amplia de productos debido al mayor número de clientes potenciales»\", \"o\": [\"Tamaño del Mercado\", \"INNOVACIÓN EN EL DESARROLLO DE PRODUCTOS\", \"3. MANEJO DE COSTOS INCREMENTALES\", \"Relevancia en la Personalización de Servicios\"], \"k\": 0, \"e\": \"Pág. 10. El material identifica «Tamaño del Mercado» con esta descripción: En mercados más grandes, las instituciones financieras pueden ofrecer una gama más amplia de productos debido al mayor número de clientes potenciales\", \"p\": 10, \"term\": \"Tamaño del Mercado\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La segmentación permite a las instituciones financieras estar a la vanguardia de la innovación, al identificar tendencias emergentes y desarrollar productos que respondan a las nuevas demandas del»\", \"o\": [\"9. INNOVACIÓN Y ADAPTACIÓN\", \"2. OPTIMIZACIÓN DE RECURSOS\", \"Segmentación Psicográfica\", \"1. VOLUMEN DE DATOS\"], \"k\": 0, \"e\": \"Pág. 9. El material identifica «9. INNOVACIÓN Y ADAPTACIÓN» con esta descripción: La segmentación permite a las instituciones financieras estar a la vanguardia de la innovación, al identificar tendencias emergentes y desarrollar productos que respondan a las nuevas demandas del\", \"p\": 9, \"term\": \"9. INNOVACIÓN Y ADAPTACIÓN\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «En un mercado tan competitivo como el financiero, la segmentación es una herramienta fundamental para diferenciarse de la competencia.»\", \"o\": [\"1. VOLUMEN DE DATOS\", \"9. INNOVACIÓN Y ADAPTACIÓN\", \"1. PERSONALIZACIÓN DE SERVICIOS\", \"7. DIFERENCIACIÓN EN UN MERCADO SATURADO\"], \"k\": 3, \"e\": \"Pág. 9. El material identifica «7. DIFERENCIACIÓN EN UN MERCADO SATURADO» con esta descripción: En un mercado tan competitivo como el financiero, la segmentación es una herramienta fundamental para diferenciarse de la competencia.\", \"p\": 9, \"term\": \"7. DIFERENCIACIÓN EN UN MERCADO SATURADO\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La segmentación de mercados, aunque beneficiosa, puede incrementar los costos operativos.»\", \"o\": [\"Segmentación Geográfica\", \"Segmentación Conductual\", \"Sensibilidad al Precio\", \"Equilibrio entre Segmentación y Costos\"], \"k\": 3, \"e\": \"Pág. 6. El material identifica «Equilibrio entre Segmentación y Costos» con esta descripción: La segmentación de mercados, aunque beneficiosa, puede incrementar los costos operativos.\", \"p\": 6, \"term\": \"Equilibrio entre Segmentación y Costos\"}];const letters=['A','B','C','D'];let idx=0,ans=Array(Q.length).fill(null),locked=Array(Q.length).fill(false);function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;')}function render(){let q=Q[idx];document.getElementById('count').textContent=`Pregunta ${idx+1} de ${Q.length}`;document.getElementById('answered').textContent=`${locked.filter(Boolean).length} comprobadas`;document.getElementById('bar').style.width=((idx+1)/Q.length*100)+'%';document.getElementById('stem').textContent=q.q;document.getElementById('options').innerHTML=q.o.map((v,j)=>`<button class=\"opt ${ans[idx]===j?'chosen':''} ${locked[idx]&&j===q.k?'correct':''} ${locked[idx]&&ans[idx]===j&&j!==q.k?'wrong':''}\" ${locked[idx]?'disabled':''} onclick=\"choose(${j})\"><b>${letters[j]}.<\/b> ${esc(v)}<\/button>`).join('');document.getElementById('prev').disabled=idx===0;document.getElementB x}}\n<\/style><\/head><body><div class=\"shell\"><header class=\"head\"><small>ECP 2026 · SIMULADOR DE ESTUDIO<\/small><h1>Semana 5<\/h1><p><b>Documento:<\/b> Comportamiento del Consumidor Financiero<\/p><p>Área Comercial · Análisis de mercado<\/p><p>Páginas 2–8 de la guía oficial · 18 preguntas<\/p><\/header><section class=\"box\" id=\"quiz\"><div class=\"meta\"><span id=\"count\"><\/span><span id=\"answered\"><\/span><\/div><div class=\"progress\"><div class=\"bar\" id=\"bar\"><\/div><\/div><div class=\"stem\" id=\"stem\"><\/div><div id=\"options\"><\/div><div id=\"feedback\" class=\"feedback hidden\"><\/div><div class=\"actions\"><button class=\"act secondary\" id=\"prev\" onclick=\"prev()\">← Anterior<\/button><button class=\"act\" id=\"check\" onclick=\"check()\">Comprobar respuesta<\/button><button class=\"act hidden\" id=\"next\" onclick=\"next()\">Siguiente →<\/button><\/div><\/section><section class=\"box hidden\" id=\"results\"><h2>Resultado del simulador<\/h2><div class=\"score\" id=\"score\"><\/div><p id=\"summary\" style=\"text-align:center\"><\/p><div class=\"actions\"><button class=\"act secondary\" onclick=\"restart()\">Repetir<\/button><button class=\"act\" onclick=\"window.print()\">Imprimir revisión<\/button><\/div><h2>Respuestas explicadas<\/h2><div id=\"review\"><\/div><\/section><footer>Preguntas basadas únicamente en el documento del curso y páginas indicadas. Funciona sin conexión.<\/footer><\/div><script>\nconst Q=[{\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «En esta etapa, el consumidor compara los diferentes productos financieros considerando factores como costos, beneficios, condiciones y riesgos.»\", \"o\": [\"4. GASTO\", \"3. EVALUACIÓN DE ALTERNATIVAS\", \"3. FIDELIZACIÓN DEL CLIENTE\", \"2. PERSONALIZACIÓN DE OFERTAS FINANCIERAS\"], \"k\": 1, \"e\": \"Pág. 6. El material identifica «3. EVALUACIÓN DE ALTERNATIVAS» con esta descripción: En esta etapa, el consumidor compara los diferentes productos financieros considerando factores como costos, beneficios, condiciones y riesgos.\", \"p\": 6, \"term\": \"3. EVALUACIÓN DE ALTERNATIVAS\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El siguiente paso es la búsqueda de información sobre las opciones disponibles.»\", \"o\": [\"2. BÚSQUEDA DE INFORMACIÓN\", \"1. RECONOCIMIENTO DE LA NECESIDAD\", \"3. FIDELIZACIÓN DEL CLIENTE\", \"2. PERSONALIZACIÓN DE OFERTAS FINANCIERAS\"], \"k\": 0, \"e\": \"Pág. 6. El material identifica «2. BÚSQUEDA DE INFORMACIÓN» con esta descripción: El siguiente paso es la búsqueda de información sobre las opciones disponibles.\", \"p\": 6, \"term\": \"2. BÚSQUEDA DE INFORMACIÓN\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Las decisiones de ahorro están profundamente influenciadas por factores psicológicos como la aversión al riesgo, la percepción del futuro y el autocontrol.»\", \"o\": [\"2. PERSONALIZACIÓN DE OFERTAS FINANCIERAS\", \"2. AHORRO\", \"NECESIDAD DE ASESORAMIENTO\", \"4. GASTO\"], \"k\": 1, \"e\": \"Pág. 4. El material identifica «2. AHORRO» con esta descripción: Las decisiones de ahorro están profundamente influenciadas por factores psicológicos como la aversión al riesgo, la percepción del futuro y el autocontrol.\", \"p\": 4, \"term\": \"2. AHORRO\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Finalmente, el consumidor evalúa su experiencia con el producto financiero adquirido.»\", \"o\": [\"PERCEPCIÓN DEL RIESGO\", \"3. PRÉSTAMOS\", \"2. TARJETAS DE CRÉDITO\", \"5. EVALUACIÓN POST-COMPRA\"], \"k\": 3, \"e\": \"Pág. 7. El material identifica «5. EVALUACIÓN POST-COMPRA» con esta descripción: Finalmente, el consumidor evalúa su experiencia con el producto financiero adquirido.\", \"p\": 7, \"term\": \"5. EVALUACIÓN POST-COMPRA\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Comprender el comportamiento financiero de los clientes es clave para desarrollar estrategias de fidelización efectivas.»\", \"o\": [\"3. PRÉSTAMOS\", \"3. FIDELIZACIÓN DEL CLIENTE\", \"3. INVERSIÓN\", \"2. TARJETAS DE CRÉDITO\"], \"k\": 1, \"e\": \"Pág. 8. El material identifica «3. FIDELIZACIÓN DEL CLIENTE» con esta descripción: Comprender el comportamiento financiero de los clientes es clave para desarrollar estrategias de fidelización efectivas.\", \"p\": 8, \"term\": \"3. FIDELIZACIÓN DEL CLIENTE\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Conocer el comportamiento financiero permite a las instituciones adaptar sus productos y servicios a las necesidades particulares de sus clientes.»\", \"o\": [\"2. PERSONALIZACIÓN DE OFERTAS FINANCIERAS\", \"4. DECISIÓN DE COMPRA\", \"1. SEGMENTACIÓN DE MERCADOS\", \"4. SEGUROS\"], \"k\": 0, \"e\": \"Pág. 8. El material identifica «2. PERSONALIZACIÓN DE OFERTAS FINANCIERAS» con esta descripción: Conocer el comportamiento financiero permite a las instituciones adaptar sus productos y servicios a las necesidades particulares de sus clientes.\", \"p\": 8, \"term\": \"2. PERSONALIZACIÓN DE OFERTAS FINANCIERAS\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Al seleccionar un préstamo, los consumidores consideran factores como la tasa de interés, los plazos de pago, la flexibilidad de las condiciones del préstamo y las políticas de penalización por pagos»\", \"o\": [\"3. PRÉSTAMOS\", \"4. GASTO\", \"3. EVALUACIÓN DE ALTERNATIVAS\", \"2. BÚSQUEDA DE INFORMACIÓN\"], \"k\": 0, \"e\": \"Pág. 6. El material identifica «3. PRÉSTAMOS» con esta descripción: Al seleccionar un préstamo, los consumidores consideran factores como la tasa de interés, los plazos de pago, la flexibilidad de las condiciones del préstamo y las políticas de penalización por pagos\", \"p\": 6, \"term\": \"3. PRÉSTAMOS\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El comportamiento del consumidor financiero está fuertemente influenciado por factores macroeconómicos, como las tasas de interés, la inflación, y las políticas fiscales y monetarias»\", \"o\": [\"INFLUENCIA DE FACTORES EXTERNOS\", \"1. CUENTAS BANCARIAS\", \"4. DECISIÓN DE COMPRA\", \"2. BÚSQUEDA DE INFORMACIÓN\"], \"k\": 0, \"e\": \"Pág. 4. El material identifica «INFLUENCIA DE FACTORES EXTERNOS» con esta descripción: El comportamiento del consumidor financiero está fuertemente influenciado por factores macroeconómicos, como las tasas de interés, la inflación, y las políticas fiscales y monetarias\", \"p\": 4, \"term\": \"INFLUENCIA DE FACTORES EXTERNOS\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «A menudo, los consumidores financieros buscan asesoramiento profesional antes de tomar decisiones importantes.»\", \"o\": [\"2. PERSONALIZACIÓN DE OFERTAS FINANCIERAS\", \"1. SEGMENTACIÓN DE MERCADOS\", \"2. TARJETAS DE CRÉDITO\", \"NECESIDAD DE ASESORAMIENTO\"], \"k\": 3, \"e\": \"Pág. 3. El material identifica «NECESIDAD DE ASESORAMIENTO» con esta descripción: A menudo, los consumidores financieros buscan asesoramiento profesional antes de tomar decisiones importantes.\", \"p\": 3, \"term\": \"NECESIDAD DE ASESORAMIENTO\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Las decisiones de gasto están directamente relacionadas con la disponibilidad y el uso de créditos y préstamos.»\", \"o\": [\"4. DECISIÓN DE COMPRA\", \"2. AHORRO\", \"2. BÚSQUEDA DE INFORMACIÓN\", \"4. GASTO\"], \"k\": 3, \"e\": \"Pág. 5. El material identifica «4. GASTO» con esta descripción: Las decisiones de gasto están directamente relacionadas con la disponibilidad y el uso de créditos y préstamos.\", \"p\": 5, \"term\": \"4. GASTO\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El análisis del comportamiento financiero ayuda a segmentar el mercado de manera más precisa.»\", \"o\": [\"4. DECISIÓN DE COMPRA\", \"Procesos de Decisión del Consumidor Financiero\", \"3. FIDELIZACIÓN DEL CLIENTE\", \"1. SEGMENTACIÓN DE MERCADOS\"], \"k\": 3, \"e\": \"Pág. 7. El material identifica «1. SEGMENTACIÓN DE MERCADOS» con esta descripción: El análisis del comportamiento financiero ayuda a segmentar el mercado de manera más precisa.\", \"p\": 7, \"term\": \"1. SEGMENTACIÓN DE MERCADOS\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El comportamiento del consumidor en el ámbito de la inversión está fuertemente influenciado por su percepción del riesgo y la recompensa.»\", \"o\": [\"3. INVERSIÓN\", \"1. SEGMENTACIÓN DE MERCADOS\", \"PERCEPCIÓN DEL RIESGO\", \"Procesos de Decisión del Consumidor Financiero\"], \"k\": 0, \"e\": \"Pág. 4. El material identifica «3. INVERSIÓN» con esta descripción: El comportamiento del consumidor en el ámbito de la inversión está fuertemente influenciado por su percepción del riesgo y la recompensa.\", \"p\": 4, \"term\": \"3. INVERSIÓN\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La elección de una tarjeta de crédito implica considerar tasas de interés, beneficios como recompensas o cashback, límites de crédito y condiciones de pago.»\", \"o\": [\"NECESIDAD DE ASESORAMIENTO\", \"2. TARJETAS DE CRÉDITO\", \"3. INVERSIÓN\", \"1. RECONOCIMIENTO DE LA NECESIDAD\"], \"k\": 1, \"e\": \"Pág. 5. El material identifica «2. TARJETAS DE CRÉDITO» con esta descripción: La elección de una tarjeta de crédito implica considerar tasas de interés, beneficios como recompensas o cashback, límites de crédito y condiciones de pago.\", \"p\": 5, \"term\": \"2. TARJETAS DE CRÉDITO\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Los consumidores evalúan aspectos como las comisiones, la accesibilidad de los fondos, las tasas de interés y la reputación de la entidad financiera.»\", \"o\": [\"4. GASTO\", \"3. INVERSIÓN\", \"1. CUENTAS BANCARIAS\", \"1. SEGMENTACIÓN DE MERCADOS\"], \"k\": 2, \"e\": \"Pág. 5. El material identifica «1. CUENTAS BANCARIAS» con esta descripción: Los consumidores evalúan aspectos como las comisiones, la accesibilidad de los fondos, las tasas de interés y la reputación de la entidad financiera.\", \"p\": 5, \"term\": \"1. CUENTAS BANCARIAS\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Después de evaluar las opciones, el consumidor toma una decisión basada en la percepción del valor del producto y la confianza en la institución financiera.»\", \"o\": [\"3. INVERSIÓN\", \"1. SEGMENTACIÓN DE MERCADOS\", \"1. AHORRO\", \"4. DECISIÓN DE COMPRA\"], \"k\": 3, \"e\": \"Pág. 7. El material identifica «4. DECISIÓN DE COMPRA» con esta descripción: Después de evaluar las opciones, el consumidor toma una decisión basada en la percepción del valor del producto y la confianza en la institución financiera.\", \"p\": 7, \"term\": \"4. DECISIÓN DE COMPRA\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Las decisiones financieras suelen estar cargadas de incertidumbre y riesgo, lo que lleva a los consumidores a ser más cautelosos y analíticos.»\", \"o\": [\"PERCEPCIÓN DEL RIESGO\", \"2. PERSONALIZACIÓN DE OFERTAS FINANCIERAS\", \"4. DECISIÓN DE COMPRA\", \"4. SEGUROS\"], \"k\": 0, \"e\": \"Pág. 3. El material identifica «PERCEPCIÓN DEL RIESGO» con esta descripción: Las decisiones financieras suelen estar cargadas de incertidumbre y riesgo, lo que lleva a los consumidores a ser más cautelosos y analíticos.\", \"p\": 3, \"term\": \"PERCEPCIÓN DEL RIESGO\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El proceso de decisión del consumidor financiero comprende una serie de etapas que guían cómo un individuo elige productos financieros, desde la identificación de una necesidad hasta la evaluación»\", \"o\": [\"Procesos de Decisión del Consumidor Financiero\", \"2. AHORRO\", \"4. DECISIÓN DE COMPRA\", \"4. GASTO\"], \"k\": 0, \"e\": \"Pág. 6. El material identifica «Procesos de Decisión del Consumidor Financiero» con esta descripción: El proceso de decisión del consumidor financiero comprende una serie de etapas que guían cómo un individuo elige productos financieros, desde la identificación de una necesidad hasta la evaluación\", \"p\": 6, \"term\": \"Procesos de Decisión del Consumidor Financiero\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El comportamiento del consumidor está íntimamente ligado a la toma de decisiones financieras, que abarca áreas críticas como el ahorro, la inversión y el gasto.»\", \"o\": [\"2. AHORRO\", \"INFLUENCIA DE FACTORES EXTERNOS\", \"1. AHORRO\", \"1. CUENTAS BANCARIAS\"], \"k\": 2, \"e\": \"Pág. 4. El material identifica «1. AHORRO» con esta descripción: El comportamiento del consumidor está íntimamente ligado a la toma de decisiones financieras, que abarca áreas críticas como el ahorro, la inversión y el gasto.\", \"p\": 4, \"term\": \"1. AHORRO\"}];const letters=['A','B','C','D'];let idx=0,ans=Array(Q.length).fill(null),locked=Array(Q.length).fill(false);function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;')}function render(){let q=Q[idx];document.getElementById('count').textContent=`Pregunta ${idx+1} de ${Q.length}`;document.getElementById('answered').textContent=`${locked.filter(Boolean).length} comprobadas`;document.getElementById('bar').style.width=((idx+1)/Q.length*100)+'%';document.getElementById('stem').textContent=q.q;document.getElementById('options').innerHTML=q.o.map((v,j)=>`<button class=\"opt ${ans[idx]===j?'chosen':''} ${locked[idx]&&j===q.k?'correct':''} ${locked[idx]&&ans[idx]===j&&j!==q.k?'wrong':''}\" ${locked[idx]?'disabled':''} onclick=\"choose(${j})\"><b>${letters[j]}.<\/b> ${esc(v)}<\/button>`).join('');document.getElementById('prev').disabled=idx===0;document.getElementById('check').classList.toggle('hidden',locked[idx]);document.getElementById('check').disabled=ans[idx]===null;document.getElementById('nex e dos o más variables categóricas.»\", \"o\": [\"2. Tablas de Contingencia\", \"1. ERRORES DE ENTRADA\", \"2. VALORES ATÍPICOS\", \"1. INTEGRIDAD DE DATOS\"], \"k\": 0, \"e\": \"Pág. 8. El material identifica «2. Tablas de Contingencia» con esta descripción: Las tablas de contingencia, también conocidas como tablas cruzadas, muestran la relación entre dos o más variables categóricas.\", \"p\": 8, \"term\": \"2. Tablas de Contingencia\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Compara las tablas con los datos originales para asegurar que no haya habido errores en el proceso de tabulación.»\", \"o\": [\"1. TABLAS DE FRECUENCIAS\", \"2. TRANSFERENCIA DE DATOS\", \"1. VALIDACIÓN DE LA TABULACIÓN\", \"Columna de Valores\"], \"k\": 2, \"e\": \"Pág. 7. El material identifica «1. VALIDACIÓN DE LA TABULACIÓN» con esta descripción: Compara las tablas con los datos originales para asegurar que no haya habido errores en el proceso de tabulación.\", \"p\": 7, \"term\": \"1. VALIDACIÓN DE LA TABULACIÓN\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Muestra los diferentes valores o categorías observadas en el conjunto»\", \"o\": [\"Columnas\", \"Columna de Valores\", \"1. INTEGRIDAD DE DATOS\", \"Filas\"], \"k\": 1, \"e\": \"Pág. 8. El material identifica «Columna de Valores» con esta descripción: Muestra los diferentes valores o categorías observadas en el conjunto\", \"p\": 8, \"term\": \"Columna de Valores\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Agrupa los datos en categorías significativas para facilitar el análisis.»\", \"o\": [\"2. CREACIÓN DE CATEGORÍAS\", \"Columnas\", \"1. ERRORES DE ENTRADA\", \"Celdas\"], \"k\": 0, \"e\": \"Pág. 4. El material identifica «2. CREACIÓN DE CATEGORÍAS» con esta descripción: Agrupa los datos en categorías significativas para facilitar el análisis.\", \"p\": 4, \"term\": \"2. CREACIÓN DE CATEGORÍAS\"}, {\"q\": \"Según el documento,
