const DATA=[{"html": "<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Simulador ECP 2026 — Semana 2<\/title><style>body{margin:0;background:#f2f5fa;color:#17243c;font-family:system-ui,Segoe UI,Arial}main{max-width:790px;margin:35px auto;padding:0 16px}.card{background:white;border:1px solid #dce3ef;border-radius:18px;padding:26px;margin:15px 0;box-shadow:0 4px 18px #12294b0c}h1{font-size:28px;margin:0 0 12px}.meta{color:#56667c;line-height:1.7}.tag{display:inline-block;background:#eaf1ff;color:#204c8e;padding:6px 11px;border-radius:99px;font-size:13px;font-weight:650}#progress{height:8px;background:#e5eaf2;border-radius:20px;overflow:hidden;margin:17px 0}#bar{height:100%;background:#205ab5;width:0}h2{font-size:21px;line-height:1.4}.opt{display:block;border:1px solid #d4dce8;border-radius:12px;padding:13px 15px;margin:9px 0;cursor:pointer}.opt:hover{background:#f5f8ff}.opt:has(input:checked){border-color:#3165b4;background:#eff5ff}.opt.locked{cursor:default}.opt.good{border-color:#19815c;background:#eaf8f0}.opt.bad{border-color:#bd4545;background:#fff0ef}input{margin-right:10px}button{border:0;background:#2459a7;color:white;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:650}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e9eef7;color:#19365f}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}.feedback{border-radius:10px;background:#f1f5fb;padding:15px;margin-top:16px;line-height:1.55}.small{font-size:13px;color:#5c6a7d}.score{font-size:50px;font-weight:800;color:#1e569c}.review{border-top:1px solid #e0e6ef;padding:14px 0}.hidden{display:none}a{color:#2459a7}@media(max-width:500px){h1{font-size:23px}.card{padding:18px}}<\/style><\/head><body><main><section class=\"card\"><span class=\"tag\">ÁREA BANCARIA FINANCIERA · TEMA 1: GESTIÓN DEL RIESGO BANCARIO<\/span><h1>Simulador ECP 2026 — Semana 2<\/h1><div class=\"meta\"><b>Documento:<\/b> Procesos de evaluación crediticia y modelos de scoring<br><b>Lectura oficial:<\/b> páginas 7–14 · <b>Preguntas:<\/b> <span id=\"count\"><\/span><br><b>Fuente:<\/b> documento proporcionado para el ECP 2026<\/div><p class=\"small\">Elige una opción. La respuesta se verifica solo después de marcarla y presionar «Comprobar respuesta». Una vez comprobada, queda bloqueada. Al terminar obtendrás calificación y revisión con referencias a las páginas.<\/p><\/section><section class=\"card\" id=\"exam\"><div id=\"status\" class=\"small\"><\/div><div id=\"progress\"><div id=\"bar\"><\/div><\/div><div id=\"question\"><\/div><div id=\"feedback\"><\/div><div class=\"controls\"><button class=\"secondary\" id=\"prev\">← Anterior<\/button><button id=\"check\">Comprobar respuesta<\/button><button id=\"next\" class=\"secondary\">Siguiente →<\/button><\/div><\/section><section class=\"card hidden\" id=\"results\"><\/section><\/main><script>const Q=[{\"p\": 7, \"q\": \"¿Cuál es el propósito central de la evaluación crediticia?\", \"o\": [\"Determinar la capacidad de cumplir obligaciones de pago\", \"Estimar exclusivamente el valor de los activos\", \"Asignar automáticamente una tasa única\", \"Clasificar prospectos por territorio\"], \"k\": 0, \"e\": \"La evaluación recopila y analiza información financiera y no financiera para determinar capacidad de pago.\"}, {\"p\": 8, \"q\": \"¿Qué información corresponde a la solicitud inicial de crédito?\", \"o\": [\"Tasación y liquidación de garantías\", \"Datos del solicitante, monto y propósito\", \"Informe final y decisión del comité\", \"Validación de un modelo estadístico\"], \"k\": 1, \"e\": \"La solicitud inicial contiene datos personales o comerciales, monto y propósito.\"}, {\"p\": 8, \"q\": \"¿Qué documento permite revisar patrones de flujo de efectivo y manejo financiero?\", \"o\": [\"Declaraciones de impuestos\", \"Historial laboral\", \"Extractos bancarios\", \"Informe de garantías\"], \"k\": 2, \"e\": \"Los extractos bancarios permiten evaluar manejo financiero y patrones de flujo de efectivo.\"}, {\"p\": 8, \"q\": \"¿Qué información verifican las declaraciones de impuestos?\", \"o\": [\"Valor de mercado de garantías\", \"Edad del solicitante\", \"Segmento geográfico\", \"Ingresos y obligaciones fiscales\"], \"k\": 3, \"e\": \"El documento atribuye a las declaraciones de impuestos la verificación de ingresos y obligaciones fiscales.\"}, {\"p\": 8, \"q\": \"¿Cuál es el objetivo de verificar el historial crediticio?\", \"o\": [\"Examinar pagos anteriores, deudas y morosidades\", \"Identificar solo la edad del solicitante\", \"Calcular únicamente el valor de garantías\", \"Determinar el costo de publicidad\"], \"k\": 0, \"e\": \"La revisión del historial analiza manejo previo de créditos, deudas e incumplimientos.\"}, {\"p\": 8, \"q\": \"En el análisis financiero, ¿qué indicadores menciona expresamente el material?\", \"o\": [\"Participación de mercado y tasa de conversión\", \"Deuda a ingresos y cobertura de intereses\", \"Rotación comercial y satisfacción\", \"Alcance digital y frecuencia de compra\"], \"k\": 1, \"e\": \"Se citan ratio de deuda a ingresos y ratio de cobertura de intereses.\"}, {\"p\": 8, \"q\": \"¿Por qué se evalúa el flujo de efectivo del prestatario?\", \"o\": [\"Para identificar su ocupación\", \"Para medir satisfacción comercial\", \"Para establecer capacidad de generar ingresos y cubrir gastos operativos\", \"Para sustituir el historial crediticio\"], \"k\": 2, \"e\": \"El flujo de efectivo ayuda a determinar solvencia y capacidad de atender obligaciones.\"}, {\"p\": 9, \"q\": \"¿Qué papel tiene la garantía dentro de la evaluación crediticia?\", \"o\": [\"Es la única condición para prestar\", \"Elimina la necesidad de análisis financiero\", \"Sustituye el historial de pagos\", \"Constituye una fuente secundaria de pago\"], \"k\": 3, \"e\": \"La garantía se analiza como fuente secundaria de pago ante incumplimiento.\"}, {\"p\": 9, \"q\": \"¿Qué dos elementos se examinan en la evaluación de garantías?\", \"o\": [\"Valor y calidad, incluida su liquidez de mercado\", \"Únicamente nombre y antigüedad del cliente\", \"Solo los ingresos del garante\", \"Exclusivamente el monto solicitado\"], \"k\": 0, \"e\": \"El material menciona tasaciones profesionales y análisis del mercado para determinar liquidez.\"}, {\"p\": 9, \"q\": \"¿Qué debe contener el informe de evaluación crediticia?\", \"o\": [\"Solo un puntaje sin contexto\", \"Resumen financiero, riesgo y recomendaciones de términos\", \"Únicamente el monto de préstamo\", \"Solo la clasificación demográfica\"], \"k\": 1, \"e\": \"El informe resume hallazgos, riesgo y recomendaciones sobre términos y condiciones.\"}, {\"p\": 9, \"q\": \"¿Cuáles son resultados posibles de la decisión final?\", \"o\": [\"Solo aprobación total\", \"Solo aprobación o reestructuración\", \"Aprobación total o parcial, o rechazo\", \"Solo rechazo por falta de garantías\"], \"k\": 2, \"e\": \"La decisión puede consistir en aprobación total, parcial o rechazo según análisis.\"}, {\"p\": 9, \"q\": \"¿Qué categorías de variables incluye el scoring descrito?\", \"o\": [\"Únicamente garantías y publicidad\", \"Solo ubicación de la agencia\", \"Solo número de productos contratados\", \"Historial crediticio, situación financiera y características demográficas\"], \"k\": 3, \"e\": \"El texto agrupa factores en historial crediticio, situación financiera y características demográficas.\"}, {\"p\": 10, \"q\": \"En el ejemplo de escala alfabética del material, ¿qué representa A+?\", \"o\": [\"Riesgo bajo\", \"Riesgo alto\", \"Impago confirmado\", \"Ausencia de datos\"], \"k\": 0, \"e\": \"La escala ilustrativa va de A+ (bajo riesgo) a E (alto riesgo).\"}, {\"p\": 10, \"q\": \"¿Qué decisiones puede apoyar el puntaje crediticio?\", \"o\": [\"Solo el presupuesto comercial\", \"Elegibilidad, tasas y términos del préstamo\", \"Solo el monto de depósitos\", \"Únicamente la selección de agencias\"], \"k\": 1, \"e\": \"El puntaje ayuda a definir elegibilidad, tasas de interés y términos del préstamo.\"}, {\"p\": 10, \"q\": \"¿Qué tecnologías se mencionan para automatizar el scoring?\", \"o\": [\"Solo hojas de cálculo manuales\", \"Solo entrevistas presenciales\", \"Inteligencia artificial y aprendizaje automático\", \"Únicamente tasaciones externas\"], \"k\": 2, \"e\": \"El texto menciona IA y aprendizaje automático para procesar datos y actualizar estimaciones.\"}, {\"p\": 10, \"q\": \"¿Cómo se relacionan evaluación crediticia y scoring?\", \"o\": [\"Son procesos idénticos y excluyentes\", \"El scoring sustituye toda revisión documental\", \"La evaluación solo mide características demográficas\", \"La evaluación integral se complementa con una medida cuantitativa de riesgo\"], \"k\": 3, \"e\": \"El scoring complementa la evaluación integral con una cuantificación del riesgo.\"}, {\"p\": 10, \"q\": \"¿Qué buscan predecir los algoritmos de credit scoring?\", \"o\": [\"Probabilidad de incumplimiento\", \"Rentabilidad de campañas publicitarias\", \"Número de sucursales futuras\", \"Variación de inventarios de agencias\"], \"k\": 0, \"e\": \"Clasifican solicitantes por riesgo a partir de datos históricos y actuales.\"}, {\"p\": 11, \"q\": \"¿Qué escala numérica se presenta como ejemplo para FICO?\", \"o\": [\"0 a 100\", \"300 a 850\", \"1 a 10\", \"500 a 1500\"], \"k\": 1, \"e\": \"El documento ofrece 300 a 850 como ejemplo de rango FICO.\"}, {\"p\": 11, \"q\": \"¿Qué expresa la probabilidad de incumplimiento (PD)?\", \"o\": [\"Rentabilidad del producto\", \"Proporción de depósitos renovados\", \"Posibilidad de que el prestatario incumpla en un período determinado\", \"Probabilidad de captar un nuevo cliente\"], \"k\": 2, \"e\": \"PD estima el incumplimiento en un período determinado.\"}, {\"p\": 11, \"q\": \"Un banco estudia una solicitud nueva y sus condiciones. ¿Qué tipo de modelo corresponde?\", \"o\": [\"Modelo de comportamiento\", \"ANOVA de clientes activos\", \"Modelo de seguimiento de mora\", \"Modelo de aprobación o evaluación\"], \"k\": 3, \"e\": \"Los modelos de aprobación evalúan nuevas solicitudes y condiciones de otorgamiento.\"}, {\"p\": 11, \"q\": \"Un banco monitorea a sus deudores vigentes para anticipar problemas. ¿Qué modelo utiliza?\", \"o\": [\"Modelo de comportamiento\", \"Modelo exclusivo de admisión\", \"Segmentación de mercado\", \"Modelo de garantías\"], \"k\": 0, \"e\": \"El modelo de comportamiento observa prestatarios existentes en el tiempo.\"}, {\"p\": 11, \"q\": \"¿Qué diferencia destaca el material entre modelos basados en datos y tradicionales?\", \"o\": [\"Los tradicionales usan únicamente entrevistas\", \"Los basados en datos incorporan minería de datos, IA y aprendizaje automático\", \"Los basados en datos no utilizan información histórica\", \"Los tradicionales solo evalúan garantías\"], \"k\": 1, \"e\": \"Los modelos basados en datos utilizan técnicas avanzadas; los tradicionales incluyen regresión logística y análisis discriminante.\"}, {\"p\": 11, \"q\": \"¿Cómo clasifica solicitantes el análisis discriminante?\", \"o\": [\"Según una tasa fija común\", \"Según la ubicación de las agencias\", \"Mediante función discriminante y punto de corte\", \"Por orden de presentación de solicitud\"], \"k\": 2, \"e\": \"Combina variables explicativas en un puntaje que se compara con un punto de corte.\"}, {\"p\": 12, \"q\": \"¿Para qué tipo de resultado se utiliza la regresión logística según el texto?\", \"o\": [\"Solo series de precios\", \"Únicamente inventarios\", \"Solo valoración de garantías\", \"Probabilidad de un evento binario, como incumplir o no\"], \"k\": 3, \"e\": \"La regresión logística modela probabilidades de eventos binarios.\"}, {\"p\": 12, \"q\": \"¿Qué diferencia de supuesto estadístico menciona el documento entre análisis discriminante y regresión logística?\", \"o\": [\"La regresión logística no requiere el supuesto de normalidad indicado para el discriminante\", \"La regresión logística requiere necesariamente normalidad\", \"Ambos exigen exclusivamente variables cualitativas\", \"Ninguno utiliza variables explicativas\"], \"k\": 0, \"e\": \"El texto contrasta la normalidad supuesta en el discriminante con la regresión logística, que no la requiere.\"}, {\"p\": 12, \"q\": \"¿Qué interpretación tienen los coeficientes de una regresión logística?\", \"o\": [\"Describen el valor tasado de una garantía\", \"Indican cambios en la probabilidad de incumplimiento ante cambios de variables\", \"Representan siempre el monto del préstamo\", \"Miden únicamente la cantidad de sucursales\"], \"k\": 1, \"e\": \"Los coeficientes indican cómo cambia la probabilidad con las variables explicativas.\"}, {\"p\": 12, \"q\": \"¿Cuál es la función del ANOVA en el contexto del scoring descrito?\", \"o\": [\"Asignar directamente la tasa final\", \"Calcular el valor de cada garantía\", \"Comparar medias e identificar variables relevantes entre grupos\", \"Sustituir el historial crediticio\"], \"k\": 2, \"e\": \"ANOVA compara medias entre grupos; el texto aclara que no se usa directamente como modelo de scoring.\"}, {\"p\": 12, \"q\": \"¿Qué supuestos menciona el documento para ANOVA?\", \"o\": [\"Ausencia de variables independientes\", \"Distribuciones siempre binarias\", \"Inexistencia de variaciones entre grupos\", \"Normalidad de datos y homogeneidad de variaciones\"], \"k\": 3, \"e\": \"El documento menciona normalidad y homogeneidad de variaciones.\"}, {\"p\": 13, \"q\": \"¿Para qué se describe el uso de regresión lineal en riesgo crediticio?\", \"o\": [\"Establecer relaciones lineales iniciales entre variables y resultados\", \"Clasificar automáticamente toda solicitud como aprobada\", \"Comparar solo medias de grupos\", \"Reemplazar la recopilación de datos\"], \"k\": 0, \"e\": \"El texto indica que regresión lineal simple o múltiple puede modelar relaciones entre variables y resultados crediticios.\"}, {\"p\": 13, \"q\": \"En el ejemplo de regresión lineal, ¿qué podría ser una variable dependiente?\", \"o\": [\"Duración del crédito\", \"Monto del incumplimiento\", \"Ingreso del solicitante\", \"Edad del solicitante\"], \"k\": 1, \"e\": \"El texto usa monto del incumplimiento como ejemplo de dependiente; ingresos y duración como independientes.\"}, {\"p\": 13, \"q\": \"¿Qué se hace al preparar datos para construir un scoring?\", \"o\": [\"Implementar sin entrenamiento\", \"Descartar toda observación histórica\", \"Clasificar solicitantes anteriores como buenos o malos según su cumplimiento\", \"Definir tasas de interés sin datos\"], \"k\": 2, \"e\": \"La preparación incluye datos históricos etiquetados por cumplimiento.\"}, {\"p\": 13, \"q\": \"¿Qué busca el análisis exploratorio durante la construcción del modelo?\", \"o\": [\"Asignar garantías a todos los clientes\", \"Omitir relaciones entre variables\", \"Tomar la decisión crediticia final\", \"Identificar patrones y relaciones entre variables\"], \"k\": 3, \"e\": \"El análisis exploratorio identifica patrones y relaciones en los datos.\"}, {\"p\": 13, \"q\": \"¿Cuál es la finalidad de seleccionar variables?\", \"o\": [\"Elegir las más relevantes para el incumplimiento\", \"Conservar solo las demográficas\", \"Excluir todas las financieras\", \"Sustituir la validación\"], \"k\": 0, \"e\": \"La selección identifica variables financieras y no financieras relevantes para incumplimiento.\"}, {\"p\": 13, \"q\": \"¿Qué técnicas se citan para construir el modelo?\", \"o\": [\"Solo tasaciones de inmuebles\", \"Regresión logística, árboles de decisión y redes neuronales\", \"Únicamente encuestas comerciales\", \"Solo análisis de depósitos\"], \"k\": 1, \"e\": \"El documento cita esas técnicas como ejemplos de construcción.\"}, {\"p\": 13, \"q\": \"¿Cómo se valida el modelo de scoring?\", \"o\": [\"Usando exclusivamente las solicitudes nuevas sin comparación\", \"Aprobando todos los créditos de prueba\", \"Probándolo con un conjunto diferente de datos para evaluar capacidad predictiva\", \"Eliminando el ajuste de parámetros\"], \"k\": 2, \"e\": \"La validación usa datos distintos para evaluar predicción y ajustar parámetros si hace falta.\"}, {\"p\": 14, \"q\": \"¿Qué ocurre después de validar el modelo?\", \"o\": [\"Se descarta el análisis\", \"Se inicia desde cero sin conservar datos\", \"Se convierte en garantía real\", \"Se implementa para evaluar nuevas solicitudes\"], \"k\": 3, \"e\": \"Tras la validación se implementa el modelo en el sistema.\"}, {\"p\": 14, \"q\": \"¿Cuál es una ventaja de la automatización del scoring según el texto?\", \"o\": [\"Decisiones más rápidas y eficientes\", \"Desaparición total del impago\", \"Eliminación de toda información histórica\", \"Aprobación obligatoria de todos los créditos\"], \"k\": 0, \"e\": \"El texto destaca eficiencia y rapidez en la toma de decisiones.\"}, {\"p\": 14, \"q\": \"¿Cómo contribuye el scoring a la experiencia del cliente?\", \"o\": [\"Eliminando toda revisión de elegibilidad\", \"Facilitando respuestas más ágiles sobre elegibilidad\", \"Reemplazando las condiciones del crédito\", \"Evitando cualquier actualización de modelos\"], \"k\": 1, \"e\": \"Una evaluación más ágil permite respuestas más rápidas.\"}, {\"p\": 14, \"q\": \"¿Qué significa adaptabilidad de los modelos de scoring?\", \"o\": [\"Mantener parámetros inalterables\", \"Usar únicamente datos demográficos\", \"Ajustarse a cambios de mercado y tendencias económicas\", \"Aplicar siempre la misma tasa\"], \"k\": 2, \"e\": \"El texto señala ajustes ante comportamiento del mercado y tendencias económicas.\"}, {\"p\": 14, \"q\": \"¿Qué equilibrio busca el scoring en las instituciones financieras?\", \"o\": [\"Maximizar aprobaciones sin revisar riesgo\", \"Reducir el número de solicitantes\", \"Priorizar exclusivamente velocidad de atención\", \"Otorgar créditos y gestionar eficazmente el riesgo\"], \"k\": 3, \"e\": \"El material destaca decisiones informadas que equilibran colocación y gestión del riesgo.\"  class=\"stem\" id=\"stem\"><\/div><div id=\"options\"><\/div><div id=\"feedback\" class=\"feedback hidden\"><\/div><div class=\"actions\"><button class=\"act secondary\" id=\"prev\" onclick=\"prev()\">← Anterior<\/button><button class=\"act\" id=\"check\" onclick=\"check()\">Comprobar respuesta<\/button><button class=\"act hidden\" id=\"next\" onclick=\"next()\">Siguiente →<\/button><\/div><\/section><section class=\"box hidden\" id=\"results\"><h2>Resultado del simulador<\/h2><div class=\"score\" id=\"score\"><\/div><p id=\"summary\" style=\"text-align:center\"><\/p><div class=\"actions\"><button class=\"act secondary\" onclick=\"restart()\">Repetir<\/button><button class=\"act\" onclick=\"window.print()\">Imprimir revisión<\/button><\/div><h2>Respuestas explicadas<\/h2><div id=\"review\"><\/div><\/section><footer>Preguntas basadas únicamente en el documento del curso y páginas indicadas. Funciona sin conexión.<\/footer><\/div><script>\nconst Q=[{\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El Valor en Riesgo (VaR) es un método estadístico que estima la pérdida máxima esperada en un portafolio bancario debido a movimientos adversos en tasas de interés, dentro de un horizonte»\", \"o\": [\"Medición del Riesgo de Tasas\", \"Préstamos a tasa variable\", \"3. Valor en Riesgo (VaR)\", \"3. Crecimiento Económico\"], \"k\": 2, \"e\": \"Pág. 11. El material identifica «3. Valor en Riesgo (VaR)» con esta descripción: El Valor en Riesgo (VaR) es un método estadístico que estima la pérdida máxima esperada en un portafolio bancario debido a movimientos adversos en tasas de interés, dentro de un horizonte\", \"p\": 11, \"term\": \"3. Valor en Riesgo (VaR)\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Ocurre cuando las tasas de interés de los activos y pasivos no se mueven en la misma proporción o no están perfectamente correlacionadas»\", \"o\": [\"Ejemplo del impacto de la duración\", \"3. Riesgo de Base\", \"Activos Sensibles a Tasas de Interés\", \"Supervisión del Mercado Crediticio\"], \"k\": 1, \"e\": \"Pág. 3. El material identifica «3. Riesgo de Base» con esta descripción: Ocurre cuando las tasas de interés de los activos y pasivos no se mueven en la misma proporción o no están perfectamente correlacionadas\", \"p\": 3, \"term\": \"3. Riesgo de Base\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Este riesgo surge debido a la estructura de vencimientos y sensibilidad a las tasas de interés de los productos bancarios, tales como préstamos, depósitos y derivados financieros»\", \"o\": [\"Naturaleza del Riesgo de Tasas de Interés\", \"Ejemplo del impacto de la convexidad\", \"2. Duración y Convexidad\", \"Regulaciones Financieras\"], \"k\": 0, \"e\": \"Pág. 2. El material identifica «Naturaleza del Riesgo de Tasas de Interés» con esta descripción: Este riesgo surge debido a la estructura de vencimientos y sensibilidad a las tasas de interés de los productos bancarios, tales como préstamos, depósitos y derivados financieros\", \"p\": 2, \"term\": \"Naturaleza del Riesgo de Tasas de Interés\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Puede subestimar eventos extremos si se basa en distribuciones normales No considera riesgos fuera del horizonte temporal definido»\", \"o\": [\"Ejemplo del impacto de la convexidad\", \"Préstamos a tasa variable\", \"Desventajas\", \"2. Diversificación de Cartera\"], \"k\": 2, \"e\": \"Pág. 12. El material identifica «Desventajas» con esta descripción: Puede subestimar eventos extremos si se basa en distribuciones normales No considera riesgos fuera del horizonte temporal definido\", \"p\": 12, \"term\": \"Desventajas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Son obligaciones financieras cuyo costo varía en función de las tasas de interés del mercado»\", \"o\": [\"Naturaleza del Riesgo de Tasas de Interés\", \"Cartera de inversión a tasa flotante\", \"Requisitos de Capital Adicional\", \"Pasivos Sensibles a Tasas de Interés\"], \"k\": 3, \"e\": \"Pág. 5. El material identifica «Pasivos Sensibles a Tasas de Interés» con esta descripción: Son obligaciones financieras cuyo costo varía en función de las tasas de interés del mercado\", \"p\": 5, \"term\": \"Pasivos Sensibles a Tasas de Interés\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El Efecto Fisher es un principio económico formulado por el economista Irving Fisher, que establece que la tasa de interés nominal es igual a la suma de la tasa de interés real y la tasa de inflación»\", \"o\": [\"2. Efecto Fisher\", \"3. Crecimiento Económico\", \"Protección al Consumidor Financiero\", \"2. Duración y Convexidad\"], \"k\": 0, \"e\": \"Pág. 15. El material identifica «2. Efecto Fisher» con esta descripción: El Efecto Fisher es un principio económico formulado por el economista Irving Fisher, que establece que la tasa de interés nominal es igual a la suma de la tasa de interés real y la tasa de inflación\", \"p\": 15, \"term\": \"2. Efecto Fisher\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Una inflación alta suele llevar a un incremento en las tasas de interés para evitar la pérdida del poder adquisitivo del dinero»\", \"o\": [\"enfoques clave\", \"2. Inflación\", \"Ventajas de las coberturas con derivados\", \"Desventajas\"], \"k\": 1, \"e\": \"Pág. 2. El material identifica «2. Inflación» con esta descripción: Una inflación alta suele llevar a un incremento en las tasas de interés para evitar la pérdida del poder adquisitivo del dinero\", \"p\": 2, \"term\": \"2. Inflación\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Métodos de Sensibilización, Análisis de Brechas (Gap Analysis) y Valor en Riesgo»\", \"o\": [\"enfoques clave\", \"3. Crecimiento Económico\", \"2. Duración y Convexidad\", \"2. Efecto Fisher\"], \"k\": 0, \"e\": \"Pág. 10. El material identifica «enfoques clave» con esta descripción: Métodos de Sensibilización, Análisis de Brechas (Gap Analysis) y Valor en Riesgo\", \"p\": 10, \"term\": \"enfoques clave\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «el banco es sensible a una baja en tasas de interés (mayores activos sensibles a tasa que pasivos)»\", \"o\": [\"3. Supervisión Bancaria\", \"Ventajas de las coberturas con derivados\", \"Si el GAP es positivo\", \"Impacto en el Balance General\"], \"k\": 2, \"e\": \"Pág. 11. El material identifica «Si el GAP es positivo» con esta descripción: el banco es sensible a una baja en tasas de interés (mayores activos sensibles a tasa que pasivos)\", \"p\": 11, \"term\": \"Si el GAP es positivo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Dos bonos con la misma duración pueden reaccionar de manera diferente a los cambios en la tasa de interés debido a su convexidad.»\", \"o\": [\"Ejemplo del impacto de la convexidad\", \"2. Riesgo de Curva de Rendimiento\", \"Regulaciones Financieras\", \"Supervisión del Mercado Crediticio\"], \"k\": 0, \"e\": \"Pág. 6. El material identifica «Ejemplo del impacto de la convexidad» con esta descripción: Dos bonos con la misma duración pueden reaccionar de manera diferente a los cambios en la tasa de interés debido a su convexidad.\", \"p\": 6, \"term\": \"Ejemplo del impacto de la convexidad\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Su rendimiento cambia en respuesta a variaciones en las tasas de referencia (por ejemplo, LIBOR, SOFR o TIIE)»\", \"o\": [\"3. Valor en Riesgo (VaR)\", \"Préstamos a tasa variable\", \"Regulaciones Financieras\", \"Duración Macaulay\"], \"k\": 1, \"e\": \"Pág. 4. El material identifica «Préstamos a tasa variable» con esta descripción: Su rendimiento cambia en respuesta a variaciones en las tasas de referencia (por ejemplo, LIBOR, SOFR o TIIE)\", \"p\": 4, \"term\": \"Préstamos a tasa variable\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Los bancos centrales, como la Reserva Federal (EE.UU.) o el Banco Central Europeo, ajustan las tasas de interés de referencia para controlar la inflación, fomentar el crecimiento»\", \"o\": [\"Duración Macaulay\", \"2. Análisis de Brechas (Gap Analysis)\", \"1. Política Monetaria del Banco Central\", \"3. Crecimiento Económico\"], \"k\": 2, \"e\": \"Pág. 2. El material identifica «1. Política Monetaria del Banco Central» con esta descripción: Los bancos centrales, como la Reserva Federal (EE.UU.) o el Banco Central Europeo, ajustan las tasas de interés de referencia para controlar la inflación, fomentar el crecimiento\", \"p\": 2, \"term\": \"1. Política Monetaria del Banco Central\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Restricciones sobre la exposición de los bancos a ciertos sectores o clientes»\", \"o\": [\"5. Expectativas del Mercado\", \"Límites a la Concentración de Riesgo\", \"2. Duración y Convexidad\", \"3. Ajustes en Plazos de Vencimiento\"], \"k\": 1, \"e\": \"Pág. 14. El material identifica «Límites a la Concentración de Riesgo» con esta descripción: Restricciones sobre la exposición de los bancos a ciertos sectores o clientes\", \"p\": 14, \"term\": \"Límites a la Concentración de Riesgo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Permiten mitigar la exposición al riesgo sin alterar directamente los activos y pasivos del»\", \"o\": [\"Impacto en el Balance General\", \"1. Métodos de Sensibilización\", \"Desventajas\", \"Ventajas de las coberturas con derivados\"], \"k\": 3, \"e\": \"Pág. 8. El material identifica «Ventajas de las coberturas con derivados» con esta descripción: Permiten mitigar la exposición al riesgo sin alterar directamente los activos y pasivos del\", \"p\": 8, \"term\": \"Ventajas de las coberturas con derivados\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Indica el tiempo ponderado en el que se recibirán los flujos de efectivo»\", \"o\": [\"Límites a la Concentración de Riesgo\", \"3. Valor en Riesgo (VaR)\", \"Naturaleza del Riesgo de Tasas de Interés\", \"Duración Macaulay\"], \"k\": 3, \"e\": \"Pág. 5. El material identifica «Duración Macaulay» con esta descripción: Indica el tiempo ponderado en el que se recibirán los flujos de efectivo\", \"p\": 5, \"term\": \"Duración Macaulay\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Para medir el impacto de los cambios en las tasas de interés en los activos y pasivos de un banco se utilizan las métricas de duración y convexidad»\", \"o\": [\"Naturaleza del Riesgo de Tasas de Interés\", \"2. Duración y Convexidad\", \"Préstamos a tasa variable\", \"Límites a la Concentración de Riesgo\"], \"k\": 1, \"e\": \"Pág. 5. El material identifica «2. Duración y Convexidad» con esta descripción: Para medir el impacto de los cambios en las tasas de interés en los activos y pasivos de un banco se utilizan las métricas de duración y convexidad\", \"p\": 5, \"term\": \"2. Duración y Convexidad\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El balance general de un banco está compuesto principalmente por activos financieros (préstamos inversiones en bonos, reservas de efectivo, etc.) y pasivos financieros (depósitos, deuda emitida»\", \"o\": [\"Impacto en el Balance General\", \"Desventajas\", \"Duración Modificada\", \"Duración Macaulay\"], \"k\": 0, \"e\": \"Pág. 4. El material identifica «Impacto en el Balance General» con esta descripción: El balance general de un banco está compuesto principalmente por activos financieros (préstamos inversiones en bonos, reservas de efectivo, etc.) y pasivos financieros (depósitos, deuda emitida\", \"p\": 4, \"term\": \"Impacto en el Balance General\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Cada país complementa las regulaciones internacionales con normativas locales específicas adaptadas a su realidad económica y financiera.»\", \"o\": [\"2. Normativas Locales\", \"Impacto en el Balance General\", \"2. Duración y Convexidad\", \"1. Política Monetaria del Banco Central\"], \"k\": 0, \"e\": \"Pág. 13. El material identifica «2. Normativas Locales» con esta descripción: Cada país complementa las regulaciones internacionales con normativas locales específicas adaptadas a su realidad económica y financiera.\", \"p\": 13, \"term\": \"2. Normativas Locales\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Se produce cuando los activos y pasivos tienen diferentes vencimientos o períodos de ajuste»\", \"o\": [\"Medición del Riesgo de Tasas\", \"3. Supervisión Bancaria\", \"1. Política Monetaria del Banco Central\", \"1. Riesgo de Repricing (Reasignación de Tasas)\"], \"k\": 3, \"e\": \"Pág. 3. El material identifica «1. Riesgo de Repricing (Reasignación de Tasas)» con esta descripción: Se produce cuando los activos y pasivos tienen diferentes vencimientos o períodos de ajuste\", \"p\": 3, \"term\": \"1. Riesgo de Repricing (Reasignación de Tasas)\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Algunos países imponen regulaciones más estrictas que las de Basilea III»\", \"o\": [\"enfoques clave\", \"3. Gap de Tasas de Interés\", \"Medición del Riesgo de Tasas\", \"Requisitos de Capital Adicional\"], \"k\": 3, \"e\": \"Pág. 14. El material identifica «Requisitos de Capital Adicional» con esta descripción: Algunos países imponen regulaciones más estrictas que las de Basilea III\", \"p\": 14, \"term\": \"Requisitos de Capital Adicional\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Los métodos de sensibilización son técnicas utilizadas para estimar el impacto de cambios en las tasas de interés sobre el valor de los activos y pasivos bancarios.»\", \"o\": [\"Pasivos Sensibles a Tasas de Interés  la guía oficial · 22 preguntas<\/p><\/header><section class=\"box\" id=\"quiz\"><div class=\"meta\"><span id=\"count\"><\/span><span id=\"answered\"><\/span><\/div><div class=\"progress\"><div class=\"bar\" id=\"bar\"><\/div><\/div><div class=\"stem\" id=\"stem\"><\/div><div id=\"options\"><\/div><div id=\"feedback\" class=\"feedback hidden\"><\/div><div class=\"actions\"><button class=\"act secondary\" id=\"prev\" onclick=\"prev()\">← Anterior<\/button><button class=\"act\" id=\"check\" onclick=\"check()\">Comprobar respuesta<\/button><button class=\"act hidden\" id=\"next\" onclick=\"next()\">Siguiente →<\/button><\/div><\/section><section class=\"box hidden\" id=\"results\"><h2>Resultado del simulador<\/h2><div class=\"score\" id=\"score\"><\/div><p id=\"summary\" style=\"text-align:center\"><\/p><div class=\"actions\"><button class=\"act secondary\" onclick=\"restart()\">Repetir<\/button><button class=\"act\" onclick=\"window.print()\">Imprimir revisión<\/button><\/div><h2>Respuestas explicadas<\/h2><div id=\"review\"><\/div><\/section><footer>Preguntas basadas únicamente en el documento del curso y páginas indicadas. Funciona sin conexión.<\/footer><\/div><script>\nconst Q=[{\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Debe tener mucho cuidado al publicar cosas en las redes sociales Evite el uso de información personal como nombres o direcciones de correo electrónico. en espacios públicos, respetar la privacidad»\", \"o\": [\"Las contraseñas\", \"En términos generales, se recomienda lo siguiente\", \"3. Suplantación de identidad\", \"Medios de comunicación social\"], \"k\": 3, \"e\": \"Pág. 4. El material identifica «Medios de comunicación social» con esta descripción: Debe tener mucho cuidado al publicar cosas en las redes sociales Evite el uso de información personal como nombres o direcciones de correo electrónico. en espacios públicos, respetar la privacidad\", \"p\": 4, \"term\": \"Medios de comunicación social\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «los estafadores pueden hacerse pasar por una empresa o proveedor de servicios para engañar a las víctimas para que envíen dinero a cuentas bancarias falsas»\", \"o\": [\"Ataque organizado\", \"Correos electrónicos\", \"Uso fraudulento de fondos\", \"CUI, cuentas bancarias, etc\"], \"k\": 2, \"e\": \"Pág. 10. El material identifica «Uso fraudulento de fondos» con esta descripción: los estafadores pueden hacerse pasar por una empresa o proveedor de servicios para engañar a las víctimas para que envíen dinero a cuentas bancarias falsas\", \"p\": 10, \"term\": \"Uso fraudulento de fondos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «cualquier atacante podría intentar traspasar la seguridad de un banco, empresa u organización para recopilar información personal del cliente y luego obtener acceso a un recurso de la empresa»\", \"o\": [\"Personal\", \"Correos electrónicos\", \"Ataque organizado\", \"Análisis del sitio web\"], \"k\": 2, \"e\": \"Pág. 3. El material identifica «Ataque organizado» con esta descripción: cualquier atacante podría intentar traspasar la seguridad de un banco, empresa u organización para recopilar información personal del cliente y luego obtener acceso a un recurso de la empresa\", \"p\": 3, \"term\": \"Ataque organizado\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Si pierdes o te roban tus documentos de identidad, denúncialo de inmediato a la policía y a las autoridades correspondientes (como policía, RENAP y Ministerio Público) para que se tomen las medidas necesarias»\", \"o\": [\"Denuncia el robo o extravío\", \"3. Suplantación de identidad\", \"Comprar cosas en línea\", \"Estafas de soporte técnico\"], \"k\": 0, \"e\": \"Pág. 6. El material identifica «Denuncia el robo o extravío» con esta descripción: Si pierdes o te roban tus documentos de identidad, denúncialo de inmediato a la policía y a las autoridades correspondientes (como policía, RENAP y Ministerio Público) para que se tomen las medidas necesarias\", \"p\": 6, \"term\": \"Denuncia el robo o extravío\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «No permita que nadie los vea y manténgase alejado de las áreas concurridas si planea discutir información personal»\", \"o\": [\"seguros\", \"Comprar cosas en línea\", \"Historiales crediticios y financieros\", \"¿Qué es el robo de identidad?\"], \"k\": 0, \"e\": \"Pág. 6. El material identifica «seguros» con esta descripción: No permita que nadie los vea y manténgase alejado de las áreas concurridas si planea discutir información personal\", \"p\": 6, \"term\": \"seguros\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «los estafadores pueden contactar a los clientes haciéndose pasar por representantes de soporte técnico de una empresa de tecnología para acceder a sus computadoras o datos personales»\", \"o\": [\"Fraude financiero\", \"Educación y concientización\", \"Recursos humanos\", \"Estafas de soporte técnico\"], \"k\": 3, \"e\": \"Pág. 10. El material identifica «Estafas de soporte técnico» con esta descripción: los estafadores pueden contactar a los clientes haciéndose pasar por representantes de soporte técnico de una empresa de tecnología para acceder a sus computadoras o datos personales\", \"p\": 10, \"term\": \"Estafas de soporte técnico\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Hacerse pasar por empresas conocidas y personas es una práctica común de los ciberdelincuentes Ellos tratan de conseguir tus datos personales para actuar ilegalmente en tu nombre y así cometer»\", \"o\": [\"Fraude financiero\", \"3. Suplantación de identidad\", \"Comprar cosas en línea\", \"Educación y concientización\"], \"k\": 1, \"e\": \"Pág. 9. El material identifica «3. Suplantación de identidad» con esta descripción: Hacerse pasar por empresas conocidas y personas es una práctica común de los ciberdelincuentes Ellos tratan de conseguir tus datos personales para actuar ilegalmente en tu nombre y así cometer\", \"p\": 9, \"term\": \"3. Suplantación de identidad\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Doxxing, también conocido como doxing, es un método para obtener información personal sobre una persona, incluido su nombre completo, dirección IP y otros detalles»\", \"o\": [\"Ataque organizado\", \"Doxeo\", \"Fraude financiero\", \"Personal\"], \"k\": 1, \"e\": \"Pág. 3. El material identifica «Doxeo» con esta descripción: Doxxing, también conocido como doxing, es un método para obtener información personal sobre una persona, incluido su nombre completo, dirección IP y otros detalles\", \"p\": 3, \"term\": \"Doxeo\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «La institución puede encontrar útil realizar revisiones manuales adicionales en situaciones en las que los nombres son muy similares para confirmar la identidad del cliente y evitar»\", \"o\": [\"Una palabra de precaución\", \"Revisión manual\", \"Correos electrónicos\", \"Personal\"], \"k\": 1, \"e\": \"Pág. 8. El material identifica «Revisión manual» con esta descripción: La institución puede encontrar útil realizar revisiones manuales adicionales en situaciones en las que los nombres son muy similares para confirmar la identidad del cliente y evitar\", \"p\": 8, \"term\": \"Revisión manual\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «El ladrón puede abrir cuentas bancarias, solicitar créditos o préstamos, o realizar compras fraudulentas a nombre de la víctima utilizando los documentos de identidad que sustrajeron»\", \"o\": [\"Correos electrónicos\", \"3. Suplantación de identidad\", \"Fraude financiero\", \"Personal\"], \"k\": 2, \"e\": \"Pág. 5. El material identifica «Fraude financiero» con esta descripción: El ladrón puede abrir cuentas bancarias, solicitar créditos o préstamos, o realizar compras fraudulentas a nombre de la víctima utilizando los documentos de identidad que sustrajeron\", \"p\": 5, \"term\": \"Fraude financiero\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «esta técnica permite que un atacante obtenga información que garantiza el acceso a un recurso que usa en esa organización, banco o empresa mientras aún pasa por uno»\", \"o\": [\"Recursos humanos\", \"Uso fraudulento de fondos\", \"Correos electrónicos falsos\", \"Medios de comunicación social\"], \"k\": 2, \"e\": \"Pág. 2. El material identifica «Correos electrónicos falsos» con esta descripción: esta técnica permite que un atacante obtenga información que garantiza el acceso a un recurso que usa en esa organización, banco o empresa mientras aún pasa por uno\", \"p\": 2, \"term\": \"Correos electrónicos falsos\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Los homónimos pueden tener problemas con la ley si uno de ellos tiene deudas impagas u otras obligaciones legales porque la otra persona con el mismo nombre podría confundirlos entre sí»\", \"o\": [\"Capacitación para empleados\", \"Procedimientos legales\", \"Doxeo\", \"Medios de comunicación social\"], \"k\": 1, \"e\": \"Pág. 7. El material identifica «Procedimientos legales» con esta descripción: Los homónimos pueden tener problemas con la ley si uno de ellos tiene deudas impagas u otras obligaciones legales porque la otra persona con el mismo nombre podría confundirlos entre sí\", \"p\": 7, \"term\": \"Procedimientos legales\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «utilizando los documentos robados, el ladrón puede hacerse pasar por la víctima y cometer otros delitos, como presentar reclamaciones de seguros falsas, realizar transacciones fraudulentas o cometer fraude fiscal»\", \"o\": [\"Correos electrónicos\", \"Revisión manual\", \"Phishing\", \"Recursos humanos\"], \"k\": 2, \"e\": \"Pág. 5. El material identifica «Phishing» con esta descripción: utilizando los documentos robados, el ladrón puede hacerse pasar por la víctima y cometer otros delitos, como presentar reclamaciones de seguros falsas, realizar transacciones fraudulentas o cometer fraude fiscal\", \"p\": 5, \"term\": \"Phishing\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Deben tener al menos 8 caracteres y contener una combinación aleatoria de cifras letras y números para que sean seguras»\", \"o\": [\"Comunicación segura\", \"Las contraseñas\", \"Comunicación que sea clara\", \"Historiales crediticios y financieros\"], \"k\": 1, \"e\": \"Pág. 3. El material identifica «Las contraseñas» con esta descripción: Deben tener al menos 8 caracteres y contener una combinación aleatoria de cifras letras y números para que sean seguras\", \"p\": 3, \"term\": \"Las contraseñas\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Verifique que la URL sea precisa y que el sitio tenga certificados de seguridad antes de realizar una compra en línea o enviar información personal a un sitio web»\", \"o\": [\"Historiales crediticios y financieros\", \"Comunicación que sea clara\", \"Análisis del sitio web\", \"Comunicación con el cliente\"], \"k\": 2, \"e\": \"Pág. 10. El material identifica «Análisis del sitio web» con esta descripción: Verifique que la URL sea precisa y que el sitio tenga certificados de seguridad antes de realizar una compra en línea o enviar información personal a un sitio web\", \"p\": 10, \"term\": \"Análisis del sitio web\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Los homónimos pueden tener el mismo nombre en los informes crediticios, lo que puede tener un impacto en los historiales crediticios de una o ambas personas si una o ambas no realizan un pago»\", \"o\": [\"Procedimientos legales\", \"Robo de identidad\", \"Historiales crediticios y financieros\", \"Recursos humanos\"], \"k\": 2, \"e\": \"Pág. 7. El material identifica «Historiales crediticios y financieros» con esta descripción: Los homónimos pueden tener el mismo nombre en los informes crediticios, lo que puede tener un impacto en los historiales crediticios de una o ambas personas si una o ambas no realizan un pago\", \"p\": 7, \"term\": \"Historiales crediticios y financieros\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Asegúrese de dar a los clientes una explicación detallada de la importancia de dar al banco información precisa y actual»\", \"o\": [\"Doxeo\", \"Educación y concientización\", \"Comunicación que sea clara\", \"Revisión manual\"], \"k\": 2, \"e\": \"Pág. 8. El material identifica «Comunicación que sea clara» con esta descripción: Asegúrese de dar a los clientes una explicación detallada de la importancia de dar al banco información precisa y actual\", \"p\": 8, \"term\": \"Comunicación que sea clara\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «También se deben cambiar las contraseñas de las cuentas que no se ven afectadas Informe a las personas apropiadas sobre el evento»\", \"o\": [\"CUI, cuentas bancarias, etc\", \"Phishing\", \"En términos generales, se recomienda lo siguiente\", \"Personal\"], \"k\": 2, \"e\": \"Pág. 5. El material identifica «En términos generales, se recomienda lo siguiente» con esta descripción: También se deben cambiar las contraseñas de las cuentas que no se ven afectadas Informe a las personas apropiadas sobre el evento\", \"p\": 5, \"term\": \"En términos generales, se recomienda lo siguiente\"}, {\"q\": \"Según el documento, ¿a qué concepto corresponde esta descripción? «Cuando se trata de gestionar nóminas y trámites relacionados con el personal pueden surgir complicaciones laborales si existen homónimos en una empresa o institución»\", \"o\": [\"Comunicación segura\", \"3. Suplantación de identidad\", \"CUI, cuentas bancarias, etc\", \"Recursos humanos\"], \"k cument.getElementById('summary').textContent=`${correct} de ${Q.length} respuestas correctas`;document.getElementById('review').innerHTML=Q.map((q,i)=>`<div class=\"review\"><b>${i+1}. ${esc(q.q)}<\/b><div class=\"${ans[i]===q.k?'good':'bad'}\">Tu respuesta: ${letters[ans[i]]}. ${esc(q.o[ans[i]])}<\/div>${ans[i]===q.k?'':`<div class=\"good\">Correcta: ${letters[q.k]}. ${esc(q.o[q.k])}<\/div>`}<div>${esc(q.e)}<\/div><\/div>`).join('');window.scrollTo(0,0)}function restart(){idx=0;ans=Array(Q.length).fill(null);locked=Array(Q.length).fill(false);document.getElementById('results').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();window.scrollTo(0,0)}render();<\/script><\/body><\/html>", "title": "Lavado de dinero y financiamiento al terrorismo", "count": 18, "week": "Semana 5", "area": "Área Bancaria Financiera"}, {"html": "<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Métodos de Mitigación de fraudes<\/title><style>\n*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#183047;font:16px system-ui,Segoe UI,Arial}.shell{max-width:900px;margin:24px auto;padding:0 14px}.head{background:#10365b;color:white;border-radius:16px;padding:26px}.head small{letter-spacing:.08em;color:#b8d7f2}.head h1{margin:8px 0 6px;font-size:28px}.head p{margin:5px 0;color:#e3edf7}.box{background:white;border-radius:16px;padding:26px;margin:18px 0;box-shadow:0 3px 14px #193b5610}.meta{display:flex;justify-content:space-between;color:#63798c;font-size:14px}.progress{height:8px;background:#e3edf5;border-radius:99px;overflow:hidden;margin:16px 0 24px}.bar{height:100%;background:#1682bf}.stem{font-size:19px;line-height:1.6;font-weight:650;margin:20px 0}.opt{display:block;width:100%;border:1px solid #d1dde6;background:#fff;text-align:left;padding:14px 16px;margin:10px 0;border-radius:10px;cursor:pointer;font-size:15px;line-height:1.45}.opt:hover{backgroun
